schema_version: "1.0"
kind: "standard"
id: "NDK-INFO"
title:
  cs: "XML schéma info.xml (NDK)"
description:
  cs: "Schéma informací o SIP balíčku pro tištěné dokumenty. Verze schématu 1.1 je nezávislá na verzi DMF Monografie 2.3; XSD nemá cílový jmenný prostor."
status: "normative"
verification:
  status: "verified"
  date: "2026-10-05"
  reference: "Oficiální stránka NDK uvádí pro tištěné dokumenty XSD 1.1; soubor byl přečten a porovnán s DMF. Zjištěné rozdíly jsou popsány v pravidlech."
