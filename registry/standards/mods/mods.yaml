  -
    id: "MODS-ORIGIN-PLACE-TERM-AUTHORITY"
    type: "attribute"
    version: "3.8"
    name: "placeTerm/@authority"
    title:
      cs: "Autorita místního údaje"
    definition:
      cs: "Volitelný atribut xs:string bez namespace z authorityAttributeGroup přes stringPlusLanguagePlusAuthority. V MODS 3.8 byl odstraněn starší omezený výčet; XSD nevyžaduje marccountry ani neověřuje členství kódu v autoritním slovníku."
