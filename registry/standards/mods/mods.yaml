schema_version: "1.0"
kind: "standard"
id: "MODS"
title:
  cs: "MODS – Metadata Object Description Schema"
description:
  cs: "Vybrané prvky MODS 3.8, verze citované DMF Monografie 2.3. Obecná schématová pravidla jsou oddělena od národních omezení; nejde o tvrzení o nejnovější verzi MODS."
status: "normative"
verification:
  status: "verified"
  date: "2026-10-06"
  reference: "Oficiální MODS XSD 3.8 přečteno v rozsahu titleInfo, name, role, alternativeName a etal; volba verze podle DMF Monografie 2.3, s. 5."
versions:
  -
    version: "3.8"
    status: "normative"
    namespace: "http://www.loc.gov/mods/v3"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition; nameDefinition; roleDefinition; roleTermDefinition; namePartDefinition; alternativeNameDefinition; etal; modsGroup"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
entities:
  -
    id: "MODS-NAME-PART-TYPE"
    type: "attribute"
    version: "3.8"
    name: "name/namePart/@type"
    title:
      cs: "Typ části jména"
    definition:
      cs: "Volitelný atribut namePartDefinition bez namespace. Dovoluje date, family, given a termsOfAddress; XSD nestanovuje kódy povinnosti NDK a nepodmiňuje atribut osobou."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "namePartDefinition/@type"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Ověřeny deklarace namePartDefinition, alternativeNameDefinition a etal v nameDefinition; národní povinnosti jsou vedeny odděleně."
  -
    id: "MODS-ALTERNATIVE-NAME"
    type: "element"
    version: "3.8"
    name: "name/alternativeName"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Alternativní jméno"
    definition:
      cs: "AlternativeName je v běžné jmenné větvi nameDefinition opakovatelné. AlternativeNameDefinition má opakovatelnou volbu potomků s minOccurs=0; dovoluje namePart, displayForm, affiliation, role, description a nameIdentifier, nikoli etal nebo další alternativeName."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition; alternativeNameDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Ověřeny deklarace namePartDefinition, alternativeNameDefinition a etal v nameDefinition; národní povinnosti jsou vedeny odděleně."
  -
    id: "MODS-ALTERNATIVE-NAME-PART"
    type: "element"
    version: "3.8"
    name: "name/alternativeName/namePart"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Část alternativního jména"
    definition:
      cs: "Element namePart v alternativeNameDefinition používá stejný typ namePartDefinition jako přímé jmenné části. Je opakovatelný, ale obecné XSD jeho výskyt nevyžaduje; M přidává národní předpis."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "alternativeNameDefinition; namePartDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Ověřeny deklarace namePartDefinition, alternativeNameDefinition a etal v nameDefinition; národní povinnosti jsou vedeny odděleně."
  -
    id: "MODS-NAME-ETAL"
    type: "element"
    version: "3.8"
    name: "name/etal"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Označení dalších neuvedených jmen"
    definition:
      cs: "Etal typu stringPlusLanguage může být prázdné nebo obsahovat text. Ve zvláštní větvi nameDefinition je jediným prvním elementem; následuje opakovatelná volba affiliation, role a description. Běžné jmenné potomky tato větev nepřipouští."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "etal; nameDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Ověřeny deklarace namePartDefinition, alternativeNameDefinition a etal v nameDefinition; národní povinnosti jsou vedeny odděleně."
  -
    id: "MODS-NAME"
    type: "element"
    version: "3.8"
    name: "name"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Jméno původce"
    definition:
      cs: "Opakovatelný element MODS. NameDefinition rozlišuje větev jmenných údajů a větev s etal. V první větvi se mohou opakovat namePart, role, nameIdentifier a další prvky; obecné XSD nevynucuje namePart."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "name; nameDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-NAME-TYPE"
    type: "attribute"
    version: "3.8"
    name: "name/@type"
    title:
      cs: "Typ pojmenovaného původce"
    definition:
      cs: "Volitelný atribut nameDefinition s hodnotami personal, corporate, conference a family. Národní dostupnostní povinnost není vlastností XSD."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition/@type"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-NAME-USAGE"
    type: "attribute"
    version: "3.8"
    name: "name/@usage"
    title:
      cs: "Primární použití jména"
    definition:
      cs: "Volitelný atribut typu usagePrimary má jedinou hodnotu primary. Není totožný s rolí aut ani s typem personal."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition/@usage; usagePrimary"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-NAME-PART"
    type: "element"
    version: "3.8"
    name: "name/namePart"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Část jména původce"
    definition:
      cs: "NamePart ve jmenné větvi nameDefinition je opakovatelné. NamePartDefinition dovoluje nepovinné type; jeho podmínky a povinnosti NDK nejsou totožné s obecným XSD."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition; namePartDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-NAME-IDENTIFIER"
    type: "element"
    version: "3.8"
    name: "name/nameIdentifier"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Identifikátor pojmenovaného původce"
    definition:
      cs: "NameIdentifier typu identifierDefinition je dostupný ve jmenné větvi nameDefinition a může se opakovat. Obecné MODS jej neomezuje na české národní autority."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition/nameIdentifier; globální nameIdentifier"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-NAME-ROLE"
    type: "element"
    version: "3.8"
    name: "name/role"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Role původce vůči dokumentu"
    definition:
      cs: "RoleDefinition obsahuje jeden nebo více roleTerm. Role je ve jmenné větvi nameDefinition opakovatelné; jeho národní dostupnostní povinnost z XSD neplyne."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "nameDefinition/role; roleDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-ROLE-TERM"
    type: "element"
    version: "3.8"
    name: "name/role/roleTerm"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Výraz popisující roli původce"
    definition:
      cs: "RoleTermDefinition rozšiřuje stringPlusLanguagePlusAuthority. Obecné XSD roleTerm neomezuje na slovník MARC rolí a dovoluje nepovinné type code/text."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "roleDefinition; roleTermDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-ROLE-TERM-TYPE"
    type: "attribute"
    version: "3.8"
    name: "roleTerm/@type"
    title:
      cs: "Způsob zápisu role"
    definition:
      cs: "Volitelný atribut roleTermDefinition typu codeOrText dovoluje code nebo text. Povinnost a zúžení na code v NDK je samostatné pravidlo."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "roleTermDefinition/@type; codeOrText"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-ROLE-TERM-AUTHORITY"
    type: "attribute"
    version: "3.8"
    name: "roleTerm/@authority"
    title:
      cs: "Slovník použitý pro roli"
    definition:
      cs: "Volitelný atribut xs:string přebíraný přes stringPlusLanguagePlusAuthority z authorityAttributeGroup. Obecné XSD nepředepisuje hodnotu marcrelator."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "roleTermDefinition; stringPlusLanguagePlusAuthority; authorityAttributeGroup"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace MODS XSD 3.8 pro name a role přečteny. Povinnosti NDK jsou vedeny odděleně."
  -
    id: "MODS-TITLEINFO"
    type: "element"
    version: "3.8"
    name: "titleInfo"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Názvové údaje"
    definition:
      cs: "Opakovatelný element MODS pro názvové údaje. TitleInfoDefinition používá volbu title, subTitle, partNumber, partName a nonSort s 0–n výskyty; obecné XSD nevynucuje povinný title."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfo; titleInfoDefinition"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-TITLEINFO-TYPE"
    type: "attribute"
    version: "3.8"
    name: "titleInfo/@type"
    title:
      cs: "Typ názvových údajů"
    definition:
      cs: "Nepovinný atribut s hodnotami abbreviated, translated, alternative a uniform. Hodnota primary do tohoto výčtu nepatří; usage je jiný atribut."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/@type"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-TITLE"
    type: "element"
    version: "3.8"
    name: "titleInfo/title"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Název"
    definition:
      cs: "Element title ve volbě titleInfoDefinition. Obecný model dovoluje nepřítomnost i opakování; povinnost názvu v kontextu NDK není obecným omezením XSD."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/title"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-NONSORT"
    type: "element"
    version: "3.8"
    name: "titleInfo/nonSort"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Neřadicí část názvu"
    definition:
      cs: "Element nonSort ve volbě titleInfoDefinition obsahuje neřadicí část názvu. Obecný obsahový model jej nevyžaduje a dovoluje opakování."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/nonSort"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-SUBTITLE"
    type: "element"
    version: "3.8"
    name: "titleInfo/subTitle"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Podnázev"
    definition:
      cs: "Element subTitle ve volbě titleInfoDefinition. Obecný obsahový model jej nevyžaduje a dovoluje opakování; národní dostupnostní povinnost je vedena odděleně."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/subTitle"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-PARTNUMBER"
    type: "element"
    version: "3.8"
    name: "titleInfo/partNumber"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Číslo části v názvových údajích"
    definition:
      cs: "Element partNumber ve volbě titleInfoDefinition. Není totožný s part/detail/number; obecné XSD jej nevyžaduje a dovoluje opakování."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/partNumber"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
  -
    id: "MODS-PARTNAME"
    type: "element"
    version: "3.8"
    name: "titleInfo/partName"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Název části v názvových údajích"
    definition:
      cs: "Element partName ve volbě titleInfoDefinition. Obecné XSD jej nevyžaduje a dovoluje opakování; není totožný s personálním namePart."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      section: "titleInfoDefinition/partName"
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace titleInfoDefinition v MODS XSD 3.8 přečtena; rozsah povinnosti NDK je veden samostatně."
