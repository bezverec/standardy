    type: "attribute"
    version: "3.8"
    name: "dateIssued/@point"
    title:
      cs: "Mez časového rozmezí"
    definition:
      cs: "Volitelný atribut dateDefinition s hodnotami start a end. Obecné schéma nevynucuje dvojici mezí ani nerozhoduje, zda údaje z MARC tvoří interval."
