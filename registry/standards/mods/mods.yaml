    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Datum vydání"
    definition:
      cs: "DateIssued používá dateDefinition odvozený od stringPlusLanguage, nikoli xs:date. V originInfoDefinition se může opakovat; obecné XSD nevyžaduje jeho přítomnost a nerozlišuje národní zdroje MARC."
