    type: "element"
    version: "3.8"
    name: "originInfo/dateOther"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Doplňující datum"
    definition:
      cs: "DateOther používá dateOtherDefinition rozšiřující dateDefinition a je opakovatelné v originInfo. Dědí datum jako text i volitelné atributy data; obecné XSD nepředepisuje jeho národní významy."
