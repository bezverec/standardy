      reference: "Ověřeny deklarace originInfoDefinition, placeDefinition a placeTermDefinition v MODS XSD 3.8; národní požadavky DMF jsou vedeny odděleně."
  -
    id: "MODS-ORIGIN-PLACE-TERM-TYPE"
    type: "attribute"
    version: "3.8"
    name: "placeTerm/@type"
    title:
      cs: "Způsob zápisu místa"
    definition:
      cs: "Volitelný atribut placeTermDefinition bez namespace typu codeOrText s hodnotami code a text. XSD nevynucuje jeho přítomnost ani mapování ze zdrojových polí MARC."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
