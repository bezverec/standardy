    id: "MODS-DATE-OTHER-TYPE"
    type: "attribute"
    version: "3.8"
    name: "dateOther/@type"
    title:
      cs: "Typ doplňujícího data"
    definition:
      cs: "Volitelný atribut dateOtherDefinition typu xs:string. XSD nevynucuje národní M ani výčet production, distribution a manufacture."
