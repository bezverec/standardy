      reference: "Ověřeny deklarace originInfoDefinition, placeDefinition a placeTermDefinition v MODS XSD 3.8; národní požadavky DMF jsou vedeny odděleně."
  -
    id: "MODS-ORIGIN-PLACE-TERM"
    type: "element"
    version: "3.8"
    name: "originInfo/place/placeTerm"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Textový nebo kódovaný místní údaj"
    definition:
      cs: "PlaceTermDefinition rozšiřuje stringPlusLanguagePlusAuthority; termín se může v place opakovat. Zdrojová pole MARC, dostupnostní povinnosti a vztahy k jiným údajům nejsou určeny obecným XSD."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
