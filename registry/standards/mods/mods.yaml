    version: "3.8"
    name: "dateIssued/@qualifier"
    title:
      cs: "Upřesnění povahy data"
    definition:
      cs: "Volitelný atribut dateDefinition s hodnotami approximate, inferred a questionable. Správnost sémantického přiřazení ani národní úroveň povinnosti nejsou ověřovány obecným XSD."
