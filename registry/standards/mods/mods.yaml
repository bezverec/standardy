      reference: "Ověřena deklarace agent=nameDefinition, originInfoDefinition a zděděné typy namePart/role/roleTerm v MODS XSD 3.8; požadavky DMF jsou vedeny odděleně."
  -
    id: "MODS-ORIGIN-AGENT-ROLE-TERM"
    type: "element"
    version: "3.8"
    name: "originInfo/agent/role/roleTerm"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Pojmenování role nakladatelského agenta"
    definition:
      cs: "RoleTermDefinition rozšiřuje stringPlusLanguagePlusAuthority, s nepovinným type code/text. Textový obsah nemá číselník nakladatelských rolí. Obecné XSD nerozhodne zápis distibutor/distributor a nevynucuje type=code nebo authority=marcrelator."
