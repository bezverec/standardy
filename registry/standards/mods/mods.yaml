  -
    id: "MODS-ORIGIN-AGENT"
    type: "element"
    version: "3.8"
    name: "originInfo/agent"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Entita odpovědná za vydání nebo výrobu"
    definition:
      cs: "Agent je od MODS 3.8 členem opakovatelné volby originInfoDefinition a používá nameDefinition. Obecné XSD agent nevyžaduje a nadále dovoluje publisher; národní předpis pracuje s agent samostatně."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      section: "originInfoDefinition; agent; nameDefinition"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Ověřena deklarace agent=nameDefinition, originInfoDefinition a zděděné typy namePart/role/roleTerm v MODS XSD 3.8; požadavky DMF jsou vedeny odděleně."
  -
    id: "MODS-ORIGIN-AGENT-NAME-PART"
    type: "element"
    version: "3.8"
    name: "originInfo/agent/namePart"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Jméno nakladatelského agenta"
    definition:
      cs: "NamePart v běžné větvi nameDefinition je opakovatelné, ale obecné XSD je nevyžaduje. NamePartDefinition rozšiřuje stringPlusLanguage; národní M a mapování MARC jsou samostatné požadavky."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
      page: null
      url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
