      status: "verified"
      date: "2026-10-07"
      reference: "Ověřena deklarace agent=nameDefinition, originInfoDefinition a zděděné typy namePart/role/roleTerm v MODS XSD 3.8; požadavky DMF jsou vedeny odděleně."
  -
    id: "MODS-ORIGIN-AGENT-ROLE"
    type: "element"
    version: "3.8"
    name: "originInfo/agent/role"
    namespace: "http://www.loc.gov/mods/v3"
    title:
      cs: "Role nakladatelského agenta"
    definition:
      cs: "Role je v nameDefinition opakovatelné; roleDefinition vyžaduje jeden nebo více roleTerm. XSD neobsahuje národní dostupnostní podmínku ani zákaz role pro zdrojové 264_4."
    status: "normative"
    source:
      document: "MODS XML Schema"
      version: "3.8"
