schema_version: "1.0"
kind: standard
id: MIX
title:
  cs: Metadata pro obrázky v XML (MIX)
  en: NISO Metadata for Images in XML (MIX)
description:
  cs: XML schéma pro technická metadata digitálních obrazů spravované Library of Congress pro NISO.
status: normative
verification:
  status: verified
  date: "2026-09-14"
  reference: Verze, jmenný prostor a element ověřeny proti oficiální stránce a XSD MIX 2.0.
versions:
  - version: "2.0"
    status: normative
    namespace: "http://www.loc.gov/mix/v20"
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: null
      url: "https://www.loc.gov/standards/mix/mix-home.html"
entities:
  - id: MIX-ICC-PROFILE-NAME
    type: element
    version: "2.0"
    name: iccProfileName
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: Jméno ICC profilu
      en: ICC profile name
    definition:
      cs: Jméno použitého ICC profilu; jde o lidsky čitelnou identifikaci profilu, nikoli číslo verze formátu.
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: iccProfileName
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-09-24"
      reference: Název, jmenný prostor a umístění elementu v IccProfile byly ověřeny proti MIX 2.0 a DMF Monografie 2.3.
  - id: MIX-ICC-PROFILE-VERSION
    type: element
    version: "2.0"
    name: iccProfileVersion
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: Verze ICC profilu
      en: ICC profile version
    definition:
      cs: Řetězcový element označený v MIX jako verze ICC profilu. Jeho dokumentace a historické příklady zaměňují verzi formátu profilu s názvem, označením barevného prostoru nebo rokem.
    status: disputed
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: null
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: disputed
      date: "2026-09-14"
      reference: Existence a typ elementu jsou ověřené; jeho textové vymezení je v rozporu s binárním polem verze definovaným ICC.
  - id: MIX-ICC-PROFILE-URI
    type: element
    version: "2.0"
    name: iccProfileURI
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: URI ICC profilu
      en: ICC profile URI
    definition:
      cs: URI identifikující nebo lokalizující použitý ICC profil.
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: iccProfileURI
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-09-24"
      reference: Název, jmenný prostor a umístění elementu v IccProfile byly ověřeny proti MIX 2.0 a DMF Monografie 2.3.
relations:
  - type: related_to
    target: ICC
    note:
      cs: Hodnota iccProfileVersion má vycházet z čísla verze v hlavičce ICC profilu.
