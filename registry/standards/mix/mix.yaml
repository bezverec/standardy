schema_version: "1.0"
kind: standard
id: MIX
title:
  cs: Metadata pro obrázky v XML (MIX)
  en: NISO Metadata for Images in XML (MIX)
description:
  cs: XML schéma pro technická metadata digitálních obrazů spravované Library of Congress pro NISO.
status: normative
verification:
  status: verified
  date: "2026-09-14"
  reference: Verze, jmenný prostor a element ověřeny proti oficiální stránce a XSD MIX 2.0.
versions:
  - version: "2.0"
    status: normative
    namespace: "http://www.loc.gov/mix/v20"
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: null
      url: "https://www.loc.gov/standards/mix/mix-home.html"
entities:
  - id: MIX-ICC-PROFILE-NAME
    type: element
    version: "2.0"
    name: iccProfileName
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: Jméno ICC profilu
      en: ICC profile name
    definition:
      cs: Jméno použitého ICC profilu; jde o lidsky čitelnou identifikaci profilu, nikoli číslo verze formátu.
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: iccProfileName
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-09-24"
      reference: Název, jmenný prostor a umístění elementu v IccProfile byly ověřeny proti MIX 2.0 a DMF Monografie 2.3.
  - id: MIX-ICC-PROFILE-VERSION
    type: element
    version: "2.0"
    name: iccProfileVersion
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: Verze ICC profilu
      en: ICC profile version
    definition:
      cs: Řetězcový element pro verzi použitého ICC profilu. NISO uvádí příklady vydání či označení barevného standardu; ekvivalence s číselnou verzí v ICC hlavičce není potvrzena.
    status: disputed
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: null
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: disputed
      date: "2026-10-05"
      reference: "Existence a řetězcový typ elementu jsou doložené. Příklady NISO Z39.87-2006 (R2017), § 7.1.3.2.1.2, neodpovídají ICC hlavičkové verzi; není potvrzeno, že jde o chybu, nebo o odlišný zamýšlený význam. Viz NLCR/Standard_NDK #255."
  - id: MIX-ICC-PROFILE-URI
    type: element
    version: "2.0"
    name: iccProfileURI
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: URI ICC profilu
      en: ICC profile URI
    definition:
      cs: URI identifikující nebo lokalizující použitý ICC profil.
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX)
      version: "2.0"
      page: null
      section: iccProfileURI
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-09-24"
      reference: Název, jmenný prostor a umístění elementu v IccProfile byly ověřeny proti MIX 2.0 a DMF Monografie 2.3.
  - id: MIX-IMAGE-WIDTH
    type: element
    version: "2.0"
    name: imageWidth
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Šířka obrazu v pixelech"
    definition:
      cs: "imageWidth používá positiveIntegerType odvozený z xsd:positiveInteger. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:imageWidth; positiveIntegerType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-IMAGE-HEIGHT
    type: element
    version: "2.0"
    name: imageHeight
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Výška obrazu v pixelech"
    definition:
      cs: "imageHeight používá positiveIntegerType odvozený z xsd:positiveInteger. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:imageHeight; positiveIntegerType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-COLOR-SPACE
    type: element
    version: "2.0"
    name: colorSpace
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Barevný prostor obrazu"
    definition:
      cs: "colorSpace je volitelný řetězcový element typu stringType, nejvýše jeden v PhotometricInterpretation. XSD nezavádí číselník barevných prostorů."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:PhotometricInterpretation/mix:colorSpace; stringType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-SAMPLING-FREQUENCY-PLANE
    type: element
    version: "2.0"
    name: samplingFrequencyPlane
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Referenční rovina vzorkování"
    definition:
      cs: "samplingFrequencyPlane používá typ typeOfSamplingFrequencyPlaneType s hodnotami camera/scanner focal plane, object plane, source object plane. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyPlane; typeOfSamplingFrequencyPlaneType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-SAMPLING-FREQUENCY-UNIT
    type: element
    version: "2.0"
    name: samplingFrequencyUnit
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Jednotka vzorkovací frekvence"
    definition:
      cs: "samplingFrequencyUnit používá typ typeOfSamplingFrequencyUnitType s hodnotami no absolute unit of measurement, in., cm. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit; typeOfSamplingFrequencyUnitType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-X-SAMPLING-FREQUENCY
    type: element
    version: "2.0"
    name: xSamplingFrequency
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Vzorkovací frekvence v ose X"
    definition:
      cs: "xSamplingFrequency je kontejner typu rationalType s prvky numerator a denominator typu xsd:integer. V MIX 2.0 je volitelný a nejvýše jeden; povinnost NDK je samostatná."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:xSamplingFrequency; rationalType"
      url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-Y-SAMPLING-FREQUENCY
    type: element
    version: "2.0"
    name: ySamplingFrequency
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Vzorkovací frekvence v ose Y"
    definition:
      cs: "ySamplingFrequency je kontejner typu rationalType s prvky numerator a denominator typu xsd:integer. V MIX 2.0 je volitelný a nejvýše jeden; povinnost NDK je samostatná."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
