      reference: "Ověřeno přímo proti oficiálnímu MIX 2.0 XSD: název, jmenný prostor, hierarchie, datový typ a minOccurs/maxOccurs."
  - id: MIX-BITS-PER-SAMPLE-UNIT
    type: element
    version: "2.0"
    name: bitsPerSampleUnit
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Typ číselné reprezentace vzorku"
    definition:
      cs: "bitsPerSampleUnit používá typ typeOfBitsPerSampleUnitType s hodnotami integer, floating point. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
