relations:
  - type: related_to
    target: ICC
    note:
      cs: ICC specifikuje číselnou hlavičkovou verzi. Její přímé mapování do iccProfileVersion je NDK-specifický výklad, nikoli potvrzený obecný požadavek MIX.
