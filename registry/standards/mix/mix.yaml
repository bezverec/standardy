  - id: MIX-BITS-PER-SAMPLE-VALUE
    type: element
    version: "2.0"
    name: bitsPerSampleValue
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Počet bitů na vzorek"
    definition:
      cs: "bitsPerSampleValue používá positiveIntegerType odvozený z xsd:positiveInteger. MIX 2.0 dovoluje opakované volitelné výskyty."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
      page: null
      section: "/mix:mix/mix:ImageAssessmentMetadata/mix:ImageColorEncoding/mix:BitsPerSample/mix:bitsPerSampleValue; positiveIntegerType"
