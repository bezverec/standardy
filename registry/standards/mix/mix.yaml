  - id: MIX-SAMPLES-PER-PIXEL
    type: element
    version: "2.0"
    name: samplesPerPixel
    namespace: "http://www.loc.gov/mix/v20"
    title:
      cs: "Počet složek na pixel"
    definition:
      cs: "samplesPerPixel používá positiveIntegerType odvozený z xsd:positiveInteger. MIX 2.0 dovoluje nejvýše jeden volitelný výskyt."
    status: normative
    source:
      document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
      version: "2.0"
