schema_version: "1.0"
kind: "standard"
id: "METS"
title:
  cs: "METS – Metadata Encoding and Transmission Standard"
description:
  cs: "Obecný standard pro propojení metadat a souborů digitálního objektu. Registr zachycuje vybrané prvky verze 1.9.1, na kterou odkazuje DMF Monografie 2.3 v části 1.4; nejde o tvrzení, že je nejnovější verzí METS."
status: "normative"
verification:
  status: "verified"
  date: "2026-10-05"
  reference: "Oficiální XSD 1.9.1 přečteno; volba verze podle DMF Monografie 2.3, s. 5."
versions:
  -
    version: "1.9.1"
    status: "normative"
    namespace: "http://www.loc.gov/METS/"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "metsType včetně kořene a metsHdr; fileGrpType, fileType, divType, structMapType, structLinkType, LOCATION, FILECORE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
entities:
  -
    id: "METS-DMDSEC"
    type: "element"
    version: "1.9.1"
    name: "dmdSec"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Sekce popisných metadat"
    definition:
      cs: "MetsType dovoluje 0–n dmdSec typu mdSecType. Sekce může vložit metadata pomocí mdWrap a/nebo odkázat pomocí mdRef; vlastní ID je povinné."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "metsType/dmdSec; mdSecType"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-DMDSEC-ID"
    type: "attribute"
    version: "1.9.1"
    name: "dmdSec/@ID"
    title:
      cs: "Identifikátor sekce popisných metadat"
    definition:
      cs: "MdSecType vyžaduje xs:ID jedinečné v XML dokumentu. Konvence MODSMD/DCMD není součástí obecného METS."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/@ID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-MDWRAP"
    type: "element"
    version: "1.9.1"
    name: "mdWrap"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Obálka vložených metadat"
    definition:
      cs: "MdSecType deklaruje mdWrap v xsd:all s minOccurs=0 a výchozím maxOccurs=1. Obsah tvoří volba binData nebo xmlData. Povinnost vkládat MODS/DC stanoví NDK, nikoli obecné XSD."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/mdWrap"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-MDWRAP-MDTYPE"
    type: "attribute"
    version: "1.9.1"
    name: "mdWrap/@MDTYPE"
    title:
      cs: "Druh vložených metadat"
    definition:
      cs: "Povinný atribut skupiny METADATA má číselník obsahující MODS, DC a další formáty. XSD samo nekontroluje sémantickou shodu hodnoty s obsahem xmlData."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/mdWrap; METADATA/@MDTYPE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-MDWRAP-MDTYPEVERSION"
    type: "attribute"
    version: "1.9.1"
    name: "mdWrap/@MDTYPEVERSION"
    title:
      cs: "Verze vloženého metadatového formátu"
    definition:
      cs: "Volitelný xs:string ve skupině METADATA označuje verzi metadatového formátu. XSD nepředepisuje 3.8 pro MODS ani zákaz atributu u DC."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/mdWrap; METADATA/@MDTYPEVERSION"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-MDWRAP-MIMETYPE"
    type: "attribute"
    version: "1.9.1"
    name: "mdWrap/@MIMETYPE"
    title:
      cs: "MIME typ vložených metadat"
    definition:
      cs: "Volitelný xs:string skupiny FILECORE. Hodnota text/xml a povinnost v popisné obálce jsou omezením NDK, nikoli obecným výčtem XSD."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/mdWrap; FILECORE/@MIMETYPE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-MDWRAP-XMLDATA"
    type: "element"
    version: "1.9.1"
    name: "mdWrap/xmlData"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Kontejner XML metadat"
    definition:
      cs: "V mdWrap je xmlData volitelnou větví volby s binData, nejvýše jeden výskyt. Jeho sekvence vyžaduje 1–n elementů libovolného namespace s processContents=lax; výběr MODS/DC předepisuje NDK."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "mdSecType/mdWrap/xmlData"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace i anotace oficiálního METS XSD 1.9.1 porovnány. Národní požadavky jsou odděleny v pravidlech."
  -
    id: "METS-FPTR"
    type: "element"
    version: "1.9.1"
    name: "fptr"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Odkaz strukturálního uzlu na digitální obsah"
    definition:
      cs: "DivType umožňuje 0–n fptr. Fptr má volitelný FILEID a volbu par, seq nebo area; nemusí mít potomka. Dokumentace doporučuje FILEID na fptr pouze bez těchto potomků."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/fptr"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace a dokumentace METS XSD 1.9.1 přečteny; národní omezení zůstávají oddělena v pravidlech."
  -
    id: "METS-AREA"
    type: "element"
    version: "1.9.1"
    name: "area"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Odkaz na část souboru"
    definition:
      cs: "AreaType vymezuje soubor nebo jeho část pomocí atributů. Přímá větev fptr/area má 0–1 výskyt; obecné METS dovoluje i area v par/seq. FILEID je povinný, BEGIN a BETYPE volitelné."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/fptr/area; areaType"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace a dokumentace METS XSD 1.9.1 přečteny; národní omezení zůstávají oddělena v pravidlech."
  -
    id: "METS-AREA-FILEID"
    type: "attribute"
    version: "1.9.1"
    name: "area/@FILEID"
    title:
      cs: "Soubor obsahující odkazovanou oblast"
    definition:
      cs: "Povinný xs:IDREF na file v fileSec téhož METS. Není totožný s volitelným fptr/@FILEID; omezení cílového souboru na ALTO je pravidlem NDK."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "areaType/@FILEID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace a dokumentace METS XSD 1.9.1 přečteny; národní omezení zůstávají oddělena v pravidlech."
  -
    id: "METS-AREA-BEGIN"
    type: "attribute"
    version: "1.9.1"
    name: "area/@BEGIN"
    title:
      cs: "Počátek odkazované oblasti"
    definition:
      cs: "Volitelný xs:string. Význam určuje BETYPE; při IDREF označuje ID elementu v odkazovaném strukturovaném souboru. Samotné XSD METS neověřuje ID v externím ALTO."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "areaType/@BEGIN"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace a dokumentace METS XSD 1.9.1 přečteny; národní omezení zůstávají oddělena v pravidlech."
  -
    id: "METS-AREA-BETYPE"
    type: "attribute"
    version: "1.9.1"
    name: "area/@BETYPE"
    title:
      cs: "Způsob adresování počátku a konce"
    definition:
      cs: "Volitelný atribut s výčtem způsobů adresování (například IDREF, BYTE, XPTR). Zúžení na IDREF pro blokové odkazy ALTO pochází z DMF, nikoli z obecného METS."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "areaType/@BETYPE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Deklarace a dokumentace METS XSD 1.9.1 přečteny; národní omezení zůstávají oddělena v pravidlech."
  -
    id: "METS-STRUCTLINK"
    type: "element"
    version: "1.9.1"
    name: "structLink"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Propojení strukturálních map"
    definition:
      cs: "MetsType dovoluje 0–1 structLink. StructLinkType obsahuje opakovanou volbu smLink nebo smLinkGrp; předepsané propojení logické a fyzické mapy NDK patří do pravidel."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "metsType/structLink; structLinkType"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Existence a povinnost atributů ověřeny v deklaracích oficiálního XSD METS 1.9.1; národní omezení vedena odděleně."
  -
    id: "METS-SMLINK"
    type: "element"
    version: "1.9.1"
    name: "smLink"
    namespace: "http://www.loc.gov/METS/"
    title:
      cs: "Vazba strukturálních uzlů"
    definition:
      cs: "SmLink je prázdný element v opakované volbě structLinkType. Jeho deklarace vyžaduje xlink:from a xlink:to; alternativou obecného XSD je smLinkGrp. Směr mezi konkrétními typy map stanoví NDK."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "structLinkType/smLink"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Existence a povinnost atributů ověřeny v deklaracích oficiálního XSD METS 1.9.1; národní omezení vedena odděleně."
  -
    id: "METS-SMLINK-FROM"
    type: "attribute"
    version: "1.9.1"
    name: "smLink/@xlink:from"
    namespace: "http://www.w3.org/1999/xlink"
    title:
      cs: "Zdroj strukturální vazby"
    definition:
      cs: "Povinný atribut xlink:from v deklaraci smLink. Výběr ID logického div a jeho sémantické ověření pro NDK jsou samostatné národní pravidlo."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "structLinkType/smLink/@xlink:from"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Existence a povinnost atributů ověřeny v deklaracích oficiálního XSD METS 1.9.1; národní omezení vedena odděleně."
  -
    id: "METS-SMLINK-TO"
    type: "attribute"
    version: "1.9.1"
    name: "smLink/@xlink:to"
    namespace: "http://www.w3.org/1999/xlink"
    title:
      cs: "Cíl strukturální vazby"
    definition:
      cs: "Povinný atribut xlink:to v deklaraci smLink. Omezení na ID fyzického stránkového div pro NDK je samostatné národní pravidlo."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "structLinkType/smLink/@xlink:to"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Existence a povinnost atributů ověřeny v deklaracích oficiálního XSD METS 1.9.1; národní omezení vedena odděleně."
  -
    id: "METS-STRUCTMAP-LABEL"
    type: "attribute"
    version: "1.9.1"
    name: "structMap/@LABEL"
    title:
      cs: "Popisek strukturální mapy"
    definition:
      cs: "Volitelný xs:string pro označení strukturální mapy; obecné XSD neurčuje pevnou hodnotu Physical_Structure."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "structMapType/@LABEL"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-TYPE"
    type: "attribute"
    version: "1.9.1"
    name: "div/@TYPE"
    title:
      cs: "Typ strukturálního uzlu"
    definition:
      cs: "Volitelný xs:string pro typ uzlu; obecné METS nepředepisuje číselník typů stran ani hodnotu Monograph."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/@TYPE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-LABEL"
    type: "attribute"
    version: "1.9.1"
    name: "div/@LABEL"
    title:
      cs: "Popisek strukturálního uzlu"
    definition:
      cs: "Volitelný textový název uzlu z atributové skupiny ORDERLABELS; není to pořadí ani paginace."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType; ORDERLABELS/@LABEL"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-ID"
    type: "attribute"
    version: "1.9.1"
    name: "div/@ID"
    title:
      cs: "Identifikátor strukturálního uzlu"
    definition:
      cs: "Volitelný xs:ID, jedinečný v rámci XML dokumentu; konkrétní prefixy nejsou předepsány obecným METS."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/@ID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-DMDID"
    type: "attribute"
    version: "1.9.1"
    name: "div/@DMDID"
    title:
      cs: "Vazba uzlu na popisná metadata"
    definition:
      cs: "Volitelný xs:IDREFS odkazující na dmdSec s popisnými metadaty příslušného uzlu."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/@DMDID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-ADMID"
    type: "attribute"
    version: "1.9.1"
    name: "div/@ADMID"
    title:
      cs: "Vazba uzlu na administrativní metadata"
    definition:
      cs: "Volitelný xs:IDREFS. Dokumentace METS 1.9.1 uvádí cíle rightsMD, sourceMD, techMD a digiprovMD uvnitř amdSec; samotný datový typ typ cílového elementu nerozliší."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/@ADMID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-ORDER"
    type: "attribute"
    version: "1.9.1"
    name: "div/@ORDER"
    title:
      cs: "Pořadí strukturálního uzlu"
    definition:
      cs: "Volitelný xs:integer pro numerické pořadí mezi sourozenci. XSD samo nevyžaduje začátek od 1 ani rovnost s ORDERLABEL."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType; ORDERLABELS/@ORDER"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-DIV-ORDERLABEL"
    type: "attribute"
    version: "1.9.1"
    name: "div/@ORDERLABEL"
    title:
      cs: "Označení pořadí a paginace uzlu"
    definition:
      cs: "Volitelný xs:string pro označení v původním číslovacím systému, například římské číslo; odlišný od numerického ORDER a názvu LABEL."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType; ORDERLABELS/@ORDERLABEL"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Atribut, datový typ a obecná volitelnost ověřeny v oficiálním XSD METS 1.9.1; povinnosti NDK vedeny odděleně."
  -
    id: "METS-ROOT"
    type: "element"
    version: "1.9.1"
    name: "mets"
    namespace: "http://www.loc.gov/METS/"
    title:
