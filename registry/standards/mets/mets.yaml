    type: "attribute"
    version: "1.9.1"
    name: "file/@ADMID"
    title:
      cs: "Odkazy souboru na administrativní metadata"
    definition:
      cs: "Volitelný xs:IDREFS v fileType odkazuje na sekce administrativních metadat k danému souboru; povinnost a zúžení na techMD v NDK nejsou vlastností obecného XSD."
    status: "normative"
