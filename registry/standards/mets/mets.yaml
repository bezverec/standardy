  -
    id: "METS-FPTR-FILEID"
    type: "attribute"
    version: "1.9.1"
    name: "fptr/@FILEID"
    title:
      cs: "Odkaz strukturálního uzlu na soubor"
    definition:
      cs: "Volitelný atribut xs:IDREF v divType/fptr odkazující na file. Fptr může místo něj použít area/par/seq. Obecný METS jej neomezuje na fyzickou mapu ani na konkrétní hloubku div; omezení NDK jsou v samostatných pravidlech hlavního a vedlejšího METS."
    status: "normative"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "divType/fptr/@FILEID"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
