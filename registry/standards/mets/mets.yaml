schema_version: "1.0"
kind: "standard"
id: "METS"
title:
  cs: "METS – Metadata Encoding and Transmission Standard"
description:
  cs: "Obecný standard pro propojení metadat a souborů digitálního objektu. Registr zachycuje vybrané prvky verze 1.9.1, na kterou odkazuje DMF Monografie 2.3 v části 1.4; nejde o tvrzení, že je nejnovější verzí METS."
status: "normative"
verification:
  status: "verified"
  date: "2026-10-05"
  reference: "Oficiální XSD 1.9.1 přečteno; volba verze podle DMF Monografie 2.3, s. 5."
versions:
  -
    version: "1.9.1"
    status: "normative"
    namespace: "http://www.loc.gov/METS/"
    source:
      document: "METS XML Schema"
      version: "1.9.1"
      page: null
      section: "metsType, fileGrpType, fileType, divType, LOCATION, FILECORE"
      url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
