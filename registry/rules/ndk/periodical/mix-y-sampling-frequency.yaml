schema_version: "1.0"
kind: "rule"
id: "NDK-PER-MIX-Y-SAMPLING-FREQUENCY"
title:
  cs: "Vzorkovací frekvence v ose Y"
description:
  cs: "ySamplingFrequency v technických metadatech MIX pro DMF Periodika 2.2."
national_standard:
  id: "ndk-periodical"
versions:
  -
    version: "2.2"
    status: "normative"
    target:
      entity: "MIX-Y-SAMPLING-FREQUENCY"
    relation_to_target:
      type: "restricts"
    category: "technical/sampling"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Technický požadavek na konkrétní obrazový soubor MC/PS podle oddílu 7.5.4 DMF Periodika 2.2. Nejde o bibliografický popis titulu, ročníku či čísla; AACR2/RDA jeho platnost neomezuje."
      sources:
        -
          document: "DMF Periodika"
          version: "2.2"
          page: 75
          section: "7.5.4 Technická metadata MIX — ySamplingFrequency"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_periodika_2.2_final.pdf"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "periodical"
    normative_requirement:
      cs: "Pro MC a PS je ySamplingFrequency povinná při jednotce in. nebo cm, s čitatelem a jmenovatelem."
    requirement:
      presence: "conditional"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "xpath"
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency"
          assertion: "exists"
        -
          type: "xpath"
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency/mix:numerator"
          assertion: "exists"
        -
          type: "xpath"
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency/mix:denominator"
          assertion: "exists"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "periodical"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "PS"
        -
          field: "xpath:/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit"
          operator: "in"
          value:
            - "in."
            - "cm"
    source:
      document: "DMF Periodika"
      version: "2.2"
      page: 75
      section: "7.5.4 Technická metadata MIX — ySamplingFrequency"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_periodika_2.2_final.pdf"
    references:
      -
        document: "NISO Metadata for Images in XML (MIX), XML Schema 2.0"
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency; rationalType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Přepis, povinnost MA, rozsah MC/PS a význam ověřeny v textu a vykreslené tabulce DMF Periodika 2.2 s. 75; struktura a typy proti MIX 2.0 XSD. Monografický protějšek byl zvlášť porovnán, nikoli považován za zdroj tohoto požadavku. Nástroje ani periodický SIP nebyly ověřeny."
    interpretation:
      cs: "Jde o sourozence samplingFrequencyUnit uvnitř SpatialMetrics, jak určuje XSD. Čitatel a jmenovatel jsou v DMF označeny M a v XSD mají typ xsd:integer. Hodnoty X a Y nemusí být shodné jen na základě tohoto pravidla. Pravidlo neurčuje minimální PPI ani nezakazuje frekvenci při bezrozměrné jednotce. Nulový jmenovatel nevyjadřuje použitelný poměr, ačkoli jej samotný typ xsd:integer nevylučuje. Kardinalita platí pro příslušný MIX záznam s kořenem mix:mix (namespace http://www.loc.gov/mix/v20), nikoli celý amd_mets.xml. Rozsah MC/PS nezahrnuje UC. Registr kontroly nevykonává; není tím implementován validátor SIP. Bez ověřeného periodického SIP nepřebíráme monografické XML ukázky ani ověření implementací."
    comparison:
      key: "mix.mc-ps.y-sampling-frequency"
      note:
        cs: "Ručně ověřená dvojice MIX-Y-SAMPLING-FREQUENCY pro MIX souborů MC/PS: DMF Monografie 2.3 § 7.5.4 s. 87–88 a DMF Periodika 2.2 § 7.5.4 s. 75. Shodují se evidované technické požadavky, povinnost a podmínka MC/PS i podmínka jednotky in./cm; liší se rozsah monograph/periodical. Shoda této položky není ekvivalence celých DMF, potvrzení validity souboru ani důkaz chování nástrojů."
relations:
  -
    type: "related_to"
    target: "NDK-PER-MIX-SAMPLING-FREQUENCY-UNIT"
  -
    type: "related_to"
    target: "NDK-PER-MIX-X-SAMPLING-FREQUENCY"
  -
    type: "related_to"
    target: "NDK-PER-MIX-IMAGE-HEIGHT"
  -
    type: "related_to"
    target: "NDK-MONO-MIX-Y-SAMPLING-FREQUENCY"
