schema_version: '1.0'
kind: rule
id: NDK-MONO-MODS-PAGE-GENRE-TYPE
title:
  cs: Druh stránky v atributu genre/@type
national_standard:
  id: ndk-monograph
versions:
  - version: '2.3'
    status: normative
    target:
      entity: MODS-GENRE-TYPE
    relation_to_target:
      type: restricts
    category: metadata/mods-page-characteristics
    cataloguing_scope:
      applicability: independent
      reviewed_on: '2026-11-05'
      note:
        cs: Reprezentativnost a druh digitalizované strany stanoví DMF § 7.4.1.6 a PPM 2.4; nejde o bibliografický žánr svazku
          podle AACR2/RDA. Posouzení se vztahuje k uvedené roli stránky, ne k celému namespace MODS.
      sources:
        - document: DMF Monografie
          version: '2.3'
          page: 73
          section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — genre / @type
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: Pravidla pro popis monografií
          version: '2.4'
          page: 8, 14
          section: 1.2 Typ strany; 1.2.2 Použití hodnot pro popis typu strany a typu vnitřní části
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values:
        - monograph
    normative_requirement:
      cs: Každý přímý genre v MODS záznamu jednotlivé stránky musí mít type označující druh strany podle Pravidel pro popis
        monografií. Pro vydání 2.4 jsou hodnoty uvedeny ve sloupcích Typ strany a Typ strany / Vnitřní část tabulky 1.2.2.
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      allowed_values:
        - cover
        - frontCover
        - backCover
        - appendix
        - errata
        - frontispiece
        - spine
        - impressum
        - normalPage
        - edge
        - imprimatur
        - blank
        - jacket
        - frontEndPaper
        - backEndPaper
        - frontEndSheet
        - backEndSheet
        - frontJacket
        - listOfIllustrations
        - listOfMaps
        - listOfTables
        - colophon
        - titlePage
        - flyleaf
        - bibliography
        - dedication
        - afterword
        - illustration
        - advertisement
        - map
        - sheetMusic
        - tableOfContents
        - preface
        - index
        - table
        - introduction
        - conclusion
      validations:
        - type: custom
          expression: Kontext je mods_page_genre v přímém MODS záznamu jednotlivé stránky. Každý přímý genre v MODS záznamu
            jednotlivé stránky musí mít type označující druh strany podle Pravidel pro popis monografií. Pro vydání 2.4 jsou
            hodnoty uvedeny ve sloupcích Typ strany a Typ strany / Vnitřní část tabulky 1.2.2.
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: page
        - field: element_role
          operator: equals
          value: mods_page_genre
    source:
      document: DMF Monografie
      version: '2.3'
      page: 73
      section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — genre / @type
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: DMF Monografie
        version: '2.3'
        page: 24
        section: 7.4 METS část dmdSec — povinnosti rodiče a potomků; barevné kódování AACR2/RDA
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
      - document: MODS XML Schema
        version: '3.8'
        page: null
        section: modsDefinition; modsGroup; identifierDefinition; genreDefinition; typeOfResourceDefinition; noteDefinition;
          physicalDescriptionDefinition; physicalDescriptionNote
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: Pravidla pro popis monografií
        version: '2.4'
        page: 8, 14
        section: 1.2 Typ strany; 1.2.2 Použití hodnot pro popis typu strany a typu vnitřní části
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf
    verification:
      status: verified
      date: '2026-11-05'
      reference: Vizuálně ověřeny řádky a kódy povinností DMF 2.3 s. 72–73 a legenda s. 24; přečteny příslušné deklarace MODS
        XSD 3.8. U identifikátorů doplněna kapitola 4 s. 9, u druhů stran PPM 2.4 s. 8 a vizuálně tabulka s. 14. Ověření přepisu
        není potvrzením správnosti celého SIP.
    interpretation:
      cs: Hodnota index v příkladu DMF není jediná povolená hodnota. Výčet 37 typů vychází z PPM 2.4 s. 14, nikoli z obecného
        XSD. Hodnoty vyhrazené vnitřním částem, například chapter, sem nepatří. PPM s. 8 předepisují popis uvedených druhů,
        pokud byly naskenovány; neukládají naskenovat všechny druhy. Kontrola platí i při chybějícím type. Vztah k typu v
        paginaci a ve fyzické mapě METS je věcná návaznost, ne automatická ekvivalence celých pravidel. Rozsah je přímý MODS
        záznam PAGE v hlavním METS; nevztahuje se automaticky na svazek, relatedItem ani jinou úroveň. Kardinalita platí v
        uvedeném rodiči a nepřebírá počet výskytů z ukázky. Kontext rodiče se určuje nezávisle na přítomnosti nebo správné
        hodnotě kontrolovaného potomka; neurčená role není splněním kontroly. Custom kontroly jsou deklarativní, registr je
        nad SIP nespouští.
    examples:
      - id: sip-mods-page-genre-type-0001
        title:
          cs: Druh stránky v atributu genre/@type — stránka 0001 vzorového SIP
        language: xml
        kind: source_excerpt
        code: <mods:genre xmlns:mods="http://www.loc.gov/mods/v3" type="titlePage">reprePage</mods:genre>
        note:
          cs: Doslovný výřez MODSMD_PAGE_0001 (MODS 3.8, DMF 2.3 deklarována v info.xml). První stránka obsahuje right a genre
            type=titlePage s textem reprePage; čtvrtá left a genre type=normalPage s textem page. Výřez dokládá uložené hodnoty,
            nikoli správnost přidělení UUID, reprezentativnosti nebo shodu s obrazem předlohy. Nejde o potvrzení celého SIP.
        source:
