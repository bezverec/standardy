schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-PHYSICAL-COPY-IDENTIFIER
title:
  cs: "Identifikace předlohy, které vlastník nepřiděluje signaturu"
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-IDENTIFIER
    relation_to_target:
      type: restricts
    category: metadata/mods-location
    cataloguing_rules: [aacr2, rda]
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-10-28
      note:
        cs: "Společný bibliografický předpis pro uložení popisované předlohy: černý text tabulky s. 58 podle legendy s. 24 nerozlišuje AACR2/RDA. Nejde o tvrzení, že každý předpis v namespace MODS závisí na katalogizaci."
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: 58
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — location"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: mandatory
    obligation_source: prose
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pokud vlastník signatury vůbec nepřiděluje, a proto signatura neexistuje, musí metadata obsahovat jiný jednoznačný identifikátor konkrétní fyzické předlohy; DMF jako příklad uvádí čárový kód či přírůstkové číslo v identifier."
    requirement:
      presence: required
      validations:
        - type: custom
          expression: "Z nezávislých údajů o vlastníkovi ověřit, že signatury vůbec nepřiděluje. Potom požadovat jiný jednoznačný identifikátor použitého fyzického exempláře v metadatech; příkladem je mods:identifier s typem barcode nebo accession. Pouhé ISBN vydání, identifikátor instituce nebo UUID digitálního objektu nestačí bez doložení, že jednoznačně identifikuje konkrétní fyzickou předlohu."
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_record
        - field: owner_assigns_shelfmarks
          operator: equals
          value: false
    source:
      document: DMF Monografie
      version: "2.3"
      page: 58
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — location"
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: modsGroup; locationDefinition; physicalLocationDefinition; authorityAttributeGroup; shelfLocator; urlDefinition; identifierDefinition
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: location; physicalLocation; shelfLocator; url
        url: https://www.loc.gov/standards/mods/userguide/location.html
    verification:
      status: verified
      date: 2026-10-28
      reference: "Vizuálně ověřena tabulka DMF 2.3 s. 58 a legenda s. 24, deklarace MODS XSD 3.8 a výklad LOC location. Ověřený přepis neprokazuje správnost údajů konkrétního SIP ani implementaci validátoru."
    interpretation:
      cs: "Jde o slovní povinnost, nikoli nový kód M ani převod MA u shelfLocator. Podmínka owner_assigns_shelfmarks=false se nesmí odvozovat z absence shelfLocator nebo chybějící signatury v katalogu. Příklady barcode/accession nejsou uzavřený číselník ani důvod vynucovat současně oba typy. Cíl identifier zachycuje příklad XML řešení; pramen požaduje identifikaci v metadatech a nepřikazuje tento jediný způsob zápisu. Rozsah je přímé location MODS svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem/location, holdingSimple/copyInformation, titul vícesvazku, příloha nebo stránka. Kardinalita se vztahuje k uvedenému rodiči, ne k celému SIP. Dostupnost a vlastnosti fyzické předlohy se zjišťují nezávisle na cílovém XML; neznámý kontext není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-LOCATION
