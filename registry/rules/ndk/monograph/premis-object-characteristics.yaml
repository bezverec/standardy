schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-OBJECT-CHARACTERISTICS"
title:
  cs: "Technické charakteristiky objektu"
description:
  cs: "Požadavek DMF Monografie 2.3 na souborové objekty PREMIS 2.2 v technických metadatech stránky (MC, PS a ALTO)."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-OBJECT-CHARACTERISTICS"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-object"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Souborový objekt obsahuje alespoň jeden blok technických charakteristik."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Ověřit alespoň jeden objectCharacteristics v objektu typu file a posoudit všechny bloky, nejen první."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "PS"
            - "ALTO"
        -
          field: "premis_object_type"
          operator: "equals"
          value: "file"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 77
      section: "7.5.1 PREMIS Object — objectCharacteristics"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "file/objectCharacteristics (1–n); objectCharacteristicsComplexType"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "75–76"
        section: "Legenda povinností a rozsah PREMIS Object"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    examples:
      -
        id: "sip-premis-object-characteristics-mc"
        title:
          cs: "Technické charakteristiky objektu – MC v OBJ_003"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:objectCharacteristics xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:compositionLevel>0</premis:compositionLevel>
            <premis:fixity>
              <premis:messageDigestAlgorithm>MD5</premis:messageDigestAlgorithm>
              <premis:messageDigest>2f6a5856f32ad60c5e68989beafbdef8</premis:messageDigest>
              <premis:messageDigestOriginator>Utility GeneratePremis</premis:messageDigestOriginator>
            </premis:fixity>
            <premis:size>3523405</premis:size>
            <premis:format>
              <premis:formatDesignation>
                <premis:formatName>image/jp2</premis:formatName>
                <premis:formatVersion>1.0</premis:formatVersion>
              </premis:formatDesignation>
              <premis:formatRegistry>
                <premis:formatRegistryName>PRONOM</premis:formatRegistryName>
                <premis:formatRegistryKey>x-fmt/392</premis:formatRegistryKey>
              </premis:formatRegistry>
            </premis:format>
            <premis:creatingApplication>
              <premis:creatingApplicationName>Kakadu</premis:creatingApplicationName>
              <premis:creatingApplicationVersion>8.6.1</premis:creatingApplicationVersion>
              <premis:dateCreatedByApplication>2026-06-25T08:41:21</premis:dateCreatedByApplication>
            </premis:creatingApplication>
          </premis:objectCharacteristics>
        note:
          cs: "Záznam MC je vybrán podle identity objektu OBJ_003, nikoli podle chybného ADMID ukázkového METS. Velikost 3523405 B a MD5 byly porovnány se skutečným MC.  Výřez není potvrzením validity SIP ani ověřením přiřazení PUID nebo slovníku identifikátorů."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='OBJ_003']/mets:mdWrap/mets:xmlData/premis:object/premis:objectCharacteristics"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          premis: "info:lc/xmlns/premis-v2"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 75–78 DMF Monografie 2.3 a porovnán s oficiálním XSD PREMIS 2.2. Výřezy pocházejí z dodaného SIP; nejde o výsledek externího validátoru."
    interpretation:
      cs: "Blok je opakovatelný. Charakteristiky patří konkrétnímu souborovému objektu, nikoli automaticky všem reprezentacím téže stránky. Kardinalita platí v každém bezprostředním rodiči uvedené cesty. Kód M je převzat z DMF; číselná volitelnost obecného XSD jej neruší. file_role ALTO odpovídá označení XML v tabulce; OCR.TXT a UC do této skupiny nespadají. premis_object_type znamená rozlišený typ file v namespace PREMIS, ne doslovný prefix xsi:type. Podmínka nesmí záviset na existenci kontrolovaného prvku. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-CREATING-APPLICATION"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-COMPOSITION-LEVEL"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-FIXITY"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-SIZE"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-FORMAT"
