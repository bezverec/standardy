schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PARTS-PAGE"
title:
  cs: "Volitelná stránka v logické mapě"
description:
  cs: "Vnitřní logické členění monografií podle DMF 2.3: kapitoly, obrazy, volitelné logické stránky a vazby na fyzické strany; bez implementace blokových odkazů ALTO."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-internal-parts"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: "94–95"
          section: "7.7.1.2.1 — upozornění PAGE a řádek PAGE"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "optional"
    obligation_code: "O"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Úroveň PAGE v logické mapě je volitelná; pokud je použita, představuje nejnižší úroveň logického členění."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Nehlásit chybu pouze kvůli absenci logických PAGE. Jsou-li vložena, ověřit jejich umístění pod vyššími logickými celky; kapitola nebo obraz nesmějí být podřízeny logické stránce. Povinné fyzické stránky zůstávají zachovány."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "in"
          value:
            - "internal_parts_pages"
            - "internal_parts_alto"
        -
          field: "structmap_type"
          operator: "equals"
          value: "LOGICAL"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "94–95"
      section: "7.7.1.2.1 — upozornění PAGE a řádek PAGE"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType; divType; ORDERLABELS; structLinkType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 4
        section: "1.3 Dohoda mezi dodavatelem dat a zadavatelem — granularita záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 98
        section: "7.7.1.2.2 Varianta vnitřního popisu bez vazeb na bloky ALTO"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s DMF 2.3, s. 4, 93–99, včetně vizuální kontroly tabulek a s deklaracemi METS XSD 1.9.1. U TYPE je ověřena existence rozporu, nikoli jedna závazná hodnota. Externí validátor nebyl spuštěn."
    interpretation:
      cs: "Volitelnost O je výslovně v tabulce a potvrzena prózou. Logická PAGE není fyzický stránkový div a její absence neruší structLink. Zápis TYPE s pořadovým číslem v řádku PAGE se liší od označení úrovně PAGE v próze; zde nestanovujeme číselník TYPE. Samostatné uzly pro tentýž obsah potřebují různá XML ID. Rozsah vnitřního popisu vychází ze zadání projektu (§ 1.3), nikoli z pouhé existence nebo absence uzlů. Strukturální role vyjadřuje význam uzlu, ne shodu jeho kontrolovaného TYPE či prefixu ID. Custom kontroly registr nevykonává. Vzorový SIP bez kapitol tuto variantu nedokládá; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-LOGICAL-MAP"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-DIV-ID"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-PART-PAGE-COVERAGE"
