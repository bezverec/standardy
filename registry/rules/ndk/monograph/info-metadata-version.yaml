schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-METADATA-VERSION"
title:
  cs: "Verze metadatové specifikace"
description:
  cs: "Požadavek na /info/metadataversion v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "NDK-INFO-METADATA-VERSION"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na správu, inventář nebo integritu SIP v info.xml, nikoli na bibliografickou katalogizaci předlohy."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 17
          section: "7.1 Soubor info.xml — metadataversion"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "metadataversion určuje verzi specifikace použitou při zpracování balíčku."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "xpath"
          expression: "/info/metadataversion"
          assertion: "exists"
      allowed_values:
        - "1.1"
        - "1.1.1"
        - "1.1.2"
        - "1.1.3"
        - "1.2"
        - "1.3"
        - "1.3.1"
        - "1.3.2"
        - "1.4"
        - "2.0"
        - "2.1"
        - "2.2"
        - "2.3"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 17
      section: "7.1 Soubor info.xml — metadataversion"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/metadataversion"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
    examples:
      - id: "sip-75faba8d-info-metadata-version"
        title:
          cs: "Deklarovaná verze DMF"
        language: xml
        kind: source_excerpt
        code: |-
          <metadataversion>2.3</metadataversion>
        note:
          cs: "Balíček deklaruje verzi 2.3. Samotná deklarace nepotvrzuje soulad s touto verzí."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "0ede408570bb97daf563f92667c17a021daeaeba5ed3aa9f24b400f8fa84059c"
        source_xpath: "/info/metadataversion"
        namespaces: {}
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 17. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "DMF 2.3 vypočítává i starší přípustné verze. Verze tohoto pravidla proto sama neznamená, že každá hodnota elementu musí být 2.3. XSD obsahuje pouze xs:string."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-ROOT"
