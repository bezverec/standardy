schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ALTERNATIVE-NAME-PART"
title:
  cs: "Jmenný obsah alternativního jména"
description:
  cs: "Rozvedení jmenných údajů svazku jednosvazkové monografie podle DMF 2.3: části osobního jména, alternativní jméno a samostatná konstrukce etal."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ALTERNATIVE-NAME-PART"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-name-details"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Povinný obsah použitého alternativeName; stejné pravidlo DMF pro obě katalogizace, nikoli pokyn, kdy vytvářet samostatnou autoritu."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 50
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — části jména, alternativeName a etal"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každé použité alternativeName obsahuje namePart s alternativním jménem."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V každém uvedeném alternativeName požadovat neprázdný přímý namePart s alternativním jménem. NamePart přímo pod nadřazeným name ani samotné nameIdentifier uvnitř alternativeName tento požadavek nesplňuje."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_contributor_alternative_name"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 50
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — části jména, alternativeName a etal"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "nameDefinition; namePartDefinition; alternativeNameDefinition; etal"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s textem a vykreslenou tabulkou s. 49–50 DMF 2.3 a s deklaracemi MODS XSD 3.8. Ověřeny rozdíly MA/RA/O/M a slovní zákaz. Nejde o validaci SIP nebo implementace nástroje."
    interpretation:
      cs: "M se uplatní uvnitř existujícího volitelného kontejneru, bez další podmínky dostupnosti. Obecné alternativeNameDefinition v XSD má volbu potomků s minOccurs=0, takže samo namePart nevynucuje. Zdejší kontext je odlišný od MA pro name/namePart; typové povinnosti přímých jmenných částí se sem automaticky nekopírují. Platí jen pro přímé jmenné údaje o odpovědnosti ve svazku jednosvazkové monografie, nikoli subject/name, relatedItem/name nebo originInfo/agent. Kontexty a dostupnost se určují z nezávislého zdrojového popisu, nikoli z přítomnosti či správnosti kontrolovaného atributu; neznámá dostupnost není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ALTERNATIVE-NAME"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-NAME-PART"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ETAL"
