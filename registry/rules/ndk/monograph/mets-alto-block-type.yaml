schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-ALTO-BLOCK-TYPE"
title:
  cs: "Typ logické části odkazující na blok"
description:
  cs: "Blokové vazby logické struktury METS do souborů ALTO podle DMF Monografie 2.3, oddělené od fyzických odkazů na celé soubory a od výčtů stran."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-TYPE"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-alto-links"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: "93, 95–98"
          section: "7.7.1.2.1 Logická struktura s vazbou na ALTO bloky"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Dílčí logický div používá typ odpovídající významu textového nebo obrazového bloku uvedený v tabulce DMF."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Ověřit TYPE dílčího div a jeho shodu s významem části: TITLE, SUBTITLE, AUTHOR, TRANSLATOR, NORMAL_TEXT, NOTE, CAPTION, PICT_AUTHOR, PICT_TITLE nebo IMAGE. Pouhé členství v číselníku nestačí, pokud typ neodpovídá obsahu."
      allowed_values:
        - "TITLE"
        - "SUBTITLE"
        - "AUTHOR"
        - "TRANSLATOR"
        - "NORMAL_TEXT"
        - "NOTE"
        - "CAPTION"
        - "PICT_AUTHOR"
        - "PICT_TITLE"
        - "IMAGE"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "equals"
          value: "internal_parts_alto"
        -
          field: "structmap_type"
          operator: "equals"
          value: "LOGICAL"
        -
          field: "logical_content_role"
          operator: "in"
          value:
            - "text_block"
            - "image_block"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "93, 95–98"
      section: "7.7.1.2.1 Logická struktura s vazbou na ALTO bloky"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType/fptr; areaType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "ALTO XML Schema"
        version: "2.0"
        page: null
        section: "TextBlock; ComposedBlock; BlockType/@ID"
        url: "https://www.loc.gov/standards/alto/v2/alto-2-0.xsd"
      -
        document: "ALTO XML Schema"
        version: "4.4"
        page: null
        section: "TextBlock; ComposedBlock; BlockType/@ID"
        url: "https://www.loc.gov/standards/alto/v4/alto-4-4.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "4–5"
        section: "1.3 Granularita popisu; 1.4 Verze standardů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "DMF 2.3, s. 93 a vizuálně ověřené s. 95–98; deklarace METS 1.9.1 a ALTO 2.0/4.4 porovnány. Ukázky mají XPath a SHA-256. Ověřen přepis požadavků a původ výřezů, nikoli validita celého SIP nebo implementace nástrojů."
    interpretation:
      cs: "Nejde o úplný číselník všech logických div. CHAPTER, CHAPTER_PART, PICTURE, PAGE, VOLUME a MONOGRAPH jsou jiné strukturální role; nejsou tímto pravidlem plošně zakázány. Číselník nepředepisuje existenci všech deseti částí. PICTURE pro stránku pouze s obrazem je řešen odděleně pravidlem IMAGE-BLOCK. Platí pouze pro zvolený režim internal_parts_alto. Role bloku vychází z významu popisovaného obsahu, nikoli z existence kontrolovaného odkazu nebo správně vyplněného TYPE. Nevyžaduje se výskyt všech druhů bloků v každé knize; pravidlo řeší vazbu již popisovaného bloku. Kódy povinnosti uzlů v tabulce se nekopírují k těmto vazebním požadavkům. Custom kontroly registr nevykonává; externí validátor ani implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-CHAPTER"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-PART-PAGE-COVERAGE"
  -
    type: "related_to"
    target: "NDK-MONO-METS-ALTO-BEGIN"
