schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-DIV-ID"
title:
  cs: "Jednoznačná ID svazku a stran fyzické mapy"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-ID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 92
          section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Rodičovský div svazku i každý stránkový div ve fyzické mapě má vlastní ID."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat ID na rodičovském div i na každém stránkovém div fyzické mapy; ověřit lexikální podobu xs:ID a jedinečnost v celém XML dokumentu, nejen mezi stránkami."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "in"
          value:
            - "volume"
            - "page"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType/@ID; xs:ID; optional"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
      -
        id: "sip-main-mets-physical-div-id-1"
        title:
          cs: "První fyzická stránka"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:div ID="DIV_P_PAGE_0000" ORDER="1" ORDERLABEL="[1]" TYPE="titlePage" xmlns:mets="http://www.loc.gov/METS/">
            <mets:fptr FILEID="mc_0001" />
            <mets:fptr FILEID="uc_0001" />
            <mets:fptr FILEID="alto_0001" />
            <mets:fptr FILEID="txt_0001" />
            <mets:fptr FILEID="amd_0001" />
          </mets:div>
        note:
          cs: "Přesný výřez dodaného SIP, nikoli univerzální šablona nebo potvrzení validity balíčku. Související cíle a další části dokumentu mohou ležet mimo tento výřez."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — fyzická mapa a související metadata"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:structMap[@TYPE=\"PHYSICAL\"]/mets:div/mets:div[@ID=\"DIV_P_PAGE_0000\"]"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami 92–93 DMF 2.3 a s XSD METS 1.9.1. Typy stran doplněny podle tabulky PPM 2.4, s. 14; paginace podle s. 4–7 a tabulky PAGE v DMF, s. 73. Vzor ověřen XPath a SHA-256; externí validátor ani nástrojové implementace nebyly testovány."
    interpretation:
      cs: "Prefixy DIV_P_0000 a DIV_P_PAGE_0000 jsou příklady ze vzoru, nikoli povinná hodnota ani počet číslic stanovený § 7.7.1.1. ID není ORDER, ORDERLABEL, identifikátor souboru ani UUID dokumentu. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Úrovně volume/page označují pozici div ve fyzické mapě, nikoli testovanou hodnotu TYPE; hlavní a vedlejší METS zůstávají oddělené. Custom kontroly registr nevykonává, jsou popisem pro budoucí implementaci."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-PHYSICAL-VOLUME-DIV"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PHYSICAL-PAGES"
  -
    type: "related_to"
    target: "NDK-MONO-METS-FILE-ID"
