schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ORIGIN-AGENT-ROLE-TERM"
title:
  cs: "Pojmenování role — nejasný zápis distributora v DMF"
description:
  cs: "Nakladatelé, výrobci a další entity v originInfo svazku jednosvazkové monografie podle DMF 2.3; odděleně od autorů a agentů digitalizace."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "ambiguous"
    target:
      entity: "MODS-ORIGIN-AGENT-ROLE-TERM"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin-agents"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Použitá role musí obsahovat roleTerm. DMF uvádí producer pro 264_0, publisher pro 260$b/264_1, distibutor pro 264_2 a manufacturer pro 260$f/264_3; zápis distibutor je doložen v PDF a je pravděpodobným překlepem."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Požadovat roleTerm v použité role mimo 264_4. Ověřit význam podle zdroje: 264_0 → producer; 260$b/264_1 → publisher; 260$f/264_3 → manufacturer. U 264_2 je zamýšlenou funkcí distributor, ale DMF tiskne distibutor: nevynášet automatický verdikt mezi distibutor a distributor a neprovádět automatickou opravu. Nejde o schválení libovolného řetězce."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_origin_agent_role"
        -
          field: "origin_copyright_notice"
          operator: "equals"
          value: false
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 52
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — originInfo/agent, namePart, role a roleTerm"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "originInfoDefinition; agent; nameDefinition; namePartDefinition; roleDefinition; roleTermDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 264"
        version: "July 2022"
        page: null
        section: "Second Indicator — Function of entity; $b"
        url: "https://www.loc.gov/marc/bibliographic/bd264.html"
      -
        document: "MARC 21 Bibliographic — 260"
        version: "September 2011"
        page: null
        section: "$b; $f"
        url: "https://www.loc.gov/marc/bibliographic/bd260.html"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Přepis ověřen proti textu i vykreslené tabulce s. 52 DMF 2.3, MODS XSD 3.8 a významům MARC 260/264. U distibutor ověřen tisk zdroje, nikoli závazná oprava. Ukázky ukotveny XPath a SHA-256; původní katalogizační MARC ani externí implementace nebyly ověřeny."
    interpretation:
      cs: "Povinnost M roleTerm je jasná; status ambiguous zachycuje nejistotu přesného národního zápisu distributora. Pravidlo záměrně nemá allowed_values, aby neuzavřelo překlep jako jediný správný zápis ani nevydávalo distributor za potvrzenou opravu DMF. Slova rolí producer/publisher/manufacturer se nezaměňují s eventType production/publication/manufacture. Obecné MODS rozšiřuje textový typ bez tohoto číselníku; XSD nerozhodne překlep. Větve producer a publisher platí i přes spornou distributorskou větev. Oprava vydavatele DMF ani chování externích nástrojů nebyly ověřeny. Kontext je omezen na agent v přímém originInfo MODS záznamu svazku jednosvazkové monografie, nikoli na top-level name, subject/name, relatedItem nebo PREMIS Agent. Dostupnost a funkce zdrojového údaje se určují nezávisle z katalogu či předlohy, ne z přítomnosti nebo správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    discrepancies:
      -
        cs: "DMF Monografie 2.3, s. 52, tiskne distibutor pro 264_2. Pravděpodobně jde o překlep ve slově distributor, nikoli o jinou funkci. Přesný opravený národní zápis není v ověřených podkladech potvrzen vydavatelem. Obecné MODS XSD oba řetězce umožňuje; nejde o ověřené chování validátoru."
    examples:
      -
        id: "sip-mods-origin-agent-role-term"
        title:
          cs: "Textová role publisher"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:roleTerm xmlns:mods=\"http://www.loc.gov/mods/v3\">publisher</mods:roleTerm>"
        note:
          cs: "Doložený výřez agent z originInfo svazku vzorového SIP. Záznam uvádí AACR a roleTerm publisher bez type a authority. Ukázka neprokazuje převod původního MARC, distributorskou ani copyright větev či validitu celého SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, originInfo/agent"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:originInfo/mods:agent/mods:role/mods:roleTerm"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-07"
