schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ALTERNATIVE-NAME"
title:
  cs: "Alternativní jméno stejného původce"
description:
  cs: "Rozvedení jmenných údajů svazku jednosvazkové monografie podle DMF 2.3: části osobního jména, alternativní jméno a samostatná konstrukce etal."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ALTERNATIVE-NAME"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-name-details"
    obligation: "optional"
    obligation_code: "O"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Alternativní jméno stejného původce lze uvést v kontejneru alternativeName."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Je-li alternativeName použito, musí popisovat alternativní jméno stejné entity, například pseudonym či přezdívku; nesmí nahrazovat dalšího tvůrce samostatným alternativním jménem současného původce."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_contributor_name"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 50
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — části jména, alternativeName a etal"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "nameDefinition; namePartDefinition; alternativeNameDefinition; etal"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s textem a vykreslenou tabulkou s. 49–50 DMF 2.3 a s deklaracemi MODS XSD 3.8. Ověřeny rozdíly MA/RA/O/M a slovní zákaz. Nejde o validaci SIP nebo implementace nástroje."
    interpretation:
      cs: "O se nemění na MA pouze proto, že alternativní jméno existuje ve zdroji. Kontejner může být opakován pro více alternativních jmen. Z řádku DMF neodvozujeme povinné altType ani jeho uzavřený číselník. Obecné MODS nepovoluje rekurzivní alternativeName. Platí jen pro přímé jmenné údaje o odpovědnosti ve svazku jednosvazkové monografie, nikoli subject/name, relatedItem/name nebo originInfo/agent. Kontexty a dostupnost se určují z nezávislého zdrojového popisu, nikoli z přítomnosti či správnosti kontrolovaného atributu; neznámá dostupnost není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-NAME"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ALTERNATIVE-NAME-PART"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ETAL"
