schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-EDITION"
title:
  cs: "Údaj o vydání předlohy"
description:
  cs: "Doplňující údaje o vzniku a vydávání předlohy v MODS svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-EDITION"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin-completion"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Doporučené edition z MARC 250$a není na s. 53 omezeno na jeden režim. Jde o společné cílové pole; konkrétní zápis údaje o vydání se může podle katalogizačních pravidel lišit."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 53
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — copyrightDate, dateCreated, edition a issuance (pokračování s. 54)"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Údaj o vydání předlohy se doporučeně přebírá z MARC 250$a do originInfo/edition."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit edition podle zdrojového MARC 250$a. Zachovat textový význam údaje; nevynucovat celé číslo ani nedoplňovat první vydání jen kvůli absenci 250. Nezaměnit edition s číslem svazku v partNumber, s edicí ve smyslu nakladatelské řady ani s verzí digitálního souboru. Rozsah tohoto pravidla automaticky nepřipojuje 250$b."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 53
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — copyrightDate, dateCreated, edition a issuance (pokračování s. 54)"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "originInfoDefinition; dateDefinition; edition; issuanceDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 250"
        version: "July 2022"
        page: null
        section: "$a — Edition statement; $b — Remainder of edition statement"
        url: "https://www.loc.gov/marc/bibliographic/bd250.html"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Přepis ověřen vizuálně proti DMF 2.3 s. 53–54 a legendě s. 24, deklaracím MODS XSD 3.8 a citovaným významům polí MARC. Ověření přepisu neřeší nejasnosti DMF; původní MARC ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "MARC 250$a může být textové označení vydání, ne pouze jeho pořadové číslo. Společné mapování AACR2/RDA neopravňuje převádět formulaci mezi režimy bez podkladu. MODS edition je textový stringPlusLanguagePlusSupplied, nikoli číselný typ. R ponechává minimum 0; nevytváříme prázdné edition tam, kde údaj není. Rozsah tvoří přímá originInfo MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, subject, stránka nebo titul vícesvazku. Kontext a zdrojové údaje se zjišťují nezávisle z katalogu či předlohy, nikoli z přítomnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGININFO"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-PARTNUMBER"
