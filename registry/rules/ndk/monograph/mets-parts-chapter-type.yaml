schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PARTS-CHAPTER-TYPE"
title:
  cs: "Typ textového oddílu — rozpor zápisu v DMF"
description:
  cs: "Vnitřní logické členění monografií podle DMF 2.3: kapitoly, obrazy, volitelné logické stránky a vazby na fyzické strany; bez implementace blokových odkazů ALTO."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "ambiguous"
    target:
      entity: "METS-DIV-TYPE"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-internal-parts"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Textový oddíl je typově označen jako CHAPTER; DMF však nejednotně popisuje připojení pořadového čísla k hodnotě TYPE."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat atribut TYPE textového oddílu. Kvůli rozporu textu a tabulky nevyhodnocovat zápis CHAPTER versus CHAPTER_0001 jako jednoznačný sémantický verdikt podle tohoto pravidla; neprovádět automatickou opravu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "in"
          value:
            - "internal_parts_pages"
            - "internal_parts_alto"
        -
          field: "structmap_type"
          operator: "equals"
          value: "LOGICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "chapter"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "93, 95"
      section: "7.7.1.2.1 — CHAPTER, řádek TYPE a navazující text"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType; divType; ORDERLABELS; structLinkType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 4
        section: "1.3 Dohoda mezi dodavatelem dat a zadavatelem — granularita záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 98
        section: "7.7.1.2.2 Varianta vnitřního popisu bez vazeb na bloky ALTO"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s DMF 2.3, s. 4, 93–99, včetně vizuální kontroly tabulek a s deklaracemi METS XSD 1.9.1. U TYPE je ověřena existence rozporu, nikoli jedna závazná hodnota. Externí validátor nebyl spuštěn."
    interpretation:
      cs: "Próza na s. 93 a navazující popis na s. 95 používají TYPE=CHAPTER. Řádek TYPE tabulky na s. 95 uvádí typ s pořadovým číslem. Obecné XSD dovoluje libovolný řetězec; nerozhodne správný národní zápis. Pravidlo nemá allowed_values ani regex číslované hodnoty. Kód M patří uzlu CHAPTER, nikoli samostatně vytištěnému řádku TYPE. Rozsah vnitřního popisu vychází ze zadání projektu (§ 1.3), nikoli z pouhé existence nebo absence uzlů. Strukturální role vyjadřuje význam uzlu, ne shodu jeho kontrolovaného TYPE či prefixu ID. Custom kontroly registr nevykonává. Vzorový SIP bez kapitol tuto variantu nedokládá; implementace nástrojů nebyly ověřeny. Číslování dává smysl pro jedinečné ID různých kapitol; více uzlů může sdílet stejný TYPE=CHAPTER. Pravděpodobně jde o redakční záměnu příkladu ID za TYPE, nikoli o nutnost odlišného typu pro každou kapitolu. Tato interpretace není potvrzenou opravou vydavatele DMF."
    discrepancies:
      -
        cs: "DMF 2.3, s. 95: řádek TYPE spojuje CHAPTER s pořadovým číslem (příklad CHAPTER_0001), zatímco próza s. 93 i následující text s. 95 pracují s TYPE=CHAPTER. Číslování ID a TYPE se nesmí bez vysvětlení zaměnit. Rozpor je doložen v prameni; nejde o ověřené chování validátoru."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-LOGICAL-MAP"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-CHAPTER"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-DIV-ID"
