schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-NAME"
title:
  cs: "Původci jednosvazkové monografie"
description:
  cs: "Pojmenovaní původci a jejich role ve svazku jednosvazkové monografie podle DMF 2.3; samostatně od názvových údajů, subject/name a metadat digitalizačních agentů."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-NAME"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-names"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Dostupné údaje o odpovědnosti za svazek se zapisují do name podle polí 1XX a 7XX MARC21."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Podle dostupného zdrojového popisu požadovat přímé mods:name pro jednotlivé pojmenované původce svazku. Zachovat i další tvůrce a jejich role; nepřevádět jen prvního autora. Subject/name, relatedItem/name ani údaj o digitalizačním operátorovi požadavek nenahrazují."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
        -
          field: "contributor_metadata_available"
          operator: "equals"
          value: true
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 49
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — name a role"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "nameDefinition; namePartDefinition; roleDefinition; roleTermDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s textem a vykreslenými tabulkami s. 49–50 DMF 2.3, deklaracemi MODS XSD 3.8 a seznamem MARC rolí LOC. XML výřezy jsou ukotveny XPath a SHA-256. Nejde o validaci celého SIP, autoritního záznamu ani implementace nástroje."
    interpretation:
      cs: "MA nevytváří povinného autora u dokumentu bez dostupných údajů o původci. Obsah polí 1XX a 7XX je třeba věcně vyhodnotit; ne každý výskyt 7XX je automaticky jméno osoby. Nejde o mechanický převod MARC 1:1 ani o náhradu jmenných údajů textem poznámky. Samostatná zástupná větev etal není explicitně pojmenovaný původce. Kontexty contributor označují jmenné údaje o odpovědnosti přímo pod MODS záznamem svazku jednosvazkové monografie, ne subject, relatedItem, originInfo nebo PREMIS Agent. Dostupnost se zjišťuje nezávisle ze zdroje; nepřítomnost pole v XML není důkaz nedostupnosti a neznámá hodnota není false. Custom kontroly registr nevykonává."
    examples:
      -
        id: "sip-mods-names-name"
        title:
          cs: "Původce a jeho role — úplný jmenný záznam"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mods:name xmlns:mods="http://www.loc.gov/mods/v3" type="personal" usage="primary">
                      <mods:namePart>Mařík, J.</mods:namePart>
                      <mods:role>
                        <mods:roleTerm authority="marcrelator" type="code">aut</mods:roleTerm>
                      </mods:role>
                      <mods:nameIdentifier>jx20101005005</mods:nameIdentifier>
                    </mods:name>
        note:
          cs: "Úplný vybraný uzel vzorového SIP, bez změny hodnot. Dokládá zápis původce Mařík, J. a související údaje; neprokazuje shodu s původním MARC, správnost autoritního přiřazení nebo validitu celého SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, jméno původce"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:name"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-06"
relations:
