schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-DATE-ISSUED-QUALIFIER"
title:
  cs: "Doporučené upřesnění nejistého nebo odvozeného data"
description:
  cs: "Datum vydání a doplňující data předlohy v MODS svazku jednosvazkové monografie podle DMF 2.3; význam dat a povinnosti oddělené od obecného XSD."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-DATE-ISSUED-QUALIFIER"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin-dates"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Datum vydání lze doporučeným qualifier upřesnit: approximate pro nepřesné datum, inferred pro datum odvozené z jiného zdroje a questionable pro sporné datum."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: 1
      allowed_values:
        - "approximate"
        - "inferred"
        - "questionable"
      validations:
        -
          type: "custom"
          expression: "Doporučit odpovídající qualifier, je-li třeba upřesnit povahu data: approximate → nepřesné, inferred → odvozené z jiného zdroje, questionable → sporné. Použitou hodnotu porovnat se zdrojovým popisem, nikoli pouze s číselníkem. Nevynucovat qualifier u známého přesného data a neodvozovat automaticky inferred jen z hranatých závorek."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_date_issued"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 53
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — dateIssued, jeho atributy a dateOther"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "originInfoDefinition; dateIssued; dateDefinition; dateOther; dateOtherDefinition; stringPlusLanguage"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 008 All Materials"
        version: "May 2026"
        page: null
        section: "008/06, 07–10 a 11–14"
        url: "https://www.loc.gov/marc/bibliographic/bd008a.html"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Ověřeno textově a vizuálně proti s. 53 DMF 2.3 a deklaracím MODS XSD 3.8; význam polí 008/260/264 porovnán s dokumentací MARC. Dvě zdrojová dateIssued ukotvena XPath a SHA-256. Původní MARC ani externí implementace nebyly ověřeny."
    interpretation:
      cs: "Tabulkové R zůstává doporučením, ne RA nebo M. Povaha nejistoty a zdroj odvození nejsou totožné. Zápis [1890] ve vzoru bez qualifier sám neprokazuje, která hodnota by měla být doplněna; původní katalog nebyl analyzován. Obecné XSD má stejnou trojici hodnot, atribut je však volitelný. Rozsah je omezen na data v přímém originInfo MODS záznamu svazku jednosvazkové monografie, nikoli na relatedItem, subject, datum metadat nebo digitalizace. Zdroj pole a význam data se určují nezávisle z katalogu, ne podle přítomnosti či správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-DATE-ISSUED"
