schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-HEADER-CREATOR"
title:
  cs: "Tvůrce METS v roli CREATOR"
description:
  cs: "Kořen a hlavička hlavního METS podle DMF Monografie 2.3; oddělení požadavků NDK, obecného METS 1.9.1 a pozorování vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-HEADER-AGENT"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-header"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 18
          section: "7.3 METS hlavička — metsHdr/agent"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Hlavička obsahuje agenta tvůrce záznamu s ROLE=CREATOR."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V každém metsHdr hlavního METS požadovat alespoň jeden agent s ROLE přesně CREATOR. Nestačí libovolný agent, jiná role nebo dva záznamy ARCHIVIST. Dále u tvůrce kontrolovat TYPE a name."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 18
      section: "7.3 METS hlavička — metsHdr/agent"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "metsType/metsHdr/agent (0–n); @ROLE required"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 18–19 DMF Monografie 2.3 a v oficiálním XSD METS 1.9.1. Kořenové atributy a hlavička dodaného hlavního METS zkontrolovány XPath a SHA-256; externí validátor nebyl spuštěn."
    interpretation:
      cs: "Pravidlo spojuje povinnost kontejneru agent a jeho ROLE=CREATOR z tabulky. Maximum není omezeno na jediného tvůrce: obecné XSD dovoluje opakování a DMF zde horní mez neuvádí. Přítomnost se kontroluje bez podmínky existence ROLE, aby bylo možné zjistit chybějícího tvůrce. Stejná organizace může být zároveň vlastníkem, ale v samostatném agent s rolí ARCHIVIST. Kardinality atributů platí v příslušném rodiči; role CREATOR a ARCHIVIST mají vlastní kontrolu přítomnosti. Pole mets_header_agent_role označuje ROLE právě vybraného metsHdr/agent, nikoli PREMIS agenta nebo kořenové TYPE. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-mets-header-creator"
        title:
          cs: "Tvůrce METS v roli CREATOR — hlavní METS"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:agent ROLE="CREATOR" TYPE="ORGANIZATION" xmlns:mets="http://www.loc.gov/METS/">
            <mets:name>ABA001</mets:name>
          </mets:agent>
        note:
          cs: "Úplný vybraný element hlavičky hlavního METS, beze změny hodnot. ABA001 označuje organizaci v tomto vzoru, není univerzální povinnou hodnotou. Ukázka není potvrzením validity celého SIP ani chování konkrétní implementace."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:metsHdr/mets:agent[@ROLE='CREATOR']"
        namespaces:
          mets: "http://www.loc.gov/METS/"
        checked_on: "2026-10-05"
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-HEADER-AGENT-TYPE"
  -
    type: "related_to"
    target: "NDK-MONO-METS-HEADER-CREATOR-NAME"
