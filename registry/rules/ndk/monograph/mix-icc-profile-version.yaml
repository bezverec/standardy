    verification:
      status: verified
      date: "2026-10-05"
      reference: "Ověřena povinnost elementu a samostatná definice ICC hlavičkové verze. Jejich sémantická ekvivalence není potvrzena. Kód JHOVE 1.34.0, jpylyzer 2.2.1, ProArc 5.1.0 a konfigurace validátoru byly porovnány s issue #255; experiment z 2026-08-25 zde nebyl znovu spuštěn. Lokátor mapování SIP 2.0 je převzat z issue, nikoli nově ověřen v PDF."
    interpretation:
      cs: "ICC hlavičková verze je číselná hodnota, například 2.1.0, přečtená z hlavičky profilu. NISO však u iccProfileVersion uvádí také 1998, sRGB IEC61966-2.1 a 1976; ty lze interpretovat jako vydání známého profilu nebo označení barevného standardu. Není potvrzeno, že prvek MIX musí odpovídat ICC hlavičce. Podle mapování metodiky SIP NDK 2.0 popsaného v issue #255 se do něj přebírá properties/jp2HeaderBox/colourSpecificationBox/icc/profileVersion. To je NDK-specifický výklad; číslo neodvozovat z názvu profilu a existující hodnoty bez rozhodnutí nepřepisovat."
    implementations:
      - id: PROARC
        application: ProArc 5.1.0
        role: generator
        status: partial
        verification: verified
        behaviour:
          cs: MixEditor.write volá JhoveUtility.getMix; ta načte první uzel mix z JHOVE XML a provede unmarshal. V této importní cestě není doplnění ICC hlavičkové verze; mergeMix doplňuje pouze ImageCaptureMetadata. Chybějící iccProfileVersion tak zůstane chybějící.
        notes:
          cs: "Kód tagu v5.1.0 ověřen 2026-10-05; nejde o tvrzení o všech importech/exportech nebo ruční editaci. Issue #255 uvádí v lokálním obrazu JHOVE 1.20.1; tento experiment zde nebyl opakován."
      - id: KOMPLEXNI-VALIDATOR
        application: Komplexní validátor – monografie 2.3
        role: validator
        status: implemented
        verification: verified
        behaviour:
          cs: Hodnotu nemapuje ani negeneruje. Konfigurace mix_mc.xml a mix_ps.xml požaduje uvnitř IccProfile iccProfileVersion s mandatory=true a repeatable=false. expectedContent je prázdný; tato konfigurace nepředepisuje číselný tvar ani porovnání s ICC hlavičkou.
        notes:
          cs: Konfigurace na commitu cde62bc936956809aaa26b1bb5c6afec71e07b0f ověřena 2026-10-05. Jde o kontrolu přítomnosti a neopakovatelnosti, nikoli doloženou sémantickou kontrolu všech částí validátoru.
      - id: JHOVE
        application: JHOVE 1.34.0; experiment také 1.20.1
        role: generator
        status: partial
        verification: verified
        behaviour:
          cs: U TIFF extractIccProfileDescription načte major/minor verzi, ale pouze ji zaloguje; NisoImageMetadata ji neuchová a XmlHandler nevytvoří iccProfileVersion. U restricted ICC v JP2 ColorSpecBox přeskočí 128B hlavičku. Výstup MIX 2.0 zapisuje jméno a případně URI, nikoli verzi.
        notes:
          cs: "Kód tagu v1.34.0 ověřen 2026-10-05. Issue #255 hlásí stejný výsledek pro 1.20.1 a 1.34.0 na svém TIFF/JP2; jde o převzatý experiment. Absence údaje je mezera vůči mapování SIP NDK, ne prokázaná obecná chyba MIX."
      - id: JPYLYZER
        application: jpylyzer 2.2.1
        role: generator
        status: partial
        verification: verified
        behaviour:
          cs: boxvalidator.py čte ICC hlavičku a sestaví profileVersion v tvaru major.minor.bugfix do properties/jp2HeaderBox/colourSpecificationBox/icc/profileVersion. mix.py při tvorbě MIX převezme icc/description do iccProfileName, ale profileVersion do iccProfileVersion nepřenese ani při --mix 2.
        notes:
          cs: "Kód tagu 2.2.1 ověřen 2026-10-05; výsledek pro konkrétní JP2 dokumentuje issue #255. Parser a mapování metodiky SIP NDK nejsou totéž co skutečná transformace do MIX; nejde o nové lokální spuštění nástroje."
    discrepancies:
      - cs: NISO/MIX připouští obecný řetězec a příklady označení vydání či barevného standardu. Je sporné, zda jde o chybu příkladů, nebo o jiný zamýšlený význam než ICC hlavičková verze; chyba NISO/MIX není prokázána.
      - cs: "DMF Monografie 2.3 uvádí sRGB IEC61966-2.1, zatímco mapování SIP NDK 2.0 doložené v issue #255 míří na číselné ICC profileVersion. Je třeba sjednotit výklad uvnitř dokumentace NDK."
      - cs: JHOVE a MIX transformace jpylyzeru verzi nevytvářejí a ProArc ji v popsané cestě nedoplní. Jde o nesoulad s požadovanou přítomností v NDK; tím se nerozhoduje obecná sémantika MIX.
    validator_behaviour:
      cs: Za uvedených podmínek vyžadovat právě jeden element. Do potvrzení sémantiky neodmítat nečíselnou hodnotu jen proto, že se liší od ICC hlavičky. Porovnání s hlavičkou lze zavést pouze jako výslovnou politiku mapování SIP NDK, nikoli jako obecnou kontrolu MIX.
    fix_recommendation:
      cs: Vyžádat výslovný výklad od správců NISO/MIX a NDK a sjednotit DMF s metodikou SIP. Dočasné doplnění z ICC hlavičky označit jako politiku SIP NDK 2.0, uchovat původní výstup extraktoru a nepřepisovat existující hodnoty. U JHOVE nejprve zpřístupnit jednoznačně pojmenovanou hlavičkovou verzi; obecné mapování do MIX rozhodnout až po vyjasnění významu.
relations:
  - type: related_to
    target: MIX
  - type: related_to
    target: ICC-PROFILE-HEADER-VERSION
    note:
      cs: ICC hlavičková verze je související údaj, nikoli potvrzený sémantický ekvivalent prvku MIX.
  - type: related_to
    target: NDK-MONO-MIX-ICC-PROFILE-URI
    note:
      cs: Společně s pravidly pro jméno a URI tvoří skupinu popisu ICC profilu v MIX.
  - type: related_to
    target: NISO-Z3987-ICC-PROFILE-VERSION
    note:
      cs: Odkaz na položku datového slovníku citovanou v references; nejde o potvrzení bezchybnosti příkladů.
