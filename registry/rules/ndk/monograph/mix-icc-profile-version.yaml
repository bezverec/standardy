schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-ICC-PROFILE-VERSION
title:
  cs: Verze ICC profilu v MIX
description:
  cs: Povinný údaj o verzi ICC profilu v NDK; význam prvku MIX je sporný a je třeba odlišit vydání známého profilu od číselné verze v ICC hlavičce.
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: disputed
    target:
      entity: MIX-ICC-PROFILE-VERSION
    relation_to_target:
      type: restricts
    category: technical/icc
    severity: error
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: DMF Monografie 2.3 označuje iccProfileVersion jako povinný (M) pro MC i PS s kardinalitou MIX 0–1. Je-li v MIX přítomen blok IccProfile, vyžaduje se právě jeden element iccProfileVersion. Z tohoto požadavku samotného neplyne číselný tvar hodnoty.
    requirement:
      presence: conditional
      cardinality:
        min: 1
        max: 1
      validations:
        - type: xpath
          expression: "//mix:IccProfile/mix:iccProfileVersion"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
        - field: "xpath://mix:IccProfile"
          operator: exists
    source:
      document: DMF Monografie
      version: "2.3"
      page: 83
      section: "7.5.4 Technická metadata MIX"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
