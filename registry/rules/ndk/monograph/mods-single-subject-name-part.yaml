        note:
          cs: "Jde o druhou část stejného jména, nikoli subject/temporal. Tento výřez sám neplní požadavek na vlastní jméno. Zdroj deklaruje descriptionStandard=aacr. Původní MARC, autoritní přiřazení ani úplná validita SIP nebyly ověřeny; nejde o univerzální šablonu."
        source:
