schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-RELATED-ITEM-OTHER-TYPE
title:
  cs: Jiný typ vztahu souvisejícího zdroje
description:
  cs: Související zdroje v MODS svazku jednosvazkové monografie podle DMF 2.3.
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-RELATED-ITEM-OTHER-TYPE
    relation_to_target:
      type: restricts
    category: metadata/mods-related-items
    cataloguing_rules:
      - aacr2
      - rda
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-10-14
      note:
        cs: Černé řádky relatedItem na s. 56–57 podle legendy s. 24 představují společný bibliografický předpis AACR2/RDA, nikoli technicky nezávislé pravidlo.
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: 57
          section: 7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — relatedItem (s. 56–57)
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: 7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: optional
    obligation_code: O
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values:
        - monograph
    normative_requirement:
      cs: OtherType má povinnost O a popisuje typ vztahu, pro který nelze použít některou z hodnot type.
    requirement:
      presence: optional
      cardinality:
        min: 0
        max: 1
      validations:
        - type: custom
          expression: Při použití otherType posoudit, zda vztah skutečně nelze vyjádřit některou hodnotou type. Nepředepisovat pevný slovník ani samotnou přítomnost atributu.
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_related_item
    source:
      document: DMF Monografie
      version: "2.3"
      page: 57
      section: 7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — relatedItem (s. 56–57)
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: modsDefinition; modsGroup; relatedItemDefinition; titleInfoDefinition
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: relatedItem — Guidelines for Use; Specific Attribute Information
        url: https://www.loc.gov/standards/mods/userguide/relateditem.html
    verification:
      status: verified
      date: 2026-10-14
      reference: Vizuálně ověřen přepis tabulky DMF s. 56–57 a legenda s. 24, deklarace XSD 3.8 a uvedené prameny LOC. Verified označuje přepis pramene; u ambiguous není nejasná sémantika tímto vyřešena. Nejde o ověření implementace.
    interpretation:
      cs: Jde o typ vztahu, nikoli o titul nebo identifikátor souvisejícího dokumentu. Volitelnost O se nemění na R podle současných LOC Guidelines. Obecné XSD deklaruje xs:string. Rozsah je přímé relatedItem v MODS svazku jednosvazkové monografie, nikoli vnořené relatedItem, titul vícesvazku, příloha, vnitřní část nebo stránka. Kontext a dostupnost zdrojových údajů se zjišťují nezávisle na kontrolovaném XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny.
relations:
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM
