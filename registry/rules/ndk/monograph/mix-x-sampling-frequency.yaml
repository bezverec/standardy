schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-X-SAMPLING-FREQUENCY
title:
  cs: "Vzorkovací frekvence v ose X"
description:
  cs: "xSamplingFrequency v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-X-SAMPLING-FREQUENCY
    relation_to_target:
      type: restricts
    category: technical/sampling
    obligation: mandatory_if_available
    obligation_code: MA
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS je xSamplingFrequency povinná při jednotce in. nebo cm, s čitatelem a jmenovatelem."
    requirement:
      presence: conditional
      cardinality:
        min: 1
        max: 1
      validations:
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:xSamplingFrequency"
          assertion: exists
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:xSamplingFrequency/mix:numerator"
          assertion: exists
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:xSamplingFrequency/mix:denominator"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
        - field: "xpath:/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit"
          operator: in
          value: ["in.", "cm"]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 87
      section: "7.5.4 Technická metadata MIX — xSamplingFrequency"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:xSamplingFrequency; rationalType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost MA, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 87; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "Jde o sourozence samplingFrequencyUnit uvnitř SpatialMetrics, jak určuje XSD. Čitatel a jmenovatel jsou v DMF označeny M a v XSD mají typ xsd:integer. Povinnost MA zde upřesňuje konkrétní podmínka jednotky. Pravidlo samo neurčuje minimální PPI; příklad 300/1 není obecný limit. Nulový jmenovatel nevyjadřuje použitelný poměr, ačkoli jej samotný typ xsd:integer nevylučuje."
relations:
  - type: related_to
    target: NDK-MONO-MIX-SAMPLING-FREQUENCY-UNIT
  - type: related_to
    target: NDK-MONO-MIX-Y-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-IMAGE-WIDTH
