schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-CHECKSUM"
title:
  cs: "Odkaz a kontrolní součet souboru MD5"
description:
  cs: "Požadavek na /info/checksum v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "NDK-INFO-CHECKSUM"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "checksum odkazuje na soubor MD5; má atribut type s hodnotou md5 a atribut checksum s MD5 otiskem tohoto odkazovaného souboru."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "xpath"
          expression: "/info/checksum"
          assertion: "exists"
        -
          type: "xpath"
          expression: "/info/checksum/@type"
          assertion: "exists"
        -
          type: "xpath"
          expression: "/info/checksum/@checksum"
          assertion: "exists"
        -
          type: "custom"
          expression: "Ověřit type = 'md5', existenci odkazovaného souboru a shodu jeho vypočteného MD5 s atributem checksum."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 18
      section: "7.1 Soubor info.xml — checksum"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/checksum"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
    examples:
      - id: "sip-75faba8d-info-checksum"
        title:
          cs: "Odkaz na soubor MD5 a jeho otisk"
        language: xml
        kind: source_excerpt
        code: |-
          <checksum checksum="a55fd2ff701d35b383d796daf7203cbd" type="md5">md5_75faba8d-c629-11f0-8950-12e8557df20e.md5</checksum>
        note:
          cs: "Atribut checksum odpovídá MD5 odkazovaného souboru seznamu kontrolních součtů v lokálním vzoru. Nejde o potvrzení všech souborů v balíčku; MD5 zde není bezpečnostní podpis."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "0ede408570bb97daf563f92667c17a021daeaeba5ed3aa9f24b400f8fa84059c"
        source_xpath: "/info/checksum"
        namespaces: {}
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 18. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "Atribut checksum je otisk souboru se seznamem kontrolních součtů, nikoli otisk info.xml ani celého balíčku. XSD vyžaduje oba atributy, ale jejich xs:string neomezuje algoritmus ani nekontroluje otisk."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-ITEM-LIST"
