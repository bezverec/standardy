schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-EVENT-LINKING-OBJECT-VALUE"
title:
  cs: "Hodnota identifikátoru objektu události"
description:
  cs: "Události digitalizace podle DMF Monografie 2.3; oddělení obecných možností PREMIS 2.2, povinností NDK a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-EVENT-LINKING-OBJECT-VALUE"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-events"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na ochranná metadata souborů, událostí nebo jejich původců. Nejde o bibliografické vztahy děl a tvůrců podle AACR2/RDA."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 81
          section: "7.5.2 PREMIS Event — linkingObjectIdentifier/linkingObjectIdentifierValue"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každá vazba na objekt obsahuje právě jednu hodnotu identifikátoru."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každém linkingObjectIdentifier požadovat jeden linkingObjectIdentifierValue. Cíl určit společně s typem identifikátoru, ne z podobnosti řetězce se jménem souboru."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 81
      section: "7.5.2 PREMIS Event — linkingObjectIdentifier/linkingObjectIdentifierValue"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "linkingObjectIdentifierComplexType/linkingObjectIdentifierValue (1–1); xs:string"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: obecná kardinalita a povinnosti DMF; povinné děti doporučeného rodiče"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 79–81 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a otiskem souboru; externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "Ve vzoru MC_1_00010003_2R odpovídá identitě PREMIS Object; není to METS file/@ID mc_0001. Příklad URN:NBN v DMF neurčuje povinný formát všech hodnot. LinkObjectXmlID je odlišný volitelný mechanismus obecného XSD. Kardinalita dítěte se vyhodnocuje v každém bezprostředním rodiči cesty event/linkingObjectIdentifier/linkingObjectIdentifierValue. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-event-linking-object-value"
        title:
          cs: "Hodnota identifikátoru objektu události — EVT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:linkingObjectIdentifierValue xmlns:premis="info:lc/xmlns/premis-v2">MC_1_00010003_2R</premis:linkingObjectIdentifierValue>
        note:
          cs: "Výřez vedlejšího METS první stránky, zachovaný beze změny hodnot. Nejde o potvrzení validity celého SIP ani o důkaz chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
