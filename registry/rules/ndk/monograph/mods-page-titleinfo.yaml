schema_version: '1.0'
kind: rule
id: NDK-MONO-MODS-PAGE-TITLEINFO
title:
  cs: Názvové údaje jednotlivé stránky
national_standard:
  id: ndk-monograph
versions:
  - version: '2.3'
    status: normative
    target:
      entity: MODS-TITLEINFO
    relation_to_target:
      type: restricts
    category: metadata/mods-page-titles
    cataloguing_rules:
      - aacr2
      - rda
    cataloguing_scope:
      applicability: applicable
      reviewed_on: '2026-11-06'
      note:
        cs: Jde o bibliografický popis názvu jednotlivé stránky. Řádek na s. 72 je uveden černým písmem. Podle legendy
          na s. 24 se tento zápis řídí stejným předpisem pro AACR2 i RDA.
      sources:
        - document: DMF Monografie
          version: '2.3'
          page: 72
          section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — titleInfo
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: '2.3'
          page: 24
          section: 7.4 METS část dmdSec — povinnosti uvnitř použitého rodiče a rozlišení AACR2/RDA
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: recommended_if_available
    obligation_code: RA
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values:
        - monograph
    normative_requirement:
      cs: Jsou-li pro danou stránku dostupné názvové údaje, DMF doporučuje uvést je v titleInfo jejího záznamu MODS.
    requirement:
      presence: optional
      cardinality:
        min: 0
        max: null
      validations:
        - type: custom
          expression: Srovnat názvové údaje dostupné na stránce s jejími přímými titleInfo. Vynechání při dostupných
            údajích znamená nesplněné doporučení.
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: page
        - field: element_role
          operator: equals
          value: mods_record
        - field: page_title_information_available
          operator: equals
          value: true
    source:
      document: DMF Monografie
      version: '2.3'
      page: 72
      section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — titleInfo
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: DMF Monografie
        version: '2.3'
        page: 24
        section: 7.4 METS část dmdSec — povinnosti uvnitř použitého rodiče a rozlišení AACR2/RDA
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
      - document: MODS XML Schema
        version: '3.8'
        page: null
        section: modsGroup, titleInfoDefinition a deklarace title, subTitle a nonSort
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
    verification:
      status: verified
      date: '2026-11-06'
      reference: Ověřen řádek tabulky DMF 2.3 na s. 72, legenda na s. 24 a odpovídající deklarace MODS XSD 3.8.
    interpretation:
      cs: Dostupnost se posuzuje podle předlohy. Samotný titul knihy nebo označení druhu stránky titlePage k založení
        titleInfo nestačí.
relations:
  - type: related_to
    target: NDK-MONO-MODS-PAGE-TITLE
  - type: related_to
    target: NDK-MONO-MODS-PAGE-SUBTITLE
  - type: related_to
    target: NDK-MONO-MODS-PAGE-NONSORT
