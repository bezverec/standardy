schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-CREATION-DATETIME"
title:
  cs: "Datum a čas vytvoření aplikací"
description:
  cs: "Vznik a ochrana souborových objektů MC, PS a ALTO podle DMF Monografie 2.3; obecné schéma PREMIS 2.2 je evidováno samostatně."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-CREATION-DATETIME"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-provenance"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý záznam aplikace vzniku obsahuje datum a čas vytvoření v ISO 8601 s přesností na sekundy."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každém creatingApplication vyžadovat jeden dateCreatedByApplication jako platné datum a čas ISO 8601 s uvedenými sekundami. Ověřit kalendářní platnost i význam okamžiku vzniku; samotné datum, rok či neurčitý údaj nepostačí. Nevyžadovat automaticky příponu Z."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "PS"
            - "ALTO"
        -
          field: "premis_object_type"
          operator: "equals"
          value: "file"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 78
      section: "7.5.1 PREMIS Object — objectCharacteristics/creatingApplication/dateCreatedByApplication"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "creatingApplicationComplexType/dateCreatedByApplication (0–1 ve větvení choice); edtfSimpleType"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "75–76"
        section: "Legenda povinností a rozsah PREMIS Object"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    examples:
      -
        id: "sip-premis-creation-datetime-obj_003"
        title:
          cs: "Datum a čas vytvoření aplikací — MC (OBJ_003)"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:dateCreatedByApplication xmlns:premis="info:lc/xmlns/premis-v2">2026-06-25T08:41:21</premis:dateCreatedByApplication>
        note:
          cs: "Přesný výřez z objektu OBJ_003 první stránky dodaného SIP, vybraného podle identity reprezentace, nikoli podle chybného ADMID. Údaje popisují tento vzor; neprokazují povinnou aplikaci, správnost časové osy ani obecné chování nástroje. Nejde o potvrzení validity SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='OBJ_003']/mets:mdWrap/mets:xmlData/premis:object/premis:objectCharacteristics/premis:creatingApplication/premis:dateCreatedByApplication"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          premis: "info:lc/xmlns/premis-v2"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 77–78 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Ukázky včetně originalName ověřeny v objektech první stránky dodaného SIP; externí validátor nebyl spuštěn."
    interpretation:
      cs: "Obecné PREMIS edtfSimpleType připouští i samotné datum a další zápisy; DMF vyžaduje datum a čas na úroveň sekund. Požadavek nezavádí povinné UTC nebo konkrétní časové pásmo. Nejde o čas extrakce metadat, přiřazení ochrany ani filesystem mtime; rovnost s METS CREATED se zde bez dalšího nepředepisuje. Kardinalita platí v každém bezprostředním rodiči uvedené cesty. Kód M je převzat z DMF. file_role ALTO odpovídá označení XML v tabulce; OCR.TXT a UC jsou mimo rozsah. premis_object_type označuje rozlišený typ file v namespace PREMIS, nezávisle na XML prefixu. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-CREATING-APPLICATION"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-PRESERVATION-LEVEL-DATE"
