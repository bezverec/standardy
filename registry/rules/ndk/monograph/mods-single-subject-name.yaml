schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-SUBJECT-NAME"
title:
  cs: "Jméno použité jako věcné záhlaví"
description:
  cs: "Kartografické údaje a jmenná věcná záhlaví svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-SUBJECT-NAME"
    relation_to_target:
      type: "clarifies"
    category: "metadata/mods-subject-details"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-11"
      note:
        cs: "Černé řádky na s. 56 jsou podle legendy s. 24 společné AACR2/RDA. Jde o bibliografický popis předlohy a jejích věcných záhlaví, ne technická metadata skenu. Společný přenos údajů nedokládá totožnost katalogizačních postupů."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 56
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — cartographics a subject/name"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a potomka, barevné kódování AACR2/RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se uvést name jako jméno použité ve věcném záhlaví. Použije se kontrolovaný slovník, např. osobní jméno z AUT NK ČR, nebo obsah MARC 600."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Posoudit shodu jmenného věcného záhlaví s kontrolovaným slovníkem nebo zdrojovým MARC 600. Nezaměňovat subjekt popisu s původcem dokumentu v přímém mods/name. Nevyžadovat name v každém subject a nevytvářet je pouze kvůli M u jeho potomka namePart."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_subject"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 56
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — cartographics a subject/name"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "subjectDefinition; subjectNameDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines: subject"
        version: "3"
        page: null
        section: "cartographics; coordinates; scale; name"
        url: "https://www.loc.gov/standards/mods/userguide/subject.html"
    verification:
      status: "verified"
      date: "2026-10-11"
      reference: "Porovnány text a vykreslená tabulka DMF 2.3 s. 56, pravidla rodičovské povinnosti a barev s. 24 a příslušné deklarace MODS XSD 3.8. XML doklady jsou ukotveny XPath a SHA-256; nejde o validaci celého SIP, původního MARC ani autoritního přiřazení."
    interpretation:
      cs: "Jde o osobu či jinou jmennou entitu, o níž dokument pojednává, ne automaticky o autora. Zdroj uvádí MARC 600 a osobní autority; obecné MODS nabízí více typů jmen, což neopravňuje domyslet další národní mapování. Subject/name používá subjectNameDefinition, nikoli top-level nameDefinition: nepřebírá se do něj etal ani alternativeName. Pravidla původců včetně povinných rolí se sem nepřenášejí. Rozsah je přímý subject MODS záznamu svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem, stránka či titul vícesvazku. Kontext rodiče a případná dostupnost se určují nezávisle ze zdroje; neznámá hodnota není false ani potvrzení shody. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-subject-name-edison"
        title:
          cs: "Edison jako předmět popisu"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:name xmlns:mods=\"http://www.loc.gov/mods/v3\" type=\"personal\">\n  <mods:namePart>Edison, Thomas A. (Thomas Alva)</mods:namePart>\n  <mods:namePart type=\"date\">1847-1931</mods:namePart>\n</mods:name>"
        note:
          cs: "Jméno je ve subject, nikoli přímý původce. Chybí nameIdentifier, ale to samo neprokazuje nedostupnost autority. Zdroj deklaruje descriptionStandard=aacr. Původní MARC, autoritní přiřazení ani úplná validita SIP nebyly ověřeny; nejde o univerzální šablonu."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, jmenné věcné záhlaví"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:subject[2]/mods:name"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-11"
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-SUBJECT"
