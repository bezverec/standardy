schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-Y-SAMPLING-FREQUENCY
title:
  cs: "Vzorkovací frekvence v ose Y"
description:
  cs: "ySamplingFrequency v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-Y-SAMPLING-FREQUENCY
    relation_to_target:
      type: restricts
    category: technical/sampling
    obligation: mandatory_if_available
    obligation_code: MA
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS je ySamplingFrequency povinná při jednotce in. nebo cm, s čitatelem a jmenovatelem."
    requirement:
      presence: conditional
      cardinality:
        min: 1
        max: 1
      validations:
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency"
          assertion: exists
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency/mix:numerator"
          assertion: exists
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency/mix:denominator"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
        - field: "xpath:/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit"
          operator: in
          value: ["in.", "cm"]
    source:
      document: DMF Monografie
      version: "2.3"
      page: "87–88"
      section: "7.5.4 Technická metadata MIX — ySamplingFrequency"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:ySamplingFrequency; rationalType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    examples:
      - id: "sip-75faba8d-mix-y-sampling-frequency"
        title:
          cs: "Vzorkování MC v ose Y v kontextu jednotky"
        language: xml
        kind: source_excerpt
        code: |-
          <mix:SpatialMetrics xmlns:mix="http://www.loc.gov/mix/v20">
            <mix:samplingFrequencyUnit>in.</mix:samplingFrequencyUnit>
            <mix:xSamplingFrequency>
              <mix:numerator>15748</mix:numerator>
              <mix:denominator>39</mix:denominator>
            </mix:xSamplingFrequency>
            <mix:ySamplingFrequency>
              <mix:numerator>15748</mix:numerator>
              <mix:denominator>39</mix:denominator>
            </mix:ySamplingFrequency>
          </mix:SpatialMetrics>
        note:
          cs: "MC, blok MIX_003 s identifikátorem MC_1_00010003_2R. Převzata je celá skupina včetně jednotky in. a obou os. Zlomek 15748/39 z MC je ponechán beze změny; výřez sám neověřuje soulad metadat s obrazovým souborem."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='MIX_003']/mets:mdWrap/mets:xmlData/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics"
        namespaces: {"mets":"http://www.loc.gov/METS/","mix":"http://www.loc.gov/mix/v20"}
        checked_on: "2026-10-05"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost MA, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 87–88; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "Jde o sourozence samplingFrequencyUnit uvnitř SpatialMetrics, jak určuje XSD. Čitatel a jmenovatel jsou v DMF označeny M a v XSD mají typ xsd:integer. Hodnoty X a Y nemusí být shodné jen na základě tohoto pravidla. Pravidlo neurčuje minimální PPI ani nezakazuje frekvenci při bezrozměrné jednotce. Nulový jmenovatel nevyjadřuje použitelný poměr, ačkoli jej samotný typ xsd:integer nevylučuje."
relations:
  - type: related_to
    target: NDK-MONO-MIX-SAMPLING-FREQUENCY-UNIT
  - type: related_to
    target: NDK-MONO-MIX-X-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-IMAGE-HEIGHT
