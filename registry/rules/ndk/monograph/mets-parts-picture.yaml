schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PARTS-PICTURE"
title:
  cs: "Logický uzel obrazu"
description:
  cs: "Vnitřní logické členění monografií podle DMF 2.3: kapitoly, obrazy, volitelné logické stránky a vazby na fyzické strany; bez implementace blokových odkazů ALTO."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-internal-parts"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Pokud je v rozsahu vnitřního popisu obraz, reprezentuje jej logický div typu PICTURE."
    requirement:
      presence: "conditional"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Podle předlohy a sjednaného vnitřního popisu určit obrazy a požadovat odpovídající div s TYPE=PICTURE. Obraz může náležet oddílu nebo stát samostatně; nevyžadovat pro samostatný obraz umělou kapitolu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "in"
          value:
            - "internal_parts_pages"
            - "internal_parts_alto"
        -
          field: "expected_internal_part"
          operator: "equals"
          value: "picture"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "93, 96–98"
      section: "7.7.1.2.1 a 7.7.1.2.2 — PICTURE"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType; divType; ORDERLABELS; structLinkType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 4
        section: "1.3 Dohoda mezi dodavatelem dat a zadavatelem — granularita záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 98
        section: "7.7.1.2.2 Varianta vnitřního popisu bez vazeb na bloky ALTO"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s DMF 2.3, s. 4, 93–99, včetně vizuální kontroly tabulek a s deklaracemi METS XSD 1.9.1. U TYPE je ověřena existence rozporu, nikoli jedna závazná hodnota. Externí validátor nebyl spuštěn."
    interpretation:
      cs: "MA pochází z řádku PICTURE: plní se při výskytu obrazu v tomto rozsahu popisu. Sken libovolné textové stránky není automaticky logickým obrazem. Nezavádíme povinnost popsat každou ilustraci v projektu bez vnitřního členění. Blokové vazby ALTO budou samostatná skupina. Rozsah vnitřního popisu vychází ze zadání projektu (§ 1.3), nikoli z pouhé existence nebo absence uzlů. Strukturální role vyjadřuje význam uzlu, ne shodu jeho kontrolovaného TYPE či prefixu ID. Custom kontroly registr nevykonává. Vzorový SIP bez kapitol tuto variantu nedokládá; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-LOGICAL-MAP"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-PICTURE-DMDID"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-PICTURE-LABEL"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-DIV-ID"
  -
    type: "related_to"
    target: "NDK-MONO-METS-PARTS-PART-PAGE-COVERAGE"
