schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ORIGIN-EVENT-TYPE"
title:
  cs: "Druh nakladatelské události pro RDA"
description:
  cs: "Původ a místa vydání svazku jednosvazkové monografie podle DMF 2.3; odlišení AACR a RDA a vazby na MARC 260/264 a 008."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ORIGININFO-EVENT-TYPE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "U RDA musí mít originInfo atribut eventType podle druhého indikátoru MARC 264: production, publication, distribution, manufacture nebo copyright."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      allowed_values:
        - "production"
        - "publication"
        - "distribution"
        - "manufacture"
        - "copyright"
      validations:
        -
          type: "custom"
          expression: "Každé RDA originInfo musí mít eventType. Převod je 264_0 → production; 264_1 → publication; 264_2 → distribution; 264_3 → manufacture; 264_4 → copyright. Hodnotu ověřit proti druhému indikátoru zdrojového pole, nikoli proti prvnímu indikátoru nebo libovolně zvolenému platnému členu seznamu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_origin_info"
        -
          field: "cataloguing_rules"
          operator: "equals"
          value: "rda"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "51–52"
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — originInfo, eventType a place"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsGroup; originInfoDefinition; placeDefinition; placeTermDefinition; codeOrText; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 264"
        version: "July 2022"
        page: null
        section: "Second Indicator — Function of entity"
        url: "https://www.loc.gov/marc/bibliographic/bd264.html"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Porovnáno s textem a vykreslenými tabulkami s. 51–52 DMF 2.3 a deklaracemi MODS XSD 3.8. Výřezy ukotveny XPath a SHA-256; ověřena deklarace AACR ve vzoru. Původní MARC a implementace nástrojů nebyly ověřeny."
    interpretation:
      cs: "Tabulková povinnost atributu je M. R u jednotlivých hodnot podle vysvětlení DMF neznamená volitelný atribut: závazný převod vybere odpovídající hodnotu podle katalogu. Production označuje vytvoření nezveřejněného zdroje, manufacture výrobu zveřejněného. Obecné XSD má volitelný xs:string bez tohoto uzavřeného výčtu. Katalogizační režim nelze odvodit jen z nepřítomnosti eventType. Kontext je omezen na přímé originInfo MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, subject, stránku nebo titul vícesvazku. Katalogizační pravidla a dostupnost údajů se zjišťují nezávisle ze zdroje, ne podle existence či správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGININFO"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-PRIMARY-EVENT"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-AACR-NO-EVENT-TYPE"
