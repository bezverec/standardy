schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-SUBJECT-TOPIC-VALUE-URI"
title:
  cs: "Odkaz na autoritu tematického termínu"
description:
  cs: "Věcné údaje svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-SUBJECT-TOPIC-VALUE-URI"
    relation_to_target:
      type: "clarifies"
    category: "metadata/mods-subject"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-10"
      note:
        cs: "Černě vyznačené doporučení v tabulce jednosvazku je podle legendy s. 24 společné AACR2/RDA. Společný požadavek na převod nedokládá shodnost všech postupů věcné katalogizace ani správnost zdrojového záhlaví."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 55
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — subject"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "U topic se doporučuje valueURI s odkazem do Databáze národních autorit ČR. Doporučený formát je https://aleph.nkp.cz/dai/číslo_autority."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: 1
      validations:
        -
          type: "custom"
          expression: "Doporučit valueURI konkrétního tematického termínu ve formátu https://aleph.nkp.cz/dai/číslo_autority a ověřit významovou shodu cílové autority. Tištěný příklad ph161710 není univerzální hodnota. Samotné HTTP 200 ani syntaktická URI nepotvrzují správné přiřazení."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_subject_topic"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 55
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — subject"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; subjectDefinition; stringPlusLanguagePlusAuthority; temporalDefinition; dateDefinition; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines: subject"
        version: "3"
        page: null
        section: "subject, topic, geographic, temporal; authority attributes"
        url: "https://www.loc.gov/standards/mods/userguide/subject.html"
    verification:
      status: "verified"
      date: "2026-10-10"
      reference: "Ověřen text i vykreslené tabulky s. 55–56 DMF 2.3, legenda s. 24 a deklarace MODS XSD 3.8. Ověření přepisu není validací celého SIP, zdrojového MARC ani členství termínů v autoritním slovníku."
    interpretation:
      cs: "R a doporučený formát se nemění na povinný regex ani zákaz jiných syntakticky platných URI v MODS. Chybějící odkaz není porušením M. ValueURI identifikuje konkrétní termín, authorityURI slovník; URI se nesmí odhadnout z textového názvu tématu. Pravidlo se vztahuje pouze k přímému subject MODS záznamu svazku jednosvazkové monografie v hlavním METS, ne relatedItem, stránce či titulu vícesvazku. Kontext se určuje nezávisle ze zdroje; neznámá hodnota není false ani potvrzení shody. Kardinalita je vztažena k jednotlivému rodiči, nevytváří povinnost založit doporučený kontejner. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-SUBJECT"
