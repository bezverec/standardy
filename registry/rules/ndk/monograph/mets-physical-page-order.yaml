schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-PAGE-ORDER"
title:
  cs: "Pořadí fyzické stránky ve svazku"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-ORDER"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "ORDER stránkového div vyjadřuje pořadí stránky v reprezentaci svazku, nikoli vytištěné číslo stránky."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat ORDER jako xs:integer a ověřit věcnou shodu s pořadím reprezentace. Je-li v odpovídajícím MODS PAGE uveden part/detail[@type='pageIndex']/number, porovnat hodnoty. Zde nevynucovat přítomnost volitelného MODS part pro pageIndex."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "page"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 93
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType; ORDERLABELS/@ORDER; xs:integer; optional"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "Pravidla pro popis monografií"
        version: "2.4"
        page: 6
        section: "1.1.6 Zápis čísel u dvoustrany, příklad ORDER=0"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 73
        section: "7.4.1.6 Pole MODS a DC pro jednotlivou stranu — part/detail"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    examples:
      -
        id: "sip-main-mets-physical-page-order-1"
        title:
          cs: "První fyzická stránka"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:div ID="DIV_P_PAGE_0000" ORDER="1" ORDERLABEL="[1]" TYPE="titlePage" xmlns:mets="http://www.loc.gov/METS/">
            <mets:fptr FILEID="mc_0001" />
            <mets:fptr FILEID="uc_0001" />
            <mets:fptr FILEID="alto_0001" />
            <mets:fptr FILEID="txt_0001" />
            <mets:fptr FILEID="amd_0001" />
          </mets:div>
        note:
          cs: "Přesný výřez dodaného SIP, nikoli univerzální šablona nebo potvrzení validity balíčku. Související cíle a další části dokumentu mohou ležet mimo tento výřez."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — fyzická mapa a související metadata"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:structMap[@TYPE=\"PHYSICAL\"]/mets:div/mets:div[@ID=\"DIV_P_PAGE_0000\"]"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-05"
      -
        id: "sip-main-mets-physical-page-order-2"
        title:
          cs: "MODS první stránky pro porovnání typu a paginace"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mods:mods ID="MODS_PAGE_0001" version="3.8" xmlns:mods="http://www.loc.gov/mods/v3">
            <mods:identifier type="uuid">02db9be9-7074-11f1-b41e-d6a2fa380025</mods:identifier>
            <mods:part type="titlePage">
              <mods:detail type="pageNumber">
                <mods:number>[1]</mods:number>
              </mods:detail>
              <mods:extent unit="pages">
                <mods:start>[1]</mods:start>
              </mods:extent>
            </mods:part>
            <mods:part>
              <mods:detail type="pageIndex">
                <mods:number>1</mods:number>
              </mods:detail>
            </mods:part>
            <mods:note>right</mods:note>
            <mods:genre type="titlePage">reprePage</mods:genre>
            <mods:typeOfResource>text</mods:typeOfResource>
          </mods:mods>
        note:
          cs: "Přesný výřez dodaného SIP, nikoli univerzální šablona nebo potvrzení validity balíčku. Příklad pro srovnání údajů, nikoli nová sada povinností MODS."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — fyzická mapa a související metadata"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_PAGE_0001\"]/mets:mdWrap/mets:xmlData/mods:mods"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami 92–93 DMF 2.3 a s XSD METS 1.9.1. Typy stran doplněny podle tabulky PPM 2.4, s. 14; paginace podle s. 4–7 a tabulky PAGE v DMF, s. 73. Vzor ověřen XPath a SHA-256; externí validátor ani nástrojové implementace nebyly testovány."
    interpretation:
      cs: "DMF § 7.7.1.1 používá zkratku part type=pageIndex; podrobná tabulka PAGE na s. 73 umisťuje type na detail pod part. ORDER není ID a nemusí se rovnat ORDERLABEL. Vzor má ORDER=1, zatímco ID končí 0000. XSD určuje integer, nikoli positiveInteger; PPM 2.4 na s. 6 uvádějí i příklad ORDER=0. Tato skupina proto nepředepisuje univerzální počáteční hodnotu 1 ani regex pouze pro kladná čísla. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Úrovně volume/page označují pozici div ve fyzické mapě, nikoli testovanou hodnotu TYPE; hlavní a vedlejší METS zůstávají oddělené. Custom kontroly registr nevykonává, jsou popisem pro budoucí implementaci."
