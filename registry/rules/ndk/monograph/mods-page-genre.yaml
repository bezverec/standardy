schema_version: '1.0'
kind: rule
id: NDK-MONO-MODS-PAGE-GENRE
title:
  cs: Označení reprezentativní a běžné stránky
national_standard:
  id: ndk-monograph
versions:
  - version: '2.3'
    status: normative
    target:
      entity: MODS-GENRE
    relation_to_target:
      type: restricts
    category: metadata/mods-page-characteristics
    cataloguing_scope:
      applicability: independent
      reviewed_on: '2026-11-05'
      note:
        cs: Reprezentativnost a druh digitalizované strany stanoví DMF § 7.4.1.6 a PPM 2.4; nejde o bibliografický žánr svazku
          podle AACR2/RDA. Posouzení se vztahuje k uvedené roli stránky, ne k celému namespace MODS.
      sources:
        - document: DMF Monografie
          version: '2.3'
          page: 73
          section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — genre
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: Pravidla pro popis monografií
          version: '2.4'
          page: 8, 14
          section: 1.2 Typ strany; 1.2.2 Použití hodnot pro popis typu strany a typu vnitřní části
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values:
        - monograph
    normative_requirement:
      cs: MODS záznam jednotlivé stránky musí obsahovat genre s hodnotou reprePage pro reprezentativní stranu nebo page pro
        běžnou stranu.
    requirement:
      presence: required
      cardinality:
        min: 1
        max: null
      allowed_values:
        - page
        - reprePage
      validations:
        - type: custom
          expression: Kontext je mods_record v přímém MODS záznamu jednotlivé stránky. MODS záznam jednotlivé stránky musí
            obsahovat genre s hodnotou reprePage pro reprezentativní stranu nebo page pro běžnou stranu.
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: page
        - field: element_role
          operator: equals
          value: mods_record
    source:
      document: DMF Monografie
      version: '2.3'
      page: 73
      section: 7.4.1.6 Pole MODS a DC pro jednotlivou stranu — genre
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: DMF Monografie
        version: '2.3'
        page: 24
        section: 7.4 METS část dmdSec — povinnosti rodiče a potomků; barevné kódování AACR2/RDA
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
      - document: MODS XML Schema
        version: '3.8'
        page: null
        section: modsDefinition; modsGroup; identifierDefinition; genreDefinition; typeOfResourceDefinition; noteDefinition;
          physicalDescriptionDefinition; physicalDescriptionNote
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: Pravidla pro popis monografií
        version: '2.4'
        page: 8, 14
        section: 1.2 Typ strany; 1.2.2 Použití hodnot pro popis typu strany a typu vnitřní části
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf
    verification:
      status: verified
      date: '2026-11-05'
      reference: Vizuálně ověřeny řádky a kódy povinností DMF 2.3 s. 72–73 a legenda s. 24; přečteny příslušné deklarace MODS
        XSD 3.8. U identifikátorů doplněna kapitola 4 s. 9, u druhů stran PPM 2.4 s. 8 a vizuálně tabulka s. 14. Ověření přepisu
        není potvrzením správnosti celého SIP.
    interpretation:
      cs: Text genre označuje reprezentativnost. Druh strany (například titlePage) patří do jeho atributu type podle PPM 2.4.
        Reprezentativnost je nutné posoudit podle dokumentu a pravidel PPM, nikoli mechanicky ze samotného type=titlePage.
        Z jedné ukázky se neodvozuje počet reprezentativních stran v celém SIP. Mapování do dc:type=model:page tato sada neimplementuje.
        Rozsah je přímý MODS záznam PAGE v hlavním METS; nevztahuje se automaticky na svazek, relatedItem ani jinou úroveň.
        Kardinalita platí v uvedeném rodiči a nepřebírá počet výskytů z ukázky. Kontext rodiče se určuje nezávisle na přítomnosti
        nebo správné hodnotě kontrolovaného potomka; neurčená role není splněním kontroly. Custom kontroly jsou deklarativní,
        registr je nad SIP nespouští.
    examples:
      - id: sip-mods-page-genre-0001
        title:
          cs: Označení reprezentativní a běžné stránky — stránka 0001 vzorového SIP
        language: xml
        kind: source_excerpt
        code: <mods:genre xmlns:mods="http://www.loc.gov/mods/v3" type="titlePage">reprePage</mods:genre>
        note:
          cs: Doslovný výřez MODSMD_PAGE_0001 (MODS 3.8, DMF 2.3 deklarována v info.xml). První stránka obsahuje right a genre
            type=titlePage s textem reprePage; čtvrtá left a genre type=normalPage s textem page. Výřez dokládá uložené hodnoty,
            nikoli správnost přidělení UUID, reprezentativnosti nebo shodu s obrazem předlohy. Nejde o potvrzení celého SIP.
        source:
