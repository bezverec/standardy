schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-SAMPLING-FREQUENCY-UNIT
title:
  cs: "Jednotka vzorkovací frekvence"
description:
  cs: "samplingFrequencyUnit v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-SAMPLING-FREQUENCY-UNIT
    relation_to_target:
      type: restricts
    category: technical/sampling
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS DMF 2.3 vyžaduje samplingFrequencyUnit; hodnota určuje podmínku povinnosti frekvencí X/Y."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      allowed_values: ["no absolute unit of measurement","in.","cm"]
      validations:
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 87
      section: "7.5.4 Technická metadata MIX — samplingFrequencyUnit"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit; typeOfSamplingFrequencyUnitType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost M, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 87; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "Přípustné řetězce pocházejí z MIX 2.0. Tečka v in. je součástí hodnoty. Při absenci jednotky nelze vyhodnotit podmínku X/Y; chybějící jednotku zachytí toto samostatné povinné pravidlo."
relations:
  - type: related_to
    target: NDK-MONO-MIX-X-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-Y-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-SAMPLING-FREQUENCY-PLANE
