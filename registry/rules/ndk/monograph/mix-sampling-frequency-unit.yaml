schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-SAMPLING-FREQUENCY-UNIT
title:
  cs: "Jednotka vzorkovací frekvence"
description:
  cs: "samplingFrequencyUnit v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-SAMPLING-FREQUENCY-UNIT
    relation_to_target:
      type: restricts
    category: technical/sampling
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na technická obrazová metadata souboru MC/PS. Neřeší bibliografický popis nosiče ani katalogizační obsah."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 87
          section: "7.5.4 Technická metadata MIX — samplingFrequencyUnit"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS DMF 2.3 vyžaduje samplingFrequencyUnit; hodnota určuje podmínku povinnosti frekvencí X/Y."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      allowed_values: ["no absolute unit of measurement","in.","cm"]
      validations:
        - type: xpath
          expression: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 87
      section: "7.5.4 Technická metadata MIX — samplingFrequencyUnit"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics/mix:samplingFrequencyUnit; typeOfSamplingFrequencyUnitType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    examples:
      - id: "sip-75faba8d-mix-sampling-frequency-unit"
        title:
          cs: "Jednotka a frekvence vzorkování MC"
        language: xml
        kind: source_excerpt
        code: |-
          <mix:SpatialMetrics xmlns:mix="http://www.loc.gov/mix/v20">
            <mix:samplingFrequencyUnit>in.</mix:samplingFrequencyUnit>
            <mix:xSamplingFrequency>
              <mix:numerator>15748</mix:numerator>
              <mix:denominator>39</mix:denominator>
            </mix:xSamplingFrequency>
            <mix:ySamplingFrequency>
              <mix:numerator>15748</mix:numerator>
              <mix:denominator>39</mix:denominator>
            </mix:ySamplingFrequency>
          </mix:SpatialMetrics>
        note:
          cs: "MC, blok MIX_003 s identifikátorem MC_1_00010003_2R. Převzata je celá skupina SpatialMetrics. Hodnoty 15748/39 a jednotka in. jsou ponechány beze změny; nejsou zaokrouhleny na 400 ani přeneseny z PS."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='MIX_003']/mets:mdWrap/mets:xmlData/mix:mix/mix:ImageAssessmentMetadata/mix:SpatialMetrics"
        namespaces: {"mets":"http://www.loc.gov/METS/","mix":"http://www.loc.gov/mix/v20"}
        checked_on: "2026-10-05"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost M, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 87; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "Přípustné řetězce pocházejí z MIX 2.0. Tečka v in. je součástí hodnoty. Při absenci jednotky nelze vyhodnotit podmínku X/Y; chybějící jednotku zachytí toto samostatné povinné pravidlo."
relations:
  - type: related_to
    target: NDK-MONO-MIX-X-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-Y-SAMPLING-FREQUENCY
  - type: related_to
    target: NDK-MONO-MIX-SAMPLING-FREQUENCY-PLANE
