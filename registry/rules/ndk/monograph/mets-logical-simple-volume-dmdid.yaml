      date: "2026-10-05"
      reference: "Požadavek porovnán s DMF 2.3, zejména vykreslenými s. 98–99, a s deklaracemi METS XSD 1.9.1. XML výřezy doloženy XPath a SHA-256. Externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "DMDID je v obecném METS volitelný xs:IDREFS. Četnost 1–1 označuje atribut, nikoli počet tokenů. MODSMD_VOLUME_0001 je ID dmdSec, nikoli ID vnořeného mods:mods; prefix ani koncovka nejsou univerzální podmínkou. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Kontext no_internal_parts vychází ze zvoleného rozsahu popisu, nikoli pouze z chybějících kapitol. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci, nikoli doložené chování externího validátoru."
