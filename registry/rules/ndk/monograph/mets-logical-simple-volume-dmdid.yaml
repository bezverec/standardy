schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-LOGICAL-SIMPLE-VOLUME-DMDID"
title:
  cs: "Popisná metadata svazku v logické mapě"
description:
  cs: "Logická struktura a propojení stran hlavního METS podle DMF Monografie 2.3; obecná vazební pravidla jsou oddělena od varianty bez popisu vnitřních částí."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-DMDID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-logical"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Logický div svazku v popisu bez kapitol obsahuje DMDID odkazující na příslušný blok popisných metadat."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat DMDID na logickém uzlu svazku. Tokeny IDREFS rozlišit a ověřit proti dmdSec téhož METS pro tento svazek; jiné existující ID ani popis jiné stránky nepostačuje."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "LOGICAL"
        -
          field: "logical_description_mode"
          operator: "equals"
          value: "no_internal_parts"
        -
          field: "structural_level"
          operator: "equals"
          value: "volume"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 98
      section: "7.7.1.2.3 Vyjádření logické struktury bez popisu kapitol"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType; divType; metsType/structLink; structLinkType/smLink"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
