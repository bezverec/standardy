schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ORIGININFO"
title:
  cs: "Nakladatelské údaje v originInfo"
description:
  cs: "Původ a místa vydání svazku jednosvazkové monografie podle DMF 2.3; odlišení AACR a RDA a vazby na MARC 260/264 a 008."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ORIGININFO"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Záznam svazku musí obsahovat originInfo. Každý výskyt pole MARC 260/264 má vlastní originInfo; opakovaná podpole a/b se převedou se zachováním vzájemných vztahů."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Kontrolovat přímé originInfo v celém MODS záznamu. Při více polích 260/264 opakovat originInfo pro každé pole. Opakovaná $a/$b uvnitř jediného pole lze vyjádřit opakováním potomků nebo originInfo, ale musí zůstat zachována vazba místa a vydavatele. Počet kontejnerů sám správný převod nedokládá."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "51–52"
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — originInfo, eventType a place"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsGroup; originInfoDefinition; placeDefinition; placeTermDefinition; codeOrText; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Porovnáno s textem a vykreslenými tabulkami s. 51–52 DMF 2.3 a deklaracemi MODS XSD 3.8. Výřezy ukotveny XPath a SHA-256; ověřena deklarace AACR ve vzoru. Původní MARC a implementace nástrojů nebyly ověřeny."
    interpretation:
      cs: "M se týká přítomnosti kontejneru i při nedostupnosti některých jeho podřízených údajů. Obecné MODS umožňuje opakování originInfo, jeho národní povinnost však neurčuje. Tato sada ještě samostatně nepopisuje agent, data ani issuance. Kontext je omezen na přímé originInfo MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, subject, stránku nebo titul vícesvazku. Katalogizační pravidla a dostupnost údajů se zjišťují nezávisle ze zdroje, ne podle existence či správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-origininfo-origin"
        title:
          cs: "OriginInfo ze vzorového AACR záznamu"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mods:originInfo xmlns:mods="http://www.loc.gov/mods/v3">
                      <mods:place>
                        <mods:placeTerm authority="marccountry" type="code">xr</mods:placeTerm>
                        <mods:placeTerm type="text">V Lounech</mods:placeTerm>
                      </mods:place>
                      <mods:agent>
                        <mods:namePart>Tiskem a nákl. Th. Venty (dříve Jos. Neuberta)</mods:namePart>
                        <mods:role>
                          <mods:roleTerm>publisher</mods:roleTerm>
                        </mods:role>
                      </mods:agent>
                      <mods:dateIssued>[1890]</mods:dateIssued>
                      <mods:dateIssued encoding="marc">1890</mods:dateIssued>
                      <mods:issuance>single unit</mods:issuance>
                    </mods:originInfo>
        note:
          cs: "Přesný výřez uzlu vzorového SIP, pouze se sjednoceným odsazením. RecordInfo/descriptionStandard v témže MODS záznamu uvádí aacr; originInfo nemá eventType. Výřez není RDA příkladem ani potvrzením původního převodu MARC nebo validity celého SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, originInfo a místo vydání"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:originInfo"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-06"
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-DMD-XMLDATA"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-EVENT-TYPE"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-PLACE"
