        section: "7.5.3 PREMIS Agent — rozsah popisu agenta v digitalizačním SIP"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 79–81 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a otiskem souboru; externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "software, SW component a operator jsou příklady, nikoli uzavřený číselník. Vzor obsahuje také machine; pouhá odlišnost od příkladů neprokazuje chybu, ale ani platnost vůči konkrétnímu slovníku. Role v této události není agentType. Kardinalita dítěte se vyhodnocuje v každém bezprostředním rodiči cesty event/linkingAgentIdentifier/linkingAgentRole. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-event-linking-agent-role"
        title:
          cs: "Role původce události — EVT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:linkingAgentRole xmlns:premis="info:lc/xmlns/premis-v2">software</premis:linkingAgentRole>
        note:
          cs: "Výřez vedlejšího METS první stránky, zachovaný beze změny hodnot. Hodnoty software a machine jsou pozorování vzoru, nikoli ověření kontrolovaného slovníku. Nejde o potvrzení validity celého SIP ani o důkaz chování nástroje."
