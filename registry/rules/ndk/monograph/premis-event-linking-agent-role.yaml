    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se uvést roli agenta ve vztahu k události; použité hodnoty musí pocházet z kontrolovaného slovníku."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit linkingAgentRole u každé vazby na agenta; při uvedení ověřit hodnoty podle použitého kontrolovaného slovníku. Role může být opakována."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
    source:
