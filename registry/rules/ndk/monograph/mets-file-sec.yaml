    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami DMF 2.3 a s XSD METS 1.9.1. Povinnost je vyjádřena slovně, zdroj v této části neuvádí kód M/MA/R/RA/O. Implementace nástrojů ani úplná validita SIP zde ověřeny nebyly."
    interpretation:
      cs: "XSD připouští fileSec 0–1; požadavek na přítomnost plyne z organizace hlavního METS v DMF. Nejde o seznam všech pomocných souborů SIP z info.xml. Úroveň Povinné je přepis slovního požadavku DMF; historický kód povinnosti záměrně nedoplňujeme. Kardinalita atributu/elementu se vztahuje k jeho rodiči (fileSec k hlavnímu METS, fileGrp k fileSec). Popis custom kontroly není spustitelný validační engine."
