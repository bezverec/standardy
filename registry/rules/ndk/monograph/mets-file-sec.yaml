schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-FILESEC"
title:
  cs: "Sekce souborů hlavního METS"
description:
  cs: "fileSec v hlavním METS podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-FILESEC"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-files"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: "90–91"
          section: "7.6.1 fileSec hlavního záznamu METS"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Hlavní METS musí obsahovat fileSec s evidencí souborů."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Ověřit právě jeden fileSec v hlavním METS."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "90–91"
      section: "7.6.1 fileSec hlavního záznamu METS"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "/mets:mets/mets:fileSec"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
