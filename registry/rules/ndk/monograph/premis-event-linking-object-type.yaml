schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-EVENT-LINKING-OBJECT-TYPE"
title:
  cs: "Typ identifikátoru objektu události"
description:
  cs: "Události digitalizace podle DMF Monografie 2.3; oddělení obecných možností PREMIS 2.2, povinností NDK a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-EVENT-LINKING-OBJECT-TYPE"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-events"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každá vazba na objekt obsahuje právě jeden typ identifikátoru."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každém linkingObjectIdentifier požadovat jeden linkingObjectIdentifierType a při řešení vazby porovnat typ identifikátoru cíle."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 81
      section: "7.5.2 PREMIS Event — linkingObjectIdentifier/linkingObjectIdentifierType"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "linkingObjectIdentifierComplexType/linkingObjectIdentifierType (1–1); xs:string"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: obecná kardinalita a povinnosti DMF; povinné děti doporučeného rodiče"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 79–81 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a otiskem souboru; externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "DMF uvádí file jako příklad, nikoli jako jedinou povolenou hodnotu. Nejde o xsi:type souborového objektu ani o reprezentaci MC/PS/ALTO. Kardinalita dítěte se vyhodnocuje v každém bezprostředním rodiči cesty event/linkingObjectIdentifier/linkingObjectIdentifierType. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-event-linking-object-type"
