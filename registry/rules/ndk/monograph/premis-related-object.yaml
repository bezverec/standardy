        checked_on: "2026-10-05"
      -
        id: "sip-premis-related-object-PS-identita"
        title:
          cs: "Identifikace souvisejícího objektu — PS-identita"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:objectIdentifier xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:objectIdentifierType>file</premis:objectIdentifierType>
            <premis:objectIdentifierValue>PS_1_00010003_2R</premis:objectIdentifierValue>
          </premis:objectIdentifier>
        note:
          cs: "Cílový pár typu a hodnoty pro vztah MC je v objektu OBJ_002. Jde o metadata PS, nikoli požadavek na přítomnost již smazaného souboru. Výřez je zachován ze zdroje; není potvrzením validity SIP ani důkazem chování konkrétní implementace."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='OBJ_002']/mets:mdWrap/mets:xmlData/premis:object/premis:objectIdentifier"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          premis: "info:lc/xmlns/premis-v2"
        checked_on: "2026-10-05"
    discrepancies:
      -
        cs: "Na první stránce vzorového SIP vede vztah MC v OBJ_003 na file / PS_1_00010003_2R (OBJ_002), ale ALTO v OBJ_004 na file / MC_1_00010003_2R (OBJ_003). DMF na s. 78 požaduje vyjádření vztahu MC/XML k původnímu objektu (skenu). Přímý cíl ALTO tedy není PS; výklad přijatelnosti nepřímé cesty ALTO → MC → PS nebyl potvrzen. Nejde o nerozlišitelný nebo neexistující identifikátor a samotný řetězec vazeb neprokazuje skutečný výrobní postup."
