        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='OBJ_004']/mets:mdWrap/mets:xmlData/premis:object/premis:relationship/premis:relatedObjectIdentification"
        namespaces:
          mets: "http://www.loc.gov/METS/"
