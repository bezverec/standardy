schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-FLOCAT"
title:
  cs: "Umístění evidovaného souboru"
description:
  cs: "FLocat v hlavním METS podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-FLOCAT"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-files"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý file má FLocat s odkazem na svůj soubor."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "U každého file ověřit alespoň jeden FLocat; kontrolovat atributy každého lokátoru, nikoli pouze prvního."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "file_group_id"
          operator: "in"
          value:
            - "MC_IMGGRP"
            - "UC_IMGGRP"
            - "ALTOGRP"
            - "TECHMDGRP"
            - "TXTGRP"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "90–91"
      section: "7.6.1 fileSec hlavního záznamu METS"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "/mets:mets/mets:fileSec/mets:fileGrp/mets:file/mets:FLocat"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
      -
        id: "sip-main-mets-flocat"
        title:
          cs: "Archivní obraz první stránky"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:FLocat LOCTYPE="URL" xlink:href="mastercopy/mc_75faba8d-c629-11f0-8950-12e8557df20e_0001.jp2" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:mets="http://www.loc.gov/METS/" />
        note:
          cs: "Ukázka se týká MC první stránky. Výřez ze zdrojového SIP, nikoli univerzální šablona ani výsledek úplné validace."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:fileSec/mets:fileGrp[@ID='MC_IMGGRP']/mets:file[@ID='mc_0001']/mets:FLocat"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          xlink: "http://www.w3.org/1999/xlink"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami DMF 2.3 a s XSD METS 1.9.1. Povinnost je vyjádřena slovně, zdroj v této části neuvádí kód M/MA/R/RA/O. Implementace nástrojů ani úplná validita SIP zde ověřeny nebyly."
    interpretation:
      cs: "METS fileType dovoluje FLocat 0–n a také vložený FContent. DMF popisuje souborové odkazy; pravidlo požaduje alespoň jeden FLocat, ale bez opory nestanovuje maximum 1. Více lokátorů jednoho file musí označovat kopie téhož souboru. Úroveň Povinné je přepis slovního požadavku DMF; historický kód povinnosti záměrně nedoplňujeme. Kardinalita atributu/elementu se vztahuje k jeho rodiči (fileSec k hlavnímu METS, fileGrp k fileSec). Popis custom kontroly není spustitelný validační engine."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-LOCTYPE"
  -
    type: "related_to"
    target: "NDK-MONO-METS-HREF"
