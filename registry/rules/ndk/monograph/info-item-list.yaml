schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-ITEM-LIST"
title:
  cs: "Úplný seznam souborů balíčku"
description:
  cs: "Požadavek na /info/itemlist v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "NDK-INFO-ITEM-LIST"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "itemlist zahrnuje všechny soubory SIP včetně podadresářů a samotného info.xml."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "xpath"
          expression: "/info/itemlist"
          assertion: "exists"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 17
      section: "7.1 Soubor info.xml — itemlist"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/itemlist"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 12
        section: "5.1 Soubor info.xml"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 17. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "Seznam zahrnuje také soubor MD5. DMF § 5.1 na s. 12 výslovně vyžaduje odkaz info.xml na sebe. Úplnost se porovnává se skutečným obsahem balíčku, nejen s dalšími XML záznamy."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-ITEM"
  -
    type: "related_to"
    target: "NDK-MONO-INFO-ITEM-TOTAL"
  -
    type: "related_to"
    target: "NDK-MONO-INFO-CHECKSUM"
