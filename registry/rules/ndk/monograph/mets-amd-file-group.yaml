        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu a vykreslených stranách 92 a 98 DMF Monografie 2.3 a porovnán s XSD METS 1.9.1. Výřezy pocházejí z vedlejšího METS první stránky dodaného SIP; popsané nesoulady nejsou výsledkem spuštění externího validátoru."
    interpretation:
      cs: "Obecné METS umožňuje více skupin a jejich vnořování. DMF pro amd_mets.xml výslovně uvádí jeden fileGrp, ale nepředepisuje jeho konkrétní ID/USE. Názvy skupin hlavního METS se sem nepřenášejí. Povinnost je slovní požadavek DMF, proto není doplněn původní kód M/MA. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
    discrepancies:
      -
        cs: "V dodaném amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml jsou čtyři přímé fileGrp. To neodpovídá jednomu fileGrp požadovanému DMF 2.3, s. 92. Nesoulad ukázky nemění normativní stav pravidla a nedokládá chybu XSD."
