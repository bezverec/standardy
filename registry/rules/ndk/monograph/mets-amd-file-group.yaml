                </mets:FLocat>
              </mets:file>
            </mets:fileGrp>
            <mets:fileGrp ID="UC_IMGGRP" USE="Images">
              <mets:file CHECKSUM="ba19b107907aba0acbb50ff1f7816b9b" CHECKSUMTYPE="MD5" CREATED="2026-06-25T08:45:03" ID="uc_0001" MIMETYPE="image/jp2" SEQ="0" SIZE="1276972">
