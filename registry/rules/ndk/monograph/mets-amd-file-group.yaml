schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-AMD-FILE-GROUP"
title:
  cs: "Jediná skupina souborů stránky"
description:
  cs: "Požadavek pro vedlejší METS jedné stránky monografie v DMF 2.3; nikoli pro hlavní METS svazku."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-FILE-GROUPS"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-amd"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 92
          section: "7.6.2 fileSec vedlejšího záznamu amd_mets.xml"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "FileSec vedlejšího METS sdružuje soubory stránky do jednoho fileGrp."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každém vedlejším METS ověřit právě jeden fileSec/fileGrp, který přímo obsahuje file pro reprezentace stránky; nepřebírat členění hlavního METS na více skupin."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.6.2 fileSec vedlejšího záznamu amd_mets.xml"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "metsType/fileSec/fileGrp; fileGrpType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
      -
        id: "sip-amd-mets-file-group-inventory"
        title:
          cs: "Jediná skupina souborů stránky"
        language: "xml"
        kind: "source_excerpt"
        code: |
