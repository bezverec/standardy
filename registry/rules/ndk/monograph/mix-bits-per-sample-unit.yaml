schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-BITS-PER-SAMPLE-UNIT
title:
  cs: "Typ číselné reprezentace vzorku"
description:
  cs: "bitsPerSampleUnit v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-BITS-PER-SAMPLE-UNIT
    relation_to_target:
      type: restricts
    category: technical/color
    obligation: recommended
    obligation_code: R
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS DMF 2.3 doporučuje bitsPerSampleUnit s typem číselné reprezentace vzorků."
    requirement:
      presence: optional
      cardinality:
        min: 0
        max: 1
      allowed_values: ["integer","floating point"]
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 88
      section: "7.5.4 Technická metadata MIX — bitsPerSampleUnit"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:ImageAssessmentMetadata/mix:ImageColorEncoding/mix:BitsPerSample/mix:bitsPerSampleUnit; typeOfBitsPerSampleUnitType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost R, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 88; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "MIX 2.0 připouští integer nebo floating point. Označení jednotky zde rozlišuje číselnou reprezentaci, nikoli počet kanálů či rozměr obrazu."
relations:
  - type: related_to
    target: NDK-MONO-MIX-BITS-PER-SAMPLE-VALUE
  - type: related_to
    target: NDK-MONO-MIX-SAMPLES-PER-PIXEL
