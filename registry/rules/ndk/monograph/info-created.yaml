schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-CREATED"
title:
  cs: "Čas vytvoření balíčku"
description:
  cs: "Požadavek na /info/created v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "NDK-INFO-CREATED"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "created zachycuje okamžik vzniku balíčku v ISO 8601 s přesností na sekundy."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "xpath"
          expression: "/info/created"
          assertion: "exists"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 17
      section: "7.1 Soubor info.xml — created"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/created"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
    examples:
      - id: "sip-75faba8d-info-created"
        title:
          cs: "Čas vytvoření balíčku"
        language: xml
        kind: source_excerpt
        code: |-
          <created>2026-06-29T13:48:13</created>
        note:
          cs: "Datum je převzaté ze vzoru; nejde o datum, které má používat jiný balíček."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "0ede408570bb97daf563f92667c17a021daeaeba5ed3aa9f24b400f8fa84059c"
        source_xpath: "/info/created"
        namespaces: {}
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 17. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "XSD používá xs:dateTime. Pouhý regulární výraz by neověřil platnost kalendářního data; registr jej zde nenahrazuje zjednodušeným regexem."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-CREATOR"
