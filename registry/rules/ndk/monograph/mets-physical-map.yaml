schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-MAP"
title:
  cs: "Fyzická mapa v hlavním METS"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-STRUCTMAP"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Hlavní METS obsahuje fyzickou strukturální mapu označenou TYPE=\"PHYSICAL\"."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V hlavním METS vyhledat structMap s přesným TYPE=PHYSICAL a požadovat alespoň jeden výskyt; pouhá přítomnost LOGICAL tuto povinnost nesplňuje."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "metsType/structMap; structMapType/@TYPE"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
