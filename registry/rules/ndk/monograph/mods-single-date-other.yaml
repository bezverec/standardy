schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-DATE-OTHER"
title:
  cs: "Doporučené datum vytvoření, distribuce nebo výroby"
description:
  cs: "Datum vydání a doplňující data předlohy v MODS svazku jednosvazkové monografie podle DMF 2.3; význam dat a povinnosti oddělené od obecného XSD."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-DATE-OTHER"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin-dates"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Doplnění jiného data je společný předpis s větvemi podle zdroje: 260 pro výrobu i červeně označené 264 pro RDA. Nejde o shodu jednotlivých dat nebo jejich katalogizačního vzniku."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 53
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — dateIssued, jeho atributy a dateOther"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Datum vytvoření, distribuce nebo výroby předlohy lze doporučeně doplnit v dateOther podle MARC 264_0, 264_2 nebo 260$g/264_3."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit dateOther odpovídající příslušné události: vytvoření z 264_0$c, distribuce z 264_2$c, výroba či tisk z 260$g/264_3$c. Zachovat vazbu na správné originInfo a význam data; národní typ rozlišuje samostatné pravidlo. DateOther nenahrazuje povinné dateIssued a není univerzální pole pro datum copyrightu nebo digitalizace."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 53
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — dateIssued, jeho atributy a dateOther"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "originInfoDefinition; dateIssued; dateDefinition; dateOther; dateOtherDefinition; stringPlusLanguage"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 264"
        version: "July 2022"
        page: null
        section: "Second Indicator; $c"
        url: "https://www.loc.gov/marc/bibliographic/bd264.html"
      -
        document: "MARC 21 Bibliographic — 260"
        version: "September 2011"
        page: null
        section: "$g — Date of manufacture"
        url: "https://www.loc.gov/marc/bibliographic/bd260.html"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Ověřeno textově a vizuálně proti s. 53 DMF 2.3 a deklaracím MODS XSD 3.8; význam polí 008/260/264 porovnán s dokumentací MARC. Dvě zdrojová dateIssued ukotvena XPath a SHA-256. Původní MARC ani externí implementace nebyly ověřeny."
    interpretation:
      cs: "R zůstává doporučením, tedy minimum 0; bez zdrojového údaje se datum nevymýšlí. Obecné XSD dovoluje opakovat dateOther a nepovinný type, ale národní předpis vyžaduje type v každém použitém dateOther. U rukopisů je třeba rozlišit samostatný řádek dateCreated, jehož úplné podmínky tato sada zatím neřeší. Mapování do dc:date uvedené v DMF se zde samostatně nekontroluje. Rozsah je omezen na data v přímém originInfo MODS záznamu svazku jednosvazkové monografie, nikoli na relatedItem, subject, datum metadat nebo digitalizace. Zdroj pole a význam data se určují nezávisle z katalogu, ne podle přítomnosti či správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-DATE-ISSUED"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-DATE-OTHER-TYPE"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-EVENT-TYPE"
