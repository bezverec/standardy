schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-IDENTIFIER-TYPE
title:
  cs: "Typ identifikátoru svazku"
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-IDENTIFIER-TYPE
    relation_to_target:
      type: restricts
    category: metadata/mods-identifiers
    cataloguing_rules: [aacr2, rda]
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-11-04
      note:
        cs: "Společný bibliografický předpis pro identifikátory popisovaného svazku podle tabulky s. 57–58 a legendy s. 24. Toto posouzení se nepřenáší na generování UUID a URN:NBN, které mají vlastní nezávislá pravidla."
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: "57–58"
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — identifier"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnosti a barevné kódování AACR2/RDA"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Každý identifier má povinný atribut type určující druh identifikátoru. DMF rozlišuje uuid, urnnbn, ccnb, isbn, issn a ismn a doporučuje také další identifikátory, například barcode, oclc, sysno, permalink nebo accession."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      validations:
        - type: custom
          expression: "Na každém přímém mods:identifier svazku ověřit jeden neprázdný type odpovídající významu hodnoty. Povinnosti jednotlivých typů vyhodnocovat podle jejich vlastních pravidel. Otevřený seznam dalších typů neuzavírat na příklady vyjmenované v DMF."
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_identifier
    source:
      document: DMF Monografie
      version: "2.3"
      page: "57–58"
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — identifier"
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: DMF Monografie
        version: "2.3"
        page: "9–10"
        section: "4 Identifikátory — přidělení UUID a URN:NBN, úroveň svazku, neplatné hodnoty a Dublin Core"
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: "modsGroup; identifierDefinition; yes"
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: "identifier; type; invalid"
        url: https://www.loc.gov/standards/mods/userguide/identifier.html
    verification:
      status: verified
      date: 2026-11-04
      reference: "Vizuálně ověřena tabulka DMF 2.3 s. 57 a pokračování s. 58, kapitola 4 s. 9–10 a legenda s. 24. Ověřeny deklarace MODS XSD 3.8 a význam identifier v LOC. Ověření přepisu neprokazuje platnost či přidělení konkrétních identifikátorů."
    interpretation:
      cs: "M u atributu není příkaz uvést každý typ v každé knize. Tabulka má pro konkrétní typy M/MA/R; formulace „pokud existují“ nesnižuje povinnost dodavatele vytvořit UUID a zajistit URN:NBN svazku podle kapitoly 4. XSD dovoluje type jako volný řetězec. Rozsah: přímé identifier v MODS svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem, titul vícesvazku, kapitola, příloha nebo stránka. U pravidla konkrétního typu se kardinalita vztahuje pouze na odpovídající podmnožinu identifier; u atributu na každý příslušný rodičovský element. Horní mez počtu elementů se bez opory ve zdroji neomezuje. Dostupnost a platnost se zjišťují ze zdroje, ne z absence cílového XML; neznámý kontext není false. Custom kontroly jsou deklarativní, registr je nad SIP nespouští."
    examples:
      - id: sample-mono-identifier-type-urnnbn
        title:
          cs: "Typ identifikátoru svazku — urnnbn ve vzorovém SIP"
        language: xml
        kind: source_excerpt
        code: |
          <mods:identifier xmlns:mods="http://www.loc.gov/mods/v3" type="urnnbn">urn:nbn:cz:nk-008m3g</mods:identifier>
        note:
          cs: "Výřez přímého identifier z MODSMD_VOLUME_0001: genre=volume, issuance=single unit, descriptionStandard=aacr, MODS 3.8; info deklaruje DMF 2.3. Původní hodnota zůstává zachována. Vzor neobsahuje invalid, ISBN, ISSN ani ISMN. Původní MARC, aktuální platnost a přidělení identifikátorů ani služba resolveru nebyly ověřeny."
        source:
          document: Vzorový SIP 75faba8d-c629-11f0-8950-12e8557df20e
          version: DMF Monografie 2.3 (deklarováno v info.xml)
          page: null
