schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-VALIDATION"
title:
  cs: "Informace o validaci balíčku"
description:
  cs: "Požadavek na /info/validation v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "disputed"
    target:
      entity: "NDK-INFO-VALIDATION"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na správu, inventář nebo integritu SIP v info.xml, nikoli na bibliografickou katalogizaci předlohy."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 17
          section: "7.1 Soubor info.xml — validation"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Informace o provedené validaci se zaznamenává do validation s povinností MA."
    requirement:
      presence: "conditional"
      cardinality:
        min: 1
        max: 1
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 17
      section: "7.1 Soubor info.xml — validation"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/validation"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
    examples:
      - id: "sip-75faba8d-info-validation"
        title:
          cs: "Záznam o validaci ve vzoru"
        language: xml
        kind: source_excerpt
        code: |-
          <validation version="all_pages:1.0">Valid</validation>
        note:
          cs: "Hodnota Valid a označení all_pages:1.0 jsou původním tvrzením balíčku, nikoli výsledkem validace provedené registrem."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "info_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "0ede408570bb97daf563f92667c17a021daeaeba5ed3aa9f24b400f8fa84059c"
        source_xpath: "/info/validation"
        namespaces: {}
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 17. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "Dostupnost informace se nesmí odvozovat jen z existence elementu. DMF zde nestanovuje strojově vyhodnotitelnou podmínku; registr ji nevymýšlí. Prázdný výsledek není totéž co úspěšná validace."
    discrepancies:
      -
        cs: "DMF 2.3 uvádí MA, ale XSD info 1.1 nemá u validation minOccurs=0, a proto požaduje jeden výskyt bezpodmínečně. Pravidlo zachovává MA z DMF; validita vůči XSD je samostatná kontrola."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-VALIDATION-VERSION"
  -
    type: "related_to"
    target: "NDK-MONO-INFO-VALIDATION-RESULT"
