schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-SUBJECT"
title:
  cs: "Věcné údaje svazku"
description:
  cs: "Věcné údaje svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-SUBJECT"
    relation_to_target:
      type: "clarifies"
    category: "metadata/mods-subject"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-10"
      note:
        cs: "Černě vyznačené doporučení v tabulce jednosvazku je podle legendy s. 24 společné AACR2/RDA. Společný požadavek na převod nedokládá shodnost všech postupů věcné katalogizace ani správnost zdrojového záhlaví."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 55
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — subject"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se uvést subject s údaji o věcném třídění; předpokládá se převzetí z katalogizačního záznamu."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit převzetí věcných údajů z katalogizačního záznamu do přímého subject svazku. Absence subject není porušením povinné přítomnosti. Nevyžadovat současně topic, geographic a temporal v každém subject."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 55
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — subject"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; subjectDefinition; stringPlusLanguagePlusAuthority; temporalDefinition; dateDefinition; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines: subject"
        version: "3"
        page: null
        section: "subject, topic, geographic, temporal; authority attributes"
        url: "https://www.loc.gov/standards/mods/userguide/subject.html"
    verification:
      status: "verified"
      date: "2026-10-10"
      reference: "Ověřen text i vykreslené tabulky s. 55–56 DMF 2.3, legenda s. 24 a deklarace MODS XSD 3.8. Ověření přepisu není validací celého SIP, zdrojového MARC ani členství termínů v autoritním slovníku."
    interpretation:
      cs: "Obecné XSD připouští i prázdný kontejner, což nedokládá věcný obsah doporučený DMF. Doporučení převzetí neznamená bezvýhradný převod všech 6XX do stejného typu potomka. Pravidlo se vztahuje pouze k přímému subject MODS záznamu svazku jednosvazkové monografie v hlavním METS, ne relatedItem, stránce či titulu vícesvazku. Kontext se určuje nezávisle ze zdroje; neznámá hodnota není false ani potvrzení shody. Kardinalita je vztažena k jednotlivému rodiči, nevytváří povinnost založit doporučený kontejner. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-subject-complex"
        title:
          cs: "Téma a geografický údaj v jednom záhlaví"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:subject xmlns:mods=\"http://www.loc.gov/mods/v3\" authority=\"czenas\">\n  <mods:topic>objevitelé a vynálezci</mods:topic>\n  <mods:geographic>Spojené státy americké</mods:geographic>\n</mods:subject>"
        note:
          cs: "Záhlaví obsahuje topic a geographic, nikoli všechny možné druhy věcných údajů. Zdroj deklaruje descriptionStandard=aacr; původní MARC ani úplná validita SIP nebyly ověřeny. Jde o pozorovaný výřez, nikoli univerzální šablonu nebo ověření členství v autoritním slovníku."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, věcné údaje"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:subject[3]"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-10"
      -
        id: "sip-mods-subject-geographic-code"
        title:
          cs: "Samostatné záhlaví s geografickým kódem"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:subject xmlns:mods=\"http://www.loc.gov/mods/v3\">\n  <mods:geographicCode authority=\"marcgac\">n-us---</mods:geographicCode>\n</mods:subject>"
        note:
          cs: "Authority marcgac je na geographicCode, rodič subject nemá authority. Výřez není dokladem splnění doporučení pro subject/@authority ani subject/geographic. Zdroj deklaruje descriptionStandard=aacr; původní MARC ani úplná validita SIP nebyly ověřeny. Jde o pozorovaný výřez, nikoli univerzální šablonu nebo ověření členství v autoritním slovníku."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, věcné údaje"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
