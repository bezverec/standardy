schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-SUBJECT-CARTOGRAPHICS"
title:
  cs: "Kartografické údaje věcného popisu"
description:
  cs: "Kartografické údaje a jmenná věcná záhlaví svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-SUBJECT-CARTOGRAPHICS"
    relation_to_target:
      type: "clarifies"
    category: "metadata/mods-subject-details"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-11"
      note:
        cs: "Černé řádky na s. 56 jsou podle legendy s. 24 společné AACR2/RDA. Jde o bibliografický popis předlohy a jejích věcných záhlaví, ne technická metadata skenu. Společný přenos údajů nedokládá totožnost katalogizačních postupů."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 56
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — cartographics a subject/name"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a potomka, barevné kódování AACR2/RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se uvést kartografické údaje v cartographics převzaté z pole MARC 21 034. Použití se předpokládá zejména u kartografických dokumentů a vedut."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Posoudit převzetí kartografických údajů ze zdrojového záznamu do cartographics. Formulace zejména kartografické dokumenty a veduty není omezením pouze na tyto předlohy. Absence doporučeného kontejneru není porušením povinné přítomnosti; jeho MA potomci sami nezakládají povinnost kontejner vytvořit."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_subject"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 56
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — cartographics a subject/name"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "subjectDefinition; cartographicsDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines: subject"
        version: "3"
        page: null
        section: "cartographics; coordinates; scale; name"
        url: "https://www.loc.gov/standards/mods/userguide/subject.html"
    verification:
      status: "verified"
      date: "2026-10-11"
      reference: "Porovnány text a vykreslená tabulka DMF 2.3 s. 56, pravidla rodičovské povinnosti a barev s. 24 a příslušné deklarace MODS XSD 3.8. XML doklady jsou ukotveny XPath a SHA-256; nejde o validaci celého SIP, původního MARC ani autoritního přiřazení."
    interpretation:
      cs: "Řádek kontejneru zmiňuje MARC 034, ale samostatný řádek scale výslovně používá 255$a; toto mapování se nesjednocuje na 034. Monograph označuje rozsah DMF, nikoli pouze textovou knihu. Obecné MODS připouští i projection a cartographicExtension; tato sada pro ně nevymýšlí národní povinnosti. Rozsah je přímý subject MODS záznamu svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem, stránka či titul vícesvazku. Kontext rodiče a případná dostupnost se určují nezávisle ze zdroje; neznámá hodnota není false ani potvrzení shody. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-SUBJECT"
