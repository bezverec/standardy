schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-AMD-PAGE-DIV"
title:
  cs: "Jediný div stránky MONOGRAPH_PAGE"
description:
  cs: "Požadavek pro vedlejší METS jedné stránky monografie v DMF 2.3; nikoli pro hlavní METS svazku."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-amd"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 98
          section: "7.7.2 structMap vedlejšího záznamu METS (amd_mets.xml)"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Fyzická mapa vedlejšího METS obsahuje jediný div s TYPE=\"MONOGRAPH_PAGE\"."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každé fyzické mapě vedlejšího METS ověřit jediný přímý div s TYPE=MONOGRAPH_PAGE a nepřítomnost dalších vnořených div; kardinalita platí pro celou mapu, ne pro každý rodič zvlášť."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 98
      section: "7.7.2 structMap vedlejšího záznamu METS (amd_mets.xml)"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType/div; divType/@TYPE; divType/div"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
      -
        id: "sip-amd-mets-page-div-map"
        title:
          cs: "Jediný div stránky MONOGRAPH_PAGE"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:structMap LABEL="Physical_Structure" TYPE="PHYSICAL" xmlns:mets="http://www.loc.gov/METS/">
            <mets:div TYPE="MONOGRAPH_PAGE">
              <mets:fptr FILEID="mc_0001" />
              <mets:fptr FILEID="uc_0001" />
              <mets:fptr FILEID="alto_0001" />
              <mets:fptr FILEID="txt_0001" />
            </mets:div>
          </mets:structMap>
        note:
          cs: "Stránkový div má TYPE=\"MONOGRAPH_PAGE\". Žádné ID, ORDER nebo ORDERLABEL do zdrojové ukázky nedoplňujeme. Výřez je zachován ze zdroje; nejde o potvrzení validity SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Vedlejší METS první stránky, amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:structMap"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          xlink: "http://www.w3.org/1999/xlink"
          premis: "info:lc/xmlns/premis-v2"
          mix: "http://www.loc.gov/mix/v20"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu a vykreslených stranách 92 a 98 DMF Monografie 2.3 a porovnán s XSD METS 1.9.1. Výřezy pocházejí z vedlejšího METS první stránky dodaného SIP; popsané nesoulady nejsou výsledkem spuštění externího validátoru."
    interpretation:
      cs: "METS structMapType již vyžaduje jeden kořenový div, avšak obecný divType dovoluje další vnořené div a TYPE je volný. Omezení celé mapy na jeden div a konkrétní typ je požadavkem DMF pro vedlejší METS. Nejde o typ stránky titlePage/normalPage z hlavní fyzické mapy. Povinnost je slovní požadavek DMF, proto není doplněn původní kód M/MA. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-AMD-STRUCTMAP"
  -
    type: "related_to"
    target: "NDK-MONO-METS-AMD-FPTR-FILEID"
