schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-AMD-ADMID"
title:
  cs: "Vazba reprezentace na správná technická metadata"
description:
  cs: "Požadavek pro vedlejší METS jedné stránky monografie v DMF 2.3; nikoli pro hlavní METS svazku."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-FILE-ADMID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-amd"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "MC a ALTO s vlastním PREMIS Object nebo MIX mají v file/@ADMID odkazy na techMD popisující právě tuto reprezentaci."
    requirement:
      presence: "conditional"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Pro MC a ALTO s vlastním záznamem PREMIS Object nebo MIX vyžadovat neprázdné ADMID. Rozdělit hodnotu jako xs:IDREFS na jednotlivá ID, dohledat příslušné techMD v témže METS a ověřit, že jejich obsah popisuje tentýž soubor a reprezentaci. Nestačí existence ID nebo shodný počet tokenů; ověřit identifikaci objektu a podle dostupnosti formát, velikost či fixity."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "ALTO"
        -
          field: "has_own_premis_object_or_mix"
          operator: "equals"
          value: true
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.6.2 fileSec vedlejšího záznamu amd_mets.xml"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "fileType/@ADMID (xs:IDREFS)"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
