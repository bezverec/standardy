        note:
          cs: "NESOULAD: ADMID=\"OBJ_002 MIX_002\" u MC odkazuje na PS. Další výřezy ukazují ALTO odkazující na OBJ_003 (MC) i identifikátory cílových bloků. Hodnoty ponecháváme přesně ze zdroje. Výřez je zachován ze zdroje; nejde o potvrzení validity SIP."
