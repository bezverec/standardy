    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu a vykreslených stranách 92 a 98 DMF Monografie 2.3 a porovnán s XSD METS 1.9.1. Výřezy pocházejí z vedlejšího METS první stránky dodaného SIP; popsané nesoulady nejsou výsledkem spuštění externího validátoru."
    interpretation:
      cs: "Kardinalita 1–1 platí pro atribut, nikoli pro počet ID v jeho hodnotě. Obecné METS má ADMID nepovinné a připouští i jiné sekce administrativních metadat; DMF zde požaduje techMD správné reprezentace. Podmínka se nesmí nahradit pouhou existencí @ADMID, jinak by chybějící atribut nemohl být zjištěn. Ze vzoru ani textu neodvozujeme univerzální názvy OBJ_003/MIX_003 nebo povinný počet dvou tokenů. Pravidlo se nepřenáší na ADMID hlavního stránkového div. Povinnost je slovní požadavek DMF, proto není doplněn původní kód M/MA. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
    discrepancies:
      -
        cs: "Ve zdrojovém vedlejším METS první stránky mc_0001 používá OBJ_002 MIX_002, jejichž identifikátory označují PS; MIX_002 uvádí image/tiff. alto_0001 odkazuje na OBJ_003 s identifikátorem MC. Jde o sémanticky nesprávné odkazy na existující ID, nikoli o důkaz poškození obrazových souborů nebo chování konkrétního validátoru."
