schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-AGENT-NAME"
title:
  cs: "Jméno nebo název původce"
description:
  cs: "Původci událostí podle DMF Monografie 2.3; rozlišení kontextu SIP/AIP, obecných možností PREMIS 2.2 a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-AGENT-NAME"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-agents"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Identifikace účastníka ochranné či digitalizační činnosti, nikoli bibliografický autor nebo tvorba autoritního záhlaví."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 81
          section: "7.5.3 PREMIS Agent — agentName"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se textově upřesnit agenta, například jménem osoby nebo přesným názvem softwaru; jméno může být opakováno."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "U uvedeného agenta doporučit agentName. Při uvedení posoudit, zda text věcně popisuje původce, nikoli používat jméno místo identifikátoru pro spojování vazeb."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "metadata_record_type"
          operator: "equals"
          value: "premis_agent"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 81
      section: "7.5.3 PREMIS Agent — agentName"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "agentComplexType/agentName (0–n); xs:string"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 81
        section: "7.5.3 PREMIS Agent — úvod, rozsah SIP/AIP a umístění záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: povinnosti a obecné četnosti"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 81–82 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a SHA-256; příkaz z agentNote ani externí validátor nebyly spuštěny."
    interpretation:
      cs: "Názvy a jména v DMF jsou příklady. Software může mít ve jménu verzi, ale DMF neurčuje povinnou syntaxi název-verze ani samostatný element agentVersion. Obsah agentName je tvrzením zdrojových metadat, ne nezávislým ověřením nasazené verze či chování nástroje. metadata_record_type=premis_agent znamená právě vybraný existující element agent v namespace info:lc/xmlns/premis-v2. Pravidla dětí se uplatní i v dobrovolně přidaném Agent v SIP; nepodmiňují se existencí kontrolovaného dítěte. Kardinalita je vztažena ke každému bezprostřednímu rodiči cesty agent/agentName. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-agent-name"
        title:
          cs: "Jméno nebo název původce — AGENT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:agentName xmlns:premis="info:lc/xmlns/premis-v2">Kakadu-8.6.1</premis:agentName>
        note:
          cs: "Výřez vedlejšího METS první stránky je zachován beze změny hodnot. Nejde o potvrzení validity celého SIP ani o nezávislé ověření chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
