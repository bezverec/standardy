schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-CLASSIFICATION-AUTHORITY"
title:
  cs: "Klasifikační schéma"
description:
  cs: "Klasifikační údaje svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-CLASSIFICATION-AUTHORITY"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-classification"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-11"
      note:
        cs: "Černé řádky classification na s. 56 jsou podle legendy s. 24 společné AACR2/RDA. Jde o bibliografické věcné třídění, nikoli technická metadata. Společný požadavek na převod neprokazuje totožnost všech katalogizačních postupů."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 56
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — classification"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a potomka, barevné kódování AACR2/RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každé použité classification musí mít authority. Pro údaje z MARC 080$a a 072$a se používá udc, pro 072$9 Konspekt. DMF uvádí také lcc, ddc, nlm, sudocs, candocs a další hodnoty přípustné podle LOC."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "U každého použitého classification požadovat authority odpovídající konkrétnímu zdrojovému údaji: 080$a → udc; 072$a → udc; 072$9 → Konspekt. Další schémata posoudit podle DMF a seznamu LOC, ne podle uzavřeného výčtu těchto příkladů. AuthorityURI ani valueURI nenahrazuje povinné authority. Jedno MARC 072 může poskytnout oddělené klasifikace z $a a $9."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_classification"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 56
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — classification"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; classificationDefinition; stringPlusLanguagePlusAuthority; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "LOC Classification Scheme Source Codes"
        version: null
        page: null
        section: "Otevřený seznam klasifikačních schémat; stav ověřen 11. 10. 2026"
        url: "https://www.loc.gov/standards/sourcelist/classification.html"
    verification:
      status: "verified"
      date: "2026-10-11"
      reference: "Ověřen přepis a vykreslená tabulka DMF 2.3 s. 56, legenda s. 24 a deklarace MODS XSD 3.8. Ověření není validací celého SIP ani zdrojového MARC; otevřený výklad candocs je označen samostatně."
    interpretation:
      cs: "Zachovává se přesný národní zápis Konspekt, nikoli automatická normalizace na konspekt. Obecné XSD má authority jako nepovinný xs:string; národní M je užší požadavek. DMF uvádí candocs, ale v aktuálně ověřeném seznamu LOC tento kód není nalezen; seznam uvádí cacodoc pro CODOC. Není tím prokázána zaměnitelnost a přepis DMF se automaticky neopravuje. Výklad historického candocs zůstává otevřený; jiné hodnoty nelze odmítat jen proto, že nejsou ve výčtu v DMF. Rozsah je přímé classification MODS záznamu svazku jednosvazkové monografie v hlavním METS, nikoli subject/classification, relatedItem, stránka či titul vícesvazku. Kardinalita platí pro konkrétního rodiče; M atributu nevytváří povinnost založit doporučené classification. Kontext se určuje nezávisle ze zdroje; neznámá hodnota není false ani potvrzení shody. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-classification-authority"
        title:
          cs: "Authority udc na klasifikaci"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:classification xmlns:mods=\"http://www.loc.gov/mods/v3\" authority=\"udc\">621.3-051</mods:classification>"
        note:
          cs: "Výřez dokládá přítomnost authority=udc, nikoli správnost zdrojového mapování. Zdroj deklaruje descriptionStandard=aacr. Původní MARC ani úplná validita SIP nebyly ověřeny; authority=udc samo nerozlišuje původ z 080$a a 072$a. Absence edition proto nedokládá chybu ani splnění podmíněného požadavku."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, klasifikační údaje"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:classification[1]"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-11"
relations:
