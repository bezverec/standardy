schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ROLE"
title:
  cs: "Dostupná role původce"
description:
  cs: "Pojmenovaní původci a jejich role ve svazku jednosvazkové monografie podle DMF 2.3; samostatně od názvových údajů, subject/name a metadat digitalizačních agentů."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-NAME-ROLE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-names"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Společná povinnost dostupné role pojmenovaného původce. Rozdíly ve výběru původců při katalogizaci nejsou tímto pravidlem odstraněny."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 50
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — name a role"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Dostupná role původce vůči svazku se uvede v role příslušného name."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Je-li role původce známa ze zdrojového popisu, požadovat její zápis v přímém name/role. Zachovat vazbu role na správného původce; neodvozovat aut ze samotného name/@type=personal nebo z usage=primary."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_contributor_name"
        -
          field: "contributor_role_available"
          operator: "equals"
          value: true
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 50
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — name a role"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "nameDefinition; namePartDefinition; roleDefinition; roleTermDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC Code List for Relators"
        version: null
        page: null
        section: "List identifier marcrelator; author [aut]; seznam kódů a významů rolí"
        url: "https://www.loc.gov/marc/relators/relaterm.html"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s textem a vykreslenými tabulkami s. 49–50 DMF 2.3, deklaracemi MODS XSD 3.8 a seznamem MARC rolí LOC. XML výřezy jsou ukotveny XPath a SHA-256. Nejde o validaci celého SIP, autoritního záznamu ani implementace nástroje."
    interpretation:
      cs: "Role má MA, nikoli univerzální M. Následující roleTerm a jeho atributy mají M uvnitř posuzované role. Více původců a více rolí se nesmí sloučit tak, aby se ztratilo, komu role patří. Tato sada se zaměřuje na explicitně pojmenované původce, ne na samostatnou konstrukci etal. Kontexty contributor označují jmenné údaje o odpovědnosti přímo pod MODS záznamem svazku jednosvazkové monografie, ne subject, relatedItem, originInfo nebo PREMIS Agent. Dostupnost se zjišťuje nezávisle ze zdroje; nepřítomnost pole v XML není důkaz nedostupnosti a neznámá hodnota není false. Custom kontroly registr nevykonává."
    examples:
      -
        id: "sip-mods-names-role"
        title:
          cs: "Původce a jeho role — role původce"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mods:role xmlns:mods="http://www.loc.gov/mods/v3">
                        <mods:roleTerm authority="marcrelator" type="code">aut</mods:roleTerm>
                      </mods:role>
        note:
          cs: "Úplný vybraný uzel vzorového SIP, bez změny hodnot. Dokládá zápis původce Mařík, J. a související údaje; neprokazuje shodu s původním MARC, správnost autoritního přiřazení nebo validitu celého SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, jméno původce"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:name/mods:role"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-06"
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-NAME"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ROLE-TERM"
