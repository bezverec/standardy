schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ORIGIN-PLACE-TERM-TYPE"
title:
  cs: "Způsob zápisu místního údaje"
description:
  cs: "Původ a místa vydání svazku jednosvazkové monografie podle DMF 2.3; odlišení AACR a RDA a vazby na MARC 260/264 a 008."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ORIGIN-PLACE-TERM-TYPE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Společné rozlišení code/text podle zdrojového pole. Červená větev 264 doplňuje pro RDA společné mapování 008/260."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: "51–52"
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — originInfo, eventType a place"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každé použité placeTerm musí mít type: code pro údaj z MARC 008/15–17, text pro údaj z 260/264."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      allowed_values:
        - "code"
        - "text"
      validations:
        -
          type: "custom"
          expression: "Na každém placeTerm požadovat type. Podle nezávisle doloženého zdrojového pole přiřadit 008/15–17 → code; 260$a/264$a → text. Pouhé členství v seznamu code/text nedokládá správnost převodu; zdroj se nesmí zpětně určit jen z kontrolovaného type."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_origin_place_term"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "51–52"
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — originInfo, eventType a place"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsGroup; originInfoDefinition; placeDefinition; placeTermDefinition; codeOrText; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Porovnáno s textem a vykreslenými tabulkami s. 51–52 DMF 2.3 a deklaracemi MODS XSD 3.8. Výřezy ukotveny XPath a SHA-256; ověřena deklarace AACR ve vzoru. Původní MARC a implementace nástrojů nebyly ověřeny."
    interpretation:
      cs: "M platí uvnitř použitého placeTerm, nikoli jako příkaz vymyslet nedostupné místo. Obecné XSD připouští code/text, ale atribut nevyžaduje; národní M je samostatné. Původní MARC nebyl pro dodaný SIP analyzován. Kontext je omezen na přímé originInfo MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, subject, stránku nebo titul vícesvazku. Katalogizační pravidla a dostupnost údajů se zjišťují nezávisle ze zdroje, ne podle existence či správnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-origin-place-term-type-code"
        title:
          cs: "Kód země xr"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:placeTerm xmlns:mods=\"http://www.loc.gov/mods/v3\" authority=\"marccountry\" type=\"code\">xr</mods:placeTerm>"
        note:
          cs: "Přesný výřez uzlu vzorového SIP, pouze se sjednoceným odsazením. RecordInfo/descriptionStandard v témže MODS záznamu uvádí aacr; originInfo nemá eventType. Výřez není RDA příkladem ani potvrzením původního převodu MARC nebo validity celého SIP."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, originInfo a místo vydání"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
