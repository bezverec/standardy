schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-AGENT-IDENTIFIER"
title:
  cs: "Identifikátor původce události"
description:
  cs: "Původci událostí podle DMF Monografie 2.3; rozlišení kontextu SIP/AIP, obecných možností PREMIS 2.2 a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-AGENT-IDENTIFIER"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-agents"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na ochranná metadata souborů, událostí nebo jejich původců. Nejde o bibliografické vztahy děl a tvůrců podle AACR2/RDA."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 81
          section: "7.5.3 PREMIS Agent — agentIdentifier"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý uvedený agent má alespoň jeden identifikátor jednoznačný v daném kontextu, složený z typu a hodnoty."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V každém premis:agent požadovat alespoň jeden agentIdentifier. V každém výskytu ověřit jednu dvojici agentIdentifierType a agentIdentifierValue; při řešení odkazů z Event porovnat obě složky v příslušném identifikačním kontextu. Více identifikátorů téhož agenta je povoleno."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "metadata_record_type"
          operator: "equals"
          value: "premis_agent"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 81
      section: "7.5.3 PREMIS Agent — agentIdentifier"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "agentComplexType/agentIdentifier (1–n); agentIdentifierComplexType"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 81
        section: "7.5.3 PREMIS Agent — úvod, rozsah SIP/AIP a umístění záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: povinnosti a obecné četnosti"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 81–82 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a SHA-256; příkaz z agentNote ani externí validátor nebyly spuštěny."
    interpretation:
      cs: "Kardinalita je 1–n, nikoli 1–1. Identifikátor není jméno agenta, verze programu ani XML ID digiprovMD. Ve vzoru má obal AGENT_004 identitu NK_AgentID / Kakadu-mastercopy. Odkaz z Event používá tuto dvojici, nikoli AGENT_004. Nevyžadujeme globální jedinečnost samotné hodnoty bez jejího typu a kontextu. metadata_record_type=premis_agent znamená právě vybraný existující element agent v namespace info:lc/xmlns/premis-v2. Pravidla dětí se uplatní i v dobrovolně přidaném Agent v SIP; nepodmiňují se existencí kontrolovaného dítěte. Kardinalita je vztažena ke každému bezprostřednímu rodiči cesty agent/agentIdentifier. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-agent-identifier"
        title:
          cs: "Identifikátor původce události — AGENT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:agentIdentifier xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:agentIdentifierType>NK_AgentID</premis:agentIdentifierType>
            <premis:agentIdentifierValue>Kakadu-mastercopy</premis:agentIdentifierValue>
          </premis:agentIdentifier>
        note:
          cs: "Výřez vedlejšího METS první stránky je zachován beze změny hodnot. Nejde o potvrzení validity celého SIP ani o nezávislé ověření chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:digiprovMD[@ID='AGENT_004']/mets:mdWrap/mets:xmlData/premis:agent/premis:agentIdentifier"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          premis: "info:lc/xmlns/premis-v2"
        checked_on: "2026-10-05"
      -
        id: "sip-premis-agent-identifier-event"
        title:
          cs: "Identifikátor původce události — EVT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:linkingAgentIdentifier xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:linkingAgentIdentifierType>NK_AgentID</premis:linkingAgentIdentifierType>
            <premis:linkingAgentIdentifierValue>Kakadu-mastercopy</premis:linkingAgentIdentifierValue>
            <premis:linkingAgentRole>software</premis:linkingAgentRole>
          </premis:linkingAgentIdentifier>
        note:
          cs: "Odkaz z EVT_004 používá NK_AgentID / Kakadu-mastercopy; stejnou dvojici má AGENT_004. XML ID obalu není cílovou hodnotou tohoto odkazu. Výřez vedlejšího METS první stránky je zachován beze změny hodnot. Nejde o potvrzení validity celého SIP ani o nezávislé ověření chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
