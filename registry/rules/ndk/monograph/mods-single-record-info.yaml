schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-RECORD-INFO
title:
  cs: "Údaje o katalogovém záznamu jednosvazkové monografie"
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-RECORD-INFO
    relation_to_target:
      type: restricts
    category: metadata/mods-record-info
    cataloguing_rules: [aacr2, rda]
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-11-03
      note:
        cs: "Společný předpis správy bibliografického záznamu podle tabulky s. 58–59 a legendy s. 24. DescriptionStandard zachovává vlastní větve AACR2/RDA; ostatní řádky nejsou katalogizačně odlišeny. Nejde o technická data digitalizace ani tvrzení, že každý MODS údaj závisí na katalogizačním režimu."
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: 58
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — recordInfo"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "MODS svazku jednosvazkové monografie musí obsahovat recordInfo s údaji o vzniku a změnách metadatového záznamu."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: null
      validations:
        - type: custom
          expression: "Kontrolovat přímé mods:recordInfo v MODS svazku; nedostačuje recordInfo v relatedItem nebo v jiném dmdSec."
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_record
    source:
      document: DMF Monografie
      version: "2.3"
      page: 58
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — recordInfo"
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: "modsGroup; recordInfoDefinition; recordIdentifierDefinition; dateDefinition; languageDefinition; languageTermDefinition; authorityAttributeGroup"
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: "recordInfo a jeho potomci"
        url: https://www.loc.gov/standards/mods/userguide/recordinfo.html
    verification:
      status: verified
      date: 2026-11-03
      reference: "Vizuálně ověřena tabulka DMF 2.3 s. 58–59 včetně pokračování recordContentSource a legenda s. 24. Ověřeny deklarace MODS XSD 3.8 a význam v LOC recordInfo. Jde o ověřený přepis, nikoli validaci celého SIP nebo nástrojů."
    interpretation:
      cs: "Jde o správu bibliografického záznamu. Data jeho historie nenahrazují datum vydání, skenování ani ochranné události PREMIS. Rozsah je přímé recordInfo MODS svazku jednosvazkové monografie v hlavním METS; nikoli relatedItem, titul vícesvazku, příloha, kapitola ani stránka. Kardinalita se vztahuje k určenému rodiči; opakovatelnost elementů ponechává MODS XSD 3.8, tabulka zde nevyhlašuje neopakovatelnost. Custom kontroly jsou deklarativní a registr je nevykonává."
    examples:
      - id: sample-mono-record-info
        title:
          cs: "Údaje o katalogovém záznamu jednosvazkové monografie — výřez vzorového SIP"
        language: xml
        kind: source_excerpt
        code: |
          <mods:recordInfo xmlns:mods="http://www.loc.gov/mods/v3">
            <mods:descriptionStandard>aacr</mods:descriptionStandard>
            <mods:recordContentSource authority="siglaADR">ABA001</mods:recordContentSource>
            <mods:recordCreationDate encoding="iso8601">2010-10-05T00:00:00Z</mods:recordCreationDate>
            <mods:recordChangeDate encoding="iso8601">2010-12-02T10:35:03Z</mods:recordChangeDate>
            <mods:recordIdentifier source="CZ-PrNK">nkc20102129761</mods:recordIdentifier>
            <mods:recordOrigin>machine generated</mods:recordOrigin>
            <mods:languageOfCataloging>
              <mods:languageTerm authority="iso639-2b" type="code">cze</mods:languageTerm>
            </mods:languageOfCataloging>
          </mods:recordInfo>
        note:
          cs: "Původní výřez MODSMD_VOLUME_0001 ze svazku (genre=volume, issuance=single unit), MODS 3.8, descriptionStandard=aacr; info deklaruje DMF 2.3. Hodnoty jsou zachovány. Původní MARC a skutečná historie záznamu nejsou ověřeny: nelze potvrdit mapování, správnost časů či kódů ani větev RDA. Sekundy, Z, cze a konkrétní institucionální kódy vzoru nejsou novými univerzálními požadavky."
        source:
          document: Vzorový SIP 75faba8d-c629-11f0-8950-12e8557df20e
          version: DMF Monografie 2.3 (deklarováno v info.xml)
          page: null
          section: Hlavní METS — MODS svazku, recordInfo
          url: https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download
        file_path: mets_75faba8d-c629-11f0-8950-12e8557df20e.xml
        file_sha256: 7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:recordInfo"
        namespaces:
          mets: http://www.loc.gov/METS/
          mods: http://www.loc.gov/mods/v3
        checked_on: 2026-11-03
relations:
  - type: related_to
    target: NDK-MONO-METS-DMD-MODS-VERSION
