schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-LANGUAGE-OBJECT-PART"
title:
  cs: "Část svazku, k níž se jazyk vztahuje"
description:
  cs: "Jazykové údaje MODS svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  - version: "2.3"
    status: "normative"
    target:
      entity: "MODS-LANGUAGE-OBJECT-PART"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-language"
    cataloguing_rules: ["aacr2", "rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-08"
      note:
        cs: "Jazykové údaje na s. 54 nejsou červeně odlišeny; podle legendy s. 24 jde o společný bibliografický předpis AACR2/RDA. Použití řízených kódů z něj nedělá technicky nezávislou kontrolu."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 54
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — language, objectPart a languageTerm"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values: ["monograph"]
    normative_requirement:
      cs: "Atribut language/@objectPart má povinnost MA. DMF uvádí summary pro MARC 041$b, table of contents pro 041$f, accompanying material pro 041$g a translation pro 041$h."
    requirement:
      presence: "conditional"
      cardinality:
        min: 0
        max: 1
      allowed_values: ["summary","table of contents","accompanying material","translation"]
      validations:
        - type: "custom"
          expression: "U přímého language svazku požadovat objectPart, je-li dostupný údaj určující příslušnou část či původní jazyk podle mapování DMF. Dostupnost zjišťovat ze zdrojového popisu nebo předlohy, nikoli z přítomnosti kontrolovaného atributu. Neznámá dostupnost není prokázaná nedostupnost. Nepožadovat všechny čtyři hodnoty ani atribut u každého jazyka hlavního obsahu. Zachovat vazby summary → 041$b, table of contents → 041$f, accompanying material → 041$g, translation → 041$h; poslední podpole je jazyk originálu, nikoli jazyk přeloženého textu v 041$a."
    condition:
      all:
        - field: "object_type"
          operator: "equals"
          value: "monograph"
        - field: "document_role"
          operator: "equals"
          value: "main_mets"
        - field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        - field: "element_role"
          operator: "equals"
          value: "mods_language"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 54
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — language, objectPart a languageTerm"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; languageDefinition; languageTermDefinition; codeOrText; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines"
        version: "3"
        page: null
        section: "language — objectPart; languageTerm; opakování jazyků a jejich reprezentací"
        url: "https://www.loc.gov/standards/mods/userguide/language.html"
      -
        document: "MARC 21 Bibliographic — 041 Language Code"
        version: "online, ověřeno 2026-10-08"
        page: null
        section: "008/35–37 a 041$a, $b, $f, $g, $h"
        url: "https://www.loc.gov/marc/bibliographic/bd041.html"
    verification:
      status: "verified"
      date: "2026-10-08"
      reference: "Přepis vizuálně ověřen proti DMF 2.3 s. 54 a legendě s. 24; rozsah a typy proti MODS XSD 3.8. Sémantika ověřena v citovaných pramenech LOC. Nejde o test implementací ani ověření celého SIP."
    interpretation:
      cs: "Kardinalita 0..1 znamená nejvýše jeden atribut na language; podmíněná přítomnost vyplývá z MA, nikoli z dobrovolnosti údaje. Čtyři hodnoty jsou národním výčtem, XSD připouští volný řetězec. Hodnotu translation nepřejmenováváme na original; vykládáme ji podle výslovné vazby na 041$h. Neznalost části není důvod doplnit smyšlenou hodnotu. Rozsah tvoří přímé language MODS svazku jednosvazkové monografie a jeho děti, nikoli recordInfo/languageOfCataloging, relatedItem, titul vícesvazku, vnitřní část, příloha nebo stránka. Kontext a dostupnost zdrojových údajů se zjišťují nezávisle na kontrolovaném XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    discrepancies:
      - cs: "Označení translation může evokovat jazyk překladu, avšak DMF je výslovně mapuje na 041$h. MARC definuje $h jako jazyk originálu a jazyk přeloženého textu zapisuje do $a. Registr zachovává doslovnou hodnotu DMF a upozorňuje na její význam; nejde o opravu názvu ve zdroji."
relations:
  - type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-LANGUAGE"
