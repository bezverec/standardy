schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-COPYRIGHT-DATE-RDA-SOURCE"
title:
  cs: "RDA: copyrightDate jen při doloženém 264_4$c"
description:
  cs: "Doplňující údaje o vzniku a vydávání předlohy v MODS svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-COPYRIGHT-DATE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-origin-completion"
    cataloguing_rules:
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Dodatečné omezení je na s. 53 výslovně vztaženo k RDA, s červeným označením režimu a pole 264_4$c. Nerozšiřuje se na AACR2 ani na obecné MODS."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 53
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — copyrightDate, dateCreated, edition a issuance (pokračování s. 54)"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "forbidden"
    obligation_source: "prose"
    non_use:
      basis: "explicit"
      note:
        cs: "Výslovné omezení použití copyrightDate v RDA podle DMF; nikoli zákaz v obecném MODS."
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "V RDA záznamu se copyrightDate nepoužije, pokud zdrojový katalogizační záznam neobsahuje 264 s druhým indikátorem 4 a podpole c."
    requirement:
      presence: "forbidden"
      cardinality:
        min: 0
        max: 0
      validations:
        -
          type: "custom"
          expression: "Při nezávisle doložené absenci 264_4$c v RDA záznamu požadovat nulový počet copyrightDate ve zkoumaných originInfo, včetně prázdných elementů. Neznámá dostupnost původního MARC není doloženou absencí. Je-li současně 008/06=t, zaznamenat kolizi s pokynem k převzetí 008/11–14 a vyžádat posouzení zdrojového záznamu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
        -
          field: "cataloguing_rules"
          operator: "equals"
          value: "rda"
        -
          field: "copyright_264_4_c_present"
          operator: "equals"
          value: false
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 53
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — copyrightDate, dateCreated, edition a issuance (pokračování s. 54)"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "originInfoDefinition; dateDefinition; edition; issuanceDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MARC 21 Bibliographic — 264"
        version: "July 2022"
        page: null
        section: "Second Indicator; $c"
        url: "https://www.loc.gov/marc/bibliographic/bd264.html"
    verification:
      status: "verified"
      date: "2026-10-07"
      reference: "Přepis ověřen vizuálně proti DMF 2.3 s. 53–54 a legendě s. 24, deklaracím MODS XSD 3.8 a citovaným významům polí MARC. Ověření přepisu neřeší nejasnosti DMF; původní MARC ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "Jde o nepoužití v konkrétním kontextu DMF, nikoli obecný zákaz copyrightDate v MODS. Není doplněn domyšlený kód M/MA. Existence 264_4$c sama neprokazuje katalogizační režim; ten musí být určen nezávisle. Přítomnost 264_4$c neobrací doporučení R na povinnost M. Podmínka copyright_264_4_c_present=false se zjišťuje ze zdrojového MARC, ne z chybějícího copyrightDate. Rozsah tvoří přímá originInfo MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, subject, stránka nebo titul vícesvazku. Kontext a zdrojové údaje se zjišťují nezávisle z katalogu či předlohy, nikoli z přítomnosti kontrolovaného XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-COPYRIGHT-DATE"
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-ORIGIN-COPYRIGHT-NO-ROLE"
