schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-EVENT-LINKING-AGENT"
title:
  cs: "Vazba události na původce"
description:
  cs: "Události digitalizace podle DMF Monografie 2.3; oddělení obecných možností PREMIS 2.2, povinností NDK a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-EVENT-LINKING-AGENT"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-events"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Událost obsahuje alespoň jednu identifikaci agenta spojeného s provedenou činností."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V každém event požadovat alespoň jeden linkingAgentIdentifier s typem a hodnotou. Je-li dostupný odpovídající PREMIS Agent, propojit jej pomocí celé dvojice agentIdentifierType a agentIdentifierValue, nikoli pouze podle zobrazovaného jména."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 80
      section: "7.5.2 PREMIS Event — linkingAgentIdentifier"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "eventComplexType/linkingAgentIdentifier (0–n); linkingAgentIdentifierComplexType"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: obecná kardinalita a povinnosti DMF; povinné děti doporučeného rodiče"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 81
        section: "7.5.3 PREMIS Agent — rozsah popisu agenta v digitalizačním SIP"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 79–81 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a otiskem souboru; externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "DMF § 7.5.2 uvádí povinnou vazbu na PREMIS Agent. § 7.5.3 zároveň vysvětluje, že další upřesnění v PREMIS Agent není pro digitalizační SIP nutné. Povinnou identifikaci původce proto neztotožňujeme s bezvýjimečnou povinností úplného záznamu Agent v každém SIP. Ve vzoru je cíl dostupný; obecné XSD vazbu dovoluje vynechat. Kardinalita dítěte se vyhodnocuje v každém bezprostředním rodiči cesty event/linkingAgentIdentifier. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-event-linking-agent"
        title:
          cs: "Vazba události na původce — EVT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:linkingAgentIdentifier xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:linkingAgentIdentifierType>NK_AgentID</premis:linkingAgentIdentifierType>
            <premis:linkingAgentIdentifierValue>Kakadu-mastercopy</premis:linkingAgentIdentifierValue>
            <premis:linkingAgentRole>software</premis:linkingAgentRole>
          </premis:linkingAgentIdentifier>
        note:
          cs: "Výřez vedlejšího METS první stránky, zachovaný beze změny hodnot. Nejde o potvrzení validity celého SIP ani o důkaz chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
