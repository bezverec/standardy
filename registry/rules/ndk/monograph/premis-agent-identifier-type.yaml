schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-AGENT-IDENTIFIER-TYPE"
title:
  cs: "Typ identifikátoru původce"
description:
  cs: "Původci událostí podle DMF Monografie 2.3; rozlišení kontextu SIP/AIP, obecných možností PREMIS 2.2 a obsahu vzorového SIP."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-AGENT-IDENTIFIER-TYPE"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-agents"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na ochranná metadata souborů, událostí nebo jejich původců. Nejde o bibliografické vztahy děl a tvůrců podle AACR2/RDA."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 81
          section: "7.5.3 PREMIS Agent — agentIdentifier/agentIdentifierType"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý identifikátor agenta obsahuje právě jeden typ identifikátoru."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V každém agentIdentifier požadovat jeden agentIdentifierType označující identifikační systém. Při propojení s Event jej porovnat s linkingAgentIdentifierType."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "metadata_record_type"
          operator: "equals"
          value: "premis_agent"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 81
      section: "7.5.3 PREMIS Agent — agentIdentifier/agentIdentifierType"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "agentIdentifierComplexType/agentIdentifierType (1–1); xs:string"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 81
        section: "7.5.3 PREMIS Agent — úvod, rozsah SIP/AIP a umístění záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 75
        section: "Legenda: povinnosti a obecné četnosti"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 81–82 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a SHA-256; příkaz z agentNote ani externí validátor nebyly spuštěny."
    interpretation:
      cs: "NK_AgentID a UUID jsou příklady, nikoli uzavřený číselník. agentIdentifierType se nesmí zaměňovat s agentType: první určuje systém identifikace, druhý obecný druh původce. metadata_record_type=premis_agent znamená právě vybraný existující element agent v namespace info:lc/xmlns/premis-v2. Pravidla dětí se uplatní i v dobrovolně přidaném Agent v SIP; nepodmiňují se existencí kontrolovaného dítěte. Kardinalita je vztažena ke každému bezprostřednímu rodiči cesty agent/agentIdentifier/agentIdentifierType. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-agent-identifier-type"
        title:
          cs: "Typ identifikátoru původce — AGENT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:agentIdentifierType xmlns:premis="info:lc/xmlns/premis-v2">NK_AgentID</premis:agentIdentifierType>
        note:
          cs: "Výřez vedlejšího METS první stránky je zachován beze změny hodnot. Nejde o potvrzení validity celého SIP ani o nezávislé ověření chování nástroje."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:digiprovMD[@ID='AGENT_004']/mets:mdWrap/mets:xmlData/premis:agent/premis:agentIdentifier/premis:agentIdentifierType"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          premis: "info:lc/xmlns/premis-v2"
        checked_on: "2026-10-05"
