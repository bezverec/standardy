schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-IMAGE-HEIGHT
title:
  cs: "Výška obrazu v pixelech"
description:
  cs: "imageHeight v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-IMAGE-HEIGHT
    relation_to_target:
      type: restricts
    category: technical/dimensions
    comparison:
      key: "mix.mc-ps.image-height"
      note:
        cs: "Ručně ověřená dvojice MIX-IMAGE-HEIGHT pro MIX souborů MC/PS: DMF Monografie 2.3 § 7.5.4 s. 83 a DMF Periodika 2.2 § 7.5.4 s. 70. Shodují se evidované technické požadavky, povinnost a podmínka MC/PS; liší se rozsah monograph/periodical. Shoda této položky není ekvivalence celých DMF, potvrzení validity souboru ani důkaz chování nástrojů."
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na technická obrazová metadata souboru MC/PS. Neřeší bibliografický popis nosiče ani katalogizační obsah."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 83
          section: "7.5.4 Technická metadata MIX — imageHeight"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS se vyžaduje imageHeight s výškou obrazu v pixelech."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      validations:
        - type: xpath
          expression: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:imageHeight"
          assertion: exists
        - type: regex
          expression: "^[ \\t\\r\\n]*\\+?0*[1-9][0-9]*[ \\t\\r\\n]*$"
          assertion: matches
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 83
      section: "7.5.4 Technická metadata MIX — imageHeight"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:imageHeight; positiveIntegerType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    examples:
      - id: "sip-75faba8d-mix-image-height"
        title:
          cs: "Výška obrazu MC"
        language: xml
        kind: source_excerpt
        code: |-
          <mix:imageHeight xmlns:mix="http://www.loc.gov/mix/v20">2262</mix:imageHeight>
        note:
          cs: "MC, blok MIX_003 s identifikátorem MC_1_00010003_2R. 2262 je výška konkrétního MC v pixelech; nejde o rozlišení v PPI."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='MIX_003']/mets:mdWrap/mets:xmlData/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:imageHeight"
        namespaces: {"mets":"http://www.loc.gov/METS/","mix":"http://www.loc.gov/mix/v20"}
        checked_on: "2026-10-05"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost M, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 83; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "Hodnota popisuje vertikální rozměr konkrétního obrazového souboru. Typ MIX 2.0 je xsd:positiveInteger. Otočení nebo ořez obrazu může vyžadovat nové získání této hodnoty."
