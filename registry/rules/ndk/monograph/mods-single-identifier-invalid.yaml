schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-IDENTIFIER-INVALID
title:
  cs: "Označení neplatného nebo zrušeného identifikátoru"
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-IDENTIFIER-INVALID
    relation_to_target:
      type: restricts
    category: metadata/mods-identifiers
    cataloguing_rules: [aacr2, rda]
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-11-04
      note:
        cs: "Společný bibliografický předpis pro identifikátory popisovaného svazku podle tabulky s. 57–58 a legendy s. 24. Toto posouzení se nepřenáší na generování UUID a URN:NBN, které mají vlastní nezávislá pravidla."
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: 57
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — identifier"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnosti a barevné kódování AACR2/RDA"
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: mandatory
    obligation_source: prose
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Neplatné či zrušené identifikátory se v MODS zaznamenávají s atributem invalid=\"yes\"."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      allowed_values: ["yes"]
      validations:
        - type: custom
          expression: "Je-li zdrojový identifikátor neplatný nebo zrušený, na odpovídajícím mods:identifier požadovat invalid='yes'. Stav určit z nezávislého zdroje včetně významu MARC $z, nikoli existencí cílového atributu. Chybějící invalid nesmí vypnout vlastní kontrolu. Samotná neplatnost identifikátoru není důvod záznam odstranit."
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_identifier
        - field: identifier_invalid_or_cancelled
          operator: equals
          value: true
    source:
      document: DMF Monografie
      version: "2.3"
      page: 57
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — identifier"
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: DMF Monografie
        version: "2.3"
        page: "9–10"
        section: "4 Identifikátory — přidělení UUID a URN:NBN, úroveň svazku, neplatné hodnoty a Dublin Core"
        url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: "modsGroup; identifierDefinition; yes"
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: "identifier; type; invalid"
        url: https://www.loc.gov/standards/mods/userguide/identifier.html
    verification:
      status: verified
      date: 2026-11-04
      reference: "Vizuálně ověřena tabulka DMF 2.3 s. 57 a pokračování s. 58, kapitola 4 s. 9–10 a legenda s. 24. Ověřeny deklarace MODS XSD 3.8 a význam identifier v LOC. Ověření přepisu neprokazuje platnost či přidělení konkrétních identifikátorů."
    interpretation:
      cs: "Jde o slovní požadavek v řádku identifier; samostatný kód M pro invalid se nevymýšlí. Obecné MODS dovoluje pro atribut pouze yes, nikoli no/false. Kapitola 4, s. 10 navíc nepovoluje převod neplatných identifikátorů do Dublin Core, protože zde nelze odlišit jejich platnost; samostatná mezi-formátová kontrola DC není součástí této sady. Rozsah: přímé identifier v MODS svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem, titul vícesvazku, kapitola, příloha nebo stránka. U pravidla konkrétního typu se kardinalita vztahuje pouze na odpovídající podmnožinu identifier; u atributu na každý příslušný rodičovský element. Horní mez počtu elementů se bez opory ve zdroji neomezuje. Dostupnost a platnost se zjišťují ze zdroje, ne z absence cílového XML; neznámý kontext není false. Custom kontroly jsou deklarativní, registr je nad SIP nespouští."
relations:
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-IDENTIFIER
