schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PARTS-NO-ALTO-POINTERS"
title:
  cs: "Logická mapa bez blokových odkazů"
description:
  cs: "Vnitřní logické členění monografií podle DMF 2.3: kapitoly, obrazy, volitelné logické stránky a vazby na fyzické strany; bez implementace blokových odkazů ALTO."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-STRUCTMAP"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-internal-parts"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 98
          section: "7.7.1.2.2 Vyjádření logické struktury pro kapitoly bez vazby na ALTO bloky"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Ve variantě vnitřního popisu pouze s vazbami na strany neobsahuje logická mapa elementy fptr ani area."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Vyhledat logickou mapu a ve všech jejích potomcích ověřit nepřítomnost mets:fptr i mets:area. Kontrolu neaplikovat na fyzickou mapu, fileSec ani vedlejší METS. Vazby na stránky se vyjadřují pomocí structLink."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "equals"
          value: "internal_parts_pages"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 98
      section: "7.7.1.2.2 Vyjádření logické struktury pro kapitoly bez vazby na ALTO bloky"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "structMapType; divType; ORDERLABELS; structLinkType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: 4
        section: "1.3 Dohoda mezi dodavatelem dat a zadavatelem — granularita záznamů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Přepis porovnán s DMF 2.3, s. 4, 93–99, včetně vizuální kontroly tabulek a s deklaracemi METS XSD 1.9.1. U TYPE je ověřena existence rozporu, nikoli jedna závazná hodnota. Externí validátor nebyl spuštěn."
    interpretation:
      cs: "Požadavek omezuje obsah mapy; neoznačuje celou structMap jako zakázanou. Nezakazuje soubory ALTO ani povinné fyzické fptr. Nevztahuje se na variantu internal_parts_alto, kde jsou blokové odkazy zamýšlené. Rozsah vnitřního popisu vychází ze zadání projektu (§ 1.3), nikoli z pouhé existence nebo absence uzlů. Strukturální role vyjadřuje význam uzlu, ne shodu jeho kontrolovaného TYPE či prefixu ID. Custom kontroly registr nevykonává. Vzorový SIP bez kapitol tuto variantu nedokládá; implementace nástrojů nebyly ověřeny."
relations:
