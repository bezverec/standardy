schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-ABSTRACT"
title:
  cs: "Shrnutí obsahu jednosvazkové monografie"
description:
  cs: "Shrnutí obsahu a obecné poznámky v MODS jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-ABSTRACT"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-notes"
    cataloguing_rules:
      - "aacr2"
      - "rda"
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-08"
      note:
        cs: "Černé, nerozlišené řádky abstract, note a note/@type na s. 55 jsou podle legendy s. 24 společným bibliografickým předpisem AACR2/RDA, nikoli katalogizačně nezávislou technickou vrstvou."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 55
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — abstract, note a note/@type"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Abstract je doporučené shrnutí obsahu monografie jako celku, odpovídající MARC 520."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit abstract přímo pod mods svazku pro shrnutí obsahu odpovídající MARC 520. Absence abstract není porušením povinné přítomnosti. Shrnutí nesměšovat s obecnou poznámkou, údajem o fyzickém stavu ani samotným výčtem kapitol. Obsah neposuzovat jen podle existence či délky řetězce; při neznámém zdroji nic nedoplňovat automaticky."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 55
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — abstract, note a note/@type"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; abstractDefinition; noteDefinition"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines"
        version: "3"
        page: null
        section: "Top-level abstract — Guidelines for Use"
        url: "https://www.loc.gov/standards/mods/userguide/abstract.html"
    verification:
      status: "verified"
      date: "2026-10-08"
      reference: "Vizuálně ověřeny řádky a kódy R/RA/O v DMF 2.3 s. 55, hlavička jednosvazkové monografie a legenda s. 24. Typy a opakovatelnost ověřeny v MODS XSD 3.8; doplňující význam podle uvedených LOC Guidelines. Ověření přepisu není kontrola SIP ani nástrojů."
    interpretation:
      cs: "R se zachovává jako doporučení, nikoli RA či M. Kardinalita 0..n vychází z opakovatelné volby MODS 3.8, ne z domyšleného max=1. DMF mapuje abstract na dc:description; tato sada netvoří samostatné pravidlo DC. Ve vzorovém záznamu abstract není, proto není zdrojová ukázka. Rozsah je přímý MODS záznam svazku jednosvazkové monografie v hlavním METS, nikoli relatedItem, physicalDescription, recordInfo, titul vícesvazku, příloha nebo stránka. Kontext se určuje nezávisle na přítomnosti kontrolovaného elementu; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů ani původní MARC nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-NOTE"
