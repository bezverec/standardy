schema_version: "1.0"
kind: rule
id: NDK-MONO-MIX-COLOR-SPACE
title:
  cs: "Barevný prostor obrazu"
description:
  cs: "colorSpace v technických metadatech MIX pro DMF Monografie 2.3."
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MIX-COLOR-SPACE
    relation_to_target:
      type: restricts
    category: technical/color
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na technická obrazová metadata souboru MC/PS. Neřeší bibliografický popis nosiče ani katalogizační obsah."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 83
          section: "7.5.4 Technická metadata MIX — colorSpace"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: mandatory
    obligation_code: M
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values: [monograph]
    normative_requirement:
      cs: "Pro MC a PS DMF 2.3 vyžaduje colorSpace s označením barevného prostoru."
    requirement:
      presence: required
      cardinality:
        min: 1
        max: 1
      validations:
        - type: xpath
          expression: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:PhotometricInterpretation/mix:colorSpace"
          assertion: exists
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: file_role
          operator: in
          value: [MC, PS]
    source:
      document: DMF Monografie
      version: "2.3"
      page: 83
      section: "7.5.4 Technická metadata MIX — colorSpace"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      - document: NISO Metadata for Images in XML (MIX), XML Schema 2.0
        version: "2.0"
        page: null
        section: "/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:PhotometricInterpretation/mix:colorSpace; stringType"
        url: "https://www.loc.gov/standards/mix/mix20/mix20.xsd"
    examples:
      - id: "sip-75faba8d-mix-color-space"
        title:
          cs: "Barevný prostor MC"
        language: xml
        kind: source_excerpt
        code: |-
          <mix:PhotometricInterpretation xmlns:mix="http://www.loc.gov/mix/v20">
            <mix:colorSpace>RGB</mix:colorSpace>
          </mix:PhotometricInterpretation>
        note:
          cs: "MC, blok MIX_003 s identifikátorem MC_1_00010003_2R. RGB je barevný prostor uvedený v MIX záznamu MC. Výřez nedokládá přítomnost ani verzi ICC profilu."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "amdsec/amd_mets_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml"
        file_sha256: "4a8d9098cb15b621a0dee3fd5501a3eee2b107088dc728dcace2a36f1e2b583f"
        source_xpath: "/mets:mets/mets:amdSec/mets:techMD[@ID='MIX_003']/mets:mdWrap/mets:xmlData/mix:mix/mix:BasicImageInformation/mix:BasicImageCharacteristics/mix:PhotometricInterpretation"
        namespaces: {"mets":"http://www.loc.gov/METS/","mix":"http://www.loc.gov/mix/v20"}
        checked_on: "2026-10-05"
    verification:
      status: verified
      date: "2026-10-05"
      reference: "Povinnost M, rozsah MC/PS a význam ověřeny v tabulce DMF 2.3 na s. 83; umístění, typ a opakovatelnost porovnány s oficiálním MIX 2.0 XSD. Jde o ověření přepisu, chování konkrétních nástrojů zde ověřeno nebylo."
    interpretation:
      cs: "MIX 2.0 zde používá řetězec. Příklad RGB v tabulce neurčuje úplný slovník ani sám o sobě zákaz jiných hodnot. Barevný prostor a jméno konkrétního ICC profilu jsou odlišné údaje."
relations:
