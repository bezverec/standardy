    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 79–81 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Výřezy první stránky dodaného SIP ověřeny XPath a otiskem souboru; externí validátor ani implementace nástrojů nebyly testovány."
    interpretation:
      cs: "Tabulka výslovně uvádí R. Úvodní obecný požadavek zachytit výsledek události nepřepisujeme na kód M pro tento doporučený kontejner. Chybějící blok není porušením povinnosti M jeho dítěte. Kardinalita dítěte se vyhodnocuje v každém bezprostředním rodiči cesty event/eventOutcomeInformation. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci."
    examples:
      -
        id: "sip-premis-event-outcome-information"
        title:
          cs: "Informace o výsledku události — EVT_004"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <premis:eventOutcomeInformation xmlns:premis="info:lc/xmlns/premis-v2">
            <premis:eventOutcome>OK</premis:eventOutcome>
          </premis:eventOutcomeInformation>
        note:
          cs: "Výřez vedlejšího METS první stránky, zachovaný beze změny hodnot. OK je zdrojová hodnota; její příslušnost ke konkrétnímu číselníku nebyla ověřena. Nejde o potvrzení validity celého SIP ani o důkaz chování nástroje."
