        - "monograph"
    normative_requirement:
      cs: "Doporučuje se zaznamenat informace o výsledku události; blok může být opakován."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        -
          type: "custom"
          expression: "Doporučit eventOutcomeInformation u události. Pokud je blok přítomen, požadovat v každém jeho výskytu eventOutcome podle navazujícího pravidla."
