schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-GENRE-STRUCTURAL"
title:
  cs: "Povinný strukturální typ jednosvazkového dokumentu"
description:
  cs: "Typ předlohy, povinný strukturální typ a doporučený bibliografický žánr svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-GENRE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-resource-genre"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturální model NDK podle druhu předlohy, nikoli bibliografický žánr nebo katalogizační popis. Barevné rozlišení zde označuje druh dokumentu, ne AACR2/RDA."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 51
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — typeOfResource a genre"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Záznam obsahuje strukturální genre podle druhu předlohy: volume pro textové monografie, cartographic pro kartografické dokumenty, graphic pro grafické dokumenty nebo sheetmusic pro hudebniny."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      allowed_values:
        - "volume"
        - "cartographic"
        - "graphic"
        - "sheetmusic"
      validations:
        -
          type: "custom"
          expression: "Požadovat alespoň jeden přímý genre se strukturální hodnotou podle nezávisle určeného druhu předlohy: textová monografie → volume; kartografický dokument → cartographic; grafický dokument → graphic; hudebnina → sheetmusic. Biografický či jiný popisný žánr povinný strukturální typ nenahrazuje. Číselník a kardinalita se vztahují pouze na strukturální podmnožinu genre; další bibliografické genre se jím neposuzují."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_record"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 51
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — typeOfResource a genre"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; modsGroup; typeOfResourceDefinition; genreDefinition; stringPlusLanguagePlusAuthority; authorityAttributeGroup"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Požadavky porovnány s textem i vykreslenými tabulkami s. 50–51 DMF 2.3 a deklaracemi MODS XSD 3.8. Ukázky vybrány z přímých polí MODS svazku a ukotveny XPath a SHA-256; nejde o ověření původního MARC, autoritního slovníku ani celého SIP."
    interpretation:
      cs: "Stejný element genre má v DMF dva samostatné významy a rozdílné povinnosti. Neurčovat strukturální roli jen pořadím, chybějící authority nebo tím, že hodnota již prošla kontrolou. Výskyt biografie nesmí vypnout kontrolu chybějícího volume. Hodnoty v MODS nemají prefix model:. Sloupec DC uvádí pro tyto čtyři druhy model:monograph, model:map, model:graphic a model:sheetmusic; nejde o mechanické přidání prefixu k MODS hodnotě. Tato sada nekontroluje samostatně obsah DC a neodvozuje zákaz authority pro strukturální genre z jeho absence ve vzoru. Kontext monograph označuje DMF Monografie, nikoli automaticky textovou knihu. Druh předlohy a úroveň popisu se určují nezávisle ze zdroje, ne podle právě kontrolované hodnoty; neznámý druh není potvrzení správnosti ani důvod tiše přeskočit požadavek. Pravidlo se týká přímých polí MODS záznamu svazku jednosvazkové monografie, ne relatedItem, subject, stránky či titulu vícesvazku. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      -
        id: "sip-mods-resource-genre-structural-structural"
        title:
          cs: "Strukturální genre volume"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:genre xmlns:mods=\"http://www.loc.gov/mods/v3\">volume</mods:genre>"
        note:
          cs: "Přesný výřez přímého pole MODS svazku dodaného SIP. Nejde o univerzální šablonu, ověření původního MARC, autoritního přiřazení ani platnosti celého balíčku."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, typ zdroje a žánry"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:genre[3]"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-06"
