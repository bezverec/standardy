    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "DMF 2.3, s. 93 a vizuálně ověřené s. 95–98; deklarace METS 1.9.1 a ALTO 2.0/4.4 porovnány. Ukázky mají XPath a SHA-256. Ověřen přepis požadavků a původ výřezů, nikoli validita celého SIP nebo implementace nástrojů."
    interpretation:
      cs: "Platí například pro nadpis, podnadpis, autora, překladatele, běžný text, poznámku či textové části obrazu. Rozhoduje rozšířené XML jméno (namespace a lokální název), ne konkrétní prefix. DMF 2.3 odkazuje na ALTO 2.0 a 4.4; namespace rozlišuje hlavní verzi, sám nepotvrzuje minor verzi. Platí pouze pro zvolený režim internal_parts_alto. Role bloku vychází z významu popisovaného obsahu, nikoli z existence kontrolovaného odkazu nebo správně vyplněného TYPE. Nevyžaduje se výskyt všech druhů bloků v každé knize; pravidlo řeší vazbu již popisovaného bloku. Kódy povinnosti uzlů v tabulce se nekopírují k těmto vazebním požadavkům. Custom kontroly registr nevykonává; externí validátor ani implementace nástrojů nebyly ověřeny."
