schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-ALTO-TEXT-BLOCK"
title:
  cs: "Cíl textové vazby: TextBlock"
description:
  cs: "Blokové vazby logické struktury METS do souborů ALTO podle DMF Monografie 2.3, oddělené od fyzických odkazů na celé soubory a od výčtů stran."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-AREA-BEGIN"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-alto-links"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Odkaz textového bloku míří na odpovídající TextBlock v ALTO."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "V souboru zvoleném přes FILEID vyhledat podle BEGIN TextBlock ve správném namespace ALTO. Page, TextLine, String ani textový blok z jiného souboru nejsou náhradou. Ověřit, že obsah odpovídá textové části popisované logickým div."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "logical_description_mode"
          operator: "equals"
          value: "internal_parts_alto"
        -
          field: "structmap_type"
          operator: "equals"
          value: "LOGICAL"
        -
          field: "logical_content_role"
          operator: "equals"
          value: "text_block"
        -
          field: "element_role"
          operator: "equals"
          value: "alto_block_area"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: "93, 95–98"
      section: "7.7.1.2.1 Logická struktura s vazbou na ALTO bloky"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType/fptr; areaType"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "ALTO XML Schema"
        version: "2.0"
        page: null
        section: "TextBlock; ComposedBlock; BlockType/@ID"
        url: "https://www.loc.gov/standards/alto/v2/alto-2-0.xsd"
      -
        document: "ALTO XML Schema"
        version: "4.4"
        page: null
        section: "TextBlock; ComposedBlock; BlockType/@ID"
        url: "https://www.loc.gov/standards/alto/v4/alto-4-4.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "4–5"
        section: "1.3 Granularita popisu; 1.4 Verze standardů"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    examples:
      -
        id: "sip-mets-alto-links-text-block-1"
        title:
          cs: "Záznam prvního souboru ALTO v METS"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:file CHECKSUM="a5cceecc68f28b235510803181545aab" CHECKSUMTYPE="MD5" CREATED="2026-06-25T09:09:42" ID="alto_0001" MIMETYPE="text/xml" SEQ="0" SIZE="5693" xmlns:mets="http://www.loc.gov/METS/">
            <mets:FLocat LOCTYPE="URL" xlink:href="alto/alto_75faba8d-c629-11f0-8950-12e8557df20e_0001.xml" xmlns:xlink="http://www.w3.org/1999/xlink" />
          </mets:file>
        note:
          cs: "Přesný výřez ukazuje pouze záznam souboru nebo existující textový blok. Zdrojový SIP nemá logické blokové odkazy: ukázka nedokládá existenci fptr/area ani správné přiřazení kapitoly. Není univerzální šablonou ani potvrzením validity."
