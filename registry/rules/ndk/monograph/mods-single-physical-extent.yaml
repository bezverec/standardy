schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-PHYSICAL-EXTENT"
title:
  cs: "Rozsah a rozměry předlohy monografie"
description:
  cs: "Fyzický popis předlohy v MODS svazku jednosvazkové monografie podle DMF 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  - version: "2.3"
    status: "normative"
    target:
      entity: "MODS-PHYSICAL-EXTENT"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-physical-description"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-08"
      note:
        cs: "Nerozlišený fyzický popis na s. 54–55 je podle legendy s. 24 společný bibliografický předpis AACR2/RDA. Samostatné červené doplňky 337/338 a type se na AACR2 nepřenášejí."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 55
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — physicalDescription a jeho děti (s. 54–55)"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended_if_available"
    obligation_code: "RA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values: ["monograph"]
    normative_requirement:
      cs: "Extent má povinnost RA a obsahuje rozsah či rozměry z MARC 300$a, $b a $c. Hodnoty podpolí jednoho převáděného pole se slučují do jednoho extent; pro různá pole se element opakuje."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: null
      validations:
        - type: "custom"
          expression: "Je-li zdrojový údaj dostupný, doporučit extent v přímém physicalDescription svazku. Při převodu sloučit 300$a, $b a $c z jednoho výskytu pole do jednoho extent, se zachováním významu a interpunkce. Různá pole 300 neslučovat do jedné hodnoty; odpovídají opakovaným extent. Nevyžadovat pouze číslo ani shodu s počtem obrazových souborů či stran v METS. Dostupnost neodvozovat z přítomnosti cílového XML."
    condition:
      all:
        - field: "object_type"
          operator: "equals"
          value: "monograph"
        - field: "document_role"
          operator: "equals"
          value: "main_mets"
        - field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        - field: "element_role"
          operator: "equals"
          value: "mods_physical_description"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 55
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — physicalDescription a jeho děti (s. 54–55)"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "modsDefinition; physicalDescriptionDefinition; formDefinition; authorityAttributeGroup; extent; physicalDescriptionNote"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
      -
        document: "MODS User Guidelines"
        version: "3"
        page: null
        section: "physicalDescription; form; extent; note"
        url: "https://www.loc.gov/standards/mods/userguide/physicaldescription.html"
      -
        document: "MARC 21 Bibliographic — 300 Physical Description"
        version: "July 2022"
        page: null
        section: "300$a, $b, $c a opakování pole"
        url: "https://www.loc.gov/marc/bibliographic/bd300.html"
    verification:
      status: "verified"
      date: "2026-10-08"
      reference: "Přepis ověřen vizuálně v DMF 2.3 s. 54–55 a legendě s. 24; deklarace a rodičovské typy v MODS XSD 3.8. Doplňující sémantika podle uvedených pramenů LOC. Nejde o ověření implementace nástrojů."
    interpretation:
      cs: "RA zůstává doporučením při dostupnosti, nepřevádí se zpětně na R ani M. Kardinalita 0..n je na physicalDescription. Zdejší extent má jednoduchý textový obsah; není to strukturované part/extent s dětmi start/end/total. DMF jmenuje $a, $b, $c, nikoli automatické převzetí všech podpolí 300. Rozsah může obsahovat více jednotek i rozměry a příklad 14 s. ; 16 cm není formátový vzor. DMF uvádí vazbu na dc:format; nevytváříme tím samostatné DC pravidlo. Rozsah tvoří fyzický popis v přímém MODS záznamu svazku jednosvazkové monografie, nikoli relatedItem, copyInformation, titul vícesvazku, příloha, vnitřní část nebo stránka. Kontext a katalogizační režim se zjišťují nezávisle na kontrolovaném XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
    examples:
      - id: "sip-mods-physical-extent"
        title:
          cs: "Textový rozsah předlohy ve vzorovém SIP"
        language: "xml"
        kind: "source_excerpt"
        code: "<mods:extent xmlns:mods=\"http://www.loc.gov/mods/v3\">14 s. ; 16 cm</mods:extent>"
        note:
          cs: "Zdrojový MODS svazku deklaruje descriptionStandard=aacr. Výřez zachovává původní hodnoty; nedokládá větev RDA, původní pole MARC ani úplnou validitu SIP. Tři form neznamenají povinný počet tří pro každý dokument. Text 14 s. ; 16 cm není počet digitálních obrazů. V přímém physicalDescription není note."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS — MODS svazku, physicalDescription"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:dmdSec[@ID=\"MODSMD_VOLUME_0001\"]/mets:mdWrap/mets:xmlData/mods:mods/mods:physicalDescription/mods:extent"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          mods: "http://www.loc.gov/mods/v3"
        checked_on: "2026-10-08"
relations:
