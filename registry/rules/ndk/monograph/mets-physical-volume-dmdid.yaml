    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami 92–93 DMF 2.3 a s XSD METS 1.9.1. Typy stran doplněny podle tabulky PPM 2.4, s. 14; paginace podle s. 4–7 a tabulky PAGE v DMF, s. 73. Vzor ověřen XPath a SHA-256; externí validátor ani nástrojové implementace nebyly testovány."
    interpretation:
      cs: "XSD dovoluje seznam IDREFS, ne pouze jeden textový identifikátor. Kardinalita 1–1 se týká atributu, nikoli počtu tokenů. Hodnota MODSMD_VOLUME_0001 ve vzoru odkazuje na dmdSec, nikoli přímo na mods:mods/@ID=MODS_VOLUME_0001. Toto pravidlo nevynucuje současný odkaz na MODS i DC. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Úrovně volume/page označují pozici div ve fyzické mapě, nikoli testovanou hodnotu TYPE; hlavní a vedlejší METS zůstávají oddělené. Custom kontroly registr nevykonává, jsou popisem pro budoucí implementaci."
