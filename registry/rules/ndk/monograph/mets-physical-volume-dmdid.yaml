schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-VOLUME-DMDID"
title:
  cs: "Vazba fyzického svazku na popisná metadata"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-DMDID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "DMDID rodičovského div odkazuje na část popisných metadat příslušného svazku."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat DMDID rodičovského div. Každý token xs:IDREFS musí odkazovat na existující dmdSec téhož METS s popisem příslušného svazku; existence jiného libovolného ID nebo popisu jiné stránky nestačí."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "volume"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType/@DMDID; xs:IDREFS; optional"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
