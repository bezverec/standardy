schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-RELATED-EVENT-SEQUENCE"
title:
  cs: "Pořadí související události"
description:
  cs: "Vazby souborových objektů a událostí podle DMF Monografie 2.3; obecný model PREMIS 2.2 a obsah vzorového SIP jsou rozlišeny."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-RELATED-EVENT-SEQUENCE"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-relationships"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Doporučuje se zaznamenat pořadí související události."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: 1
      validations:
        -
          type: "custom"
          expression: "Doporučit nejvýše jeden relatedEventSequence v každé identifikaci události. Pokud je uveden, ověřit xs:nonNegativeInteger a smysluplné pořadí událostí; nepředepisovat tříciferný formát, jedničku jako počátek ani univerzální souvislou řadu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "ALTO"
        -
          field: "premis_object_type"
          operator: "equals"
          value: "file"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 79
      section: "7.5.1 PREMIS Object — relationship/relatedEventIdentification/relatedEventSequence"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "relatedEventIdentificationComplexType/relatedEventSequence (0–1); xs:nonNegativeInteger"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "75–76"
        section: "Legenda povinností a rozsah PREMIS Object"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených tabulkách s. 78–79 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. XPath kontrola první stránky dodaného SIP rozlišila přímé a vnořené odkazy; externí validátor nebyl spuštěn."
    interpretation:
      cs: "DMF má R a uvádí možnost určit pořadí z data události. Příklad 003 neznamená povinné tři číslice ani předepsaný počátek číslování. Nepřítomnost není porušením povinnosti M; pořadí se nesmí domyslet jen z pořadí elementů XML. Obecné XSD vyžaduje nezáporné celé číslo, je-li prvek uveden. Kardinalita platí v každém bezprostředním rodiči uvedené cesty. Kód R je převzat z DMF. Podmínka premis_object_type=file znamená rozlišený typ v namespace PREMIS, ne konkrétní XML prefix. ALTO odpovídá XML v tabulce. Custom kontroly registr nevykonává; jde o popis pro budoucí implementaci. Ve vztazích MC a ALTO první stránky vzoru relatedEventSequence chybí; při R nejde o chybějící povinný údaj a ukázková hodnota se nevymýšlí."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-RELATED-EVENT"
  -
    type: "related_to"
    target: "NDK-MONO-PREMIS-CREATION-DATETIME"
