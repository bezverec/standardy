schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-INFO-COLLECTION"
title:
  cs: "Příslušnost k projektu"
description:
  cs: "Požadavek na /info/collection v info.xml podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "NDK-INFO-COLLECTION"
    relation_to_target:
      type: "clarifies"
    category: "metadata/info"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na správu, inventář nebo integritu SIP v info.xml, nikoli na bibliografickou katalogizaci předlohy."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 17
          section: "7.1 Soubor info.xml — collection"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "recommended"
    obligation_code: "R"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "collection doporučeně popisuje projekt nebo větší celek, ke kterému balíček patří."
    requirement:
      presence: "optional"
      cardinality:
        min: 0
        max: 1
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "info"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 17
      section: "7.1 Soubor info.xml — collection"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "XML schéma info.xml pro tištěné dokumenty"
        version: "1.1"
        page: null
        section: "/info/collection"
        url: "https://standardy.ndk.cz/ndk/spec2014/info1_1.xsd"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis povinnosti ověřen vizuálně v tabulce DMF Monografie 2.3, § 7.1, s. 17. Struktura porovnána s oficiálním XSD info 1.1. Implementace nástrojů ani konkrétní SIP zde testovány nebyly."
    interpretation:
      cs: "Příklad ANL není předepsaná hodnota. Pokud balíček k většímu celku nepatří, údaj se nevymýšlí."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-INFO-INSTITUTION"
