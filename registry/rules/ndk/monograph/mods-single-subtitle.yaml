schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-MODS-SINGLE-SUBTITLE"
title:
  cs: "Podnázev svazku"
description:
  cs: "Názvové údaje MODS pro svazek jednosvazkové monografie podle DMF 2.3. Nevztahuje se automaticky na ostatní bibliografické úrovně."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "MODS-SUBTITLE"
    relation_to_target:
      type: "restricts"
    category: "metadata/mods-titles"
    cataloguing_rules: ["aacr2","rda"]
    cataloguing_scope:
      applicability: "applicable"
      reviewed_on: "2026-10-07"
      note:
        cs: "Společný přenos dostupného podnázvu; nepřepisuje zdrojový údaj podle druhého katalogizačního režimu."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 49
          section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — titleInfo"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 24
          section: "7.4 METS část dmdSec — Barevné kódování, rozlišení AACR2 a RDA"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory_if_available"
    obligation_code: "MA"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Dostupný podnázev svazku se uvede v subTitle příslušného titleInfo."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "Je-li podnázev dostupný ve zdrojovém bibliografickém popisu, požadovat jeho převzetí do mods:subTitle u správného titleInfo. Nenahrazovat podnázev prázdným elementem ani jej přiřazovat jinému druhu názvu."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "bibliographic_level"
          operator: "equals"
          value: "single_volume"
        -
          field: "element_role"
          operator: "equals"
          value: "mods_titleinfo"
        -
          field: "subtitle_available"
          operator: "equals"
          value: true
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 49
      section: "7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — titleInfo"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "MODS XML Schema"
        version: "3.8"
        page: null
        section: "titleInfoDefinition; modsGroup; globální element titleInfo"
        url: "https://www.loc.gov/standards/mods/v3/mods-3-8.xsd"
    verification:
      status: "verified"
      date: "2026-10-06"
      reference: "Požadavky porovnány s textem i vykreslenými tabulkami s. 48–49 DMF 2.3 a s titleInfoDefinition v oficiálním MODS XSD 3.8. Zdrojové ukázky mají XPath a SHA-256. Ověřen přepis, nikoli úplná validita SIP nebo implementace nástrojů."
    interpretation:
      cs: "MA nezavádí podnázev u dokumentu, který jej nemá. Dostupnost se posuzuje ve zdrojovém popisu, ne podle existence subTitle v posuzovaném XML. Zdrojový SIP podnázev neobsahuje; chybějící ukázka není důkazem volitelnosti při dostupném údaji. Kontext single_volume označuje popis svazku jednosvazkového dokumentu, nikoli hodnotu zvolenou podle úspěšnosti kontrolovaného XML. Role a dostupnost údajů vycházejí z nezávislého zdrojového popisu; neznámá dostupnost se nesmí zaměnit za false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-MODS-SINGLE-TITLEINFO"
