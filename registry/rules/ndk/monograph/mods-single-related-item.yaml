schema_version: "1.0"
kind: rule
id: NDK-MONO-MODS-SINGLE-RELATED-ITEM
title:
  cs: Související dokumenty a zdroje monografie
description:
  cs: Související zdroje v MODS svazku jednosvazkové monografie podle DMF 2.3.
national_standard:
  id: ndk-monograph
versions:
  - version: "2.3"
    status: normative
    target:
      entity: MODS-RELATED-ITEM
    relation_to_target:
      type: restricts
    category: metadata/mods-related-items
    cataloguing_rules:
      - aacr2
      - rda
    cataloguing_scope:
      applicability: applicable
      reviewed_on: 2026-10-14
      note:
        cs: Černé řádky relatedItem na s. 56–57 podle legendy s. 24 představují společný bibliografický předpis AACR2/RDA, nikoli technicky nezávislé pravidlo.
      sources:
        - document: DMF Monografie
          version: "2.3"
          page: 56
          section: 7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — relatedItem (s. 56–57)
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
        - document: DMF Monografie
          version: "2.3"
          page: 24
          section: 7.4 METS část dmdSec — povinnost rodiče a dětí; barevné kódování AACR2/RDA
          url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    obligation: recommended_if_available
    obligation_code: RA
    object_types:
      vocabulary: NDK-OBJECT-TYPES
      values:
        - monograph
    normative_requirement:
      cs: RelatedItem má povinnost RA. Uvádí informace o dokumentech, částech či zdrojích souvisejících s popisovaným dokumentem; použití vložených elementů MODS se řídí pravidly pro příslušné elementy.
    requirement:
      presence: optional
      cardinality:
        min: 0
        max: null
      validations:
        - type: custom
          expression: Při dostupnosti údajů o souvisejícím zdroji doporučit relatedItem. Nevytvářet prázdný rodič pouze kvůli doporučenému type. Nevynucovat jediný druh vztahu ani povinnou edici pro každý dokument.
    condition:
      all:
        - field: object_type
          operator: equals
          value: monograph
        - field: document_role
          operator: equals
          value: main_mets
        - field: bibliographic_level
          operator: equals
          value: single_volume
        - field: element_role
          operator: equals
          value: mods_record
    source:
      document: DMF Monografie
      version: "2.3"
      page: 56
      section: 7.4.1.3 Pole MODS a DC pro svazek jednosvazkové monografie — relatedItem (s. 56–57)
      url: https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf
    references:
      - document: MODS XML Schema
        version: "3.8"
        page: null
        section: modsDefinition; modsGroup; relatedItemDefinition; titleInfoDefinition
        url: https://www.loc.gov/standards/mods/v3/mods-3-8.xsd
      - document: MODS User Guidelines
        version: "3"
        page: null
        section: relatedItem — Guidelines for Use; Specific Attribute Information
        url: https://www.loc.gov/standards/mods/userguide/relateditem.html
    verification:
      status: verified
      date: 2026-10-14
      reference: Vizuálně ověřen přepis tabulky DMF s. 56–57 a legenda s. 24, deklarace XSD 3.8 a uvedené prameny LOC. Verified označuje přepis pramene; u ambiguous není nejasná sémantika tímto vyřešena. Nejde o ověření implementace.
    interpretation:
      cs: RA zachovává doporučení při dostupnosti, nikoli M. Kardinalita 0..n je na MODS záznam svazku. Obecné MODS dovoluje vložené prvky modsGroup bez obálky mods; nevytváří tím automatické národní povinnosti všech jejich dětí. Rozsah je přímé relatedItem v MODS svazku jednosvazkové monografie, nikoli vnořené relatedItem, titul vícesvazku, příloha, vnitřní část nebo stránka. Kontext a dostupnost zdrojových údajů se zjišťují nezávisle na kontrolovaném XML; neznámá hodnota není false. Custom kontroly registr nevykonává; implementace nástrojů nebyly ověřeny.
relations:
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-TYPE
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-OTHER-TYPE
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-OTHER-TYPE-URI
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-OTHER-TYPE-AUTH
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-OTHER-TYPE-AUTH-URI
  - type: related_to
    target: NDK-MONO-MODS-SINGLE-RELATED-ITEM-SERIES
