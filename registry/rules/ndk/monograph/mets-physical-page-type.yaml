schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-PAGE-TYPE"
title:
  cs: "Typ fyzické stránky podle Pravidel pro popis 2.4"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-TYPE"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Číselník typů stran podle Pravidel pro popis monografií 2.4; nejde o bibliografickou katalogizaci."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 92
          section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý stránkový div fyzické mapy má TYPE podle číselníku typů stran v Pravidlech pro popis monografií 2.4."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Požadovat TYPE stránkového div a hodnotu z prvních dvou sloupců tabulky 1.2.2 PPM 2.4. Nepoužít hodnoty určené pouze pro vnitřní části. U příslušného popisu PAGE porovnat s mods:genre/@type, nikoli s textem mods:genre; správnost přiřazení popisu konkrétní stránce musí být prokázána."
      allowed_values:
        - "cover"
        - "frontCover"
        - "backCover"
        - "appendix"
        - "errata"
        - "frontispiece"
        - "spine"
        - "impressum"
        - "normalPage"
        - "edge"
        - "imprimatur"
        - "blank"
        - "jacket"
        - "frontEndPaper"
        - "backEndPaper"
        - "frontEndSheet"
        - "backEndSheet"
        - "frontJacket"
        - "listOfIllustrations"
        - "listOfMaps"
        - "listOfTables"
        - "colophon"
        - "titlePage"
        - "flyleaf"
        - "bibliography"
        - "dedication"
        - "afterword"
        - "illustration"
        - "advertisement"
        - "map"
        - "sheetMusic"
        - "tableOfContents"
        - "preface"
        - "index"
        - "table"
        - "introduction"
        - "conclusion"
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "page"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "divType/@TYPE; xs:string; optional"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
      -
        document: "Pravidla pro popis monografií"
        version: "2.4"
        page: "8, 14"
        section: "1.2 Typ strany; 1.2.2 tabulka typů stran a vnitřních částí"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/ppp_mono_2.4_final.pdf"
