    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami 92–93 DMF 2.3 a s XSD METS 1.9.1. Typy stran doplněny podle tabulky PPM 2.4, s. 14; paginace podle s. 4–7 a tabulky PAGE v DMF, s. 73. Vzor ověřen XPath a SHA-256; externí validátor ani nástrojové implementace nebyly testovány."
    interpretation:
      cs: "37 hodnot tvoří sloupce Typ strany a Typ strany/Vnitřní část; třetí sloupec sem nepatří. Například chapter není typ fyzické stránky a reprePage je hodnota mods:genre pro reprezentativnost, nikoli jeho @type. PPM 2.4, s. 8, rozlišují povinné rozpoznání vybraných typů od dobrovolného podrobnějšího popisu; nevynucujeme výskyt všech 37 typů ani jejich skenování. Hodnoty se vážou na citovanou verzi, nikoli automaticky na budoucí vydání. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Úrovně volume/page označují pozici div ve fyzické mapě, nikoli testovanou hodnotu TYPE; hlavní a vedlejší METS zůstávají oddělené. Custom kontroly registr nevykonává, jsou popisem pro budoucí implementaci."
