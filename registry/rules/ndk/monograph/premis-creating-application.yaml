    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Přepis ověřen v textu i vykreslených stranách 77–78 DMF Monografie 2.3 a v oficiálním XSD PREMIS 2.2. Ukázky včetně originalName ověřeny v objektech první stránky dodaného SIP; externí validátor nebyl spuštěn."
    interpretation:
      cs: "DMF požaduje popsat skener, software vytvářející ALTO a software či kodek vytvářející MC podle role souboru. Zmínka XML/TXT v popisu nerozšiřuje použití PREMIS Object na OCR.TXT, které obecný rozsah § 7.5.1 vylučuje. XSD vyžaduje alespoň některý údaj v bloku; DMF požaduje jméno, verzi i datum. Blok lze opakovat, není předepsána jediná aplikace pro celý SIP. Kardinalita platí v každém bezprostředním rodiči uvedené cesty. Kód M je převzat z DMF. file_role ALTO odpovídá označení XML v tabulce; OCR.TXT a UC jsou mimo rozsah. premis_object_type označuje rozlišený typ file v namespace PREMIS, nezávisle na XML prefixu. Custom kontroly jsou popisem pro budoucí implementaci, registr je nevykonává."
