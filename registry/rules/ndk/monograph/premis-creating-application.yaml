schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-PREMIS-CREATING-APPLICATION"
title:
  cs: "Aplikace, v níž soubor vznikl"
description:
  cs: "Vznik a ochrana souborových objektů MC, PS a ALTO podle DMF Monografie 2.3; obecné schéma PREMIS 2.2 je evidováno samostatně."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "PREMIS-CREATING-APPLICATION"
    relation_to_target:
      type: "restricts"
    category: "technical/premis-provenance"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na ochranná metadata souborů, událostí nebo jejich původců. Nejde o bibliografické vztahy děl a tvůrců podle AACR2/RDA."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 78
          section: "7.5.1 PREMIS Object — objectCharacteristics/creatingApplication"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_code: "M"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Každý blok charakteristik obsahuje údaje o aplikaci nebo zařízení, které vytvořilo popisovaný soubor."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: null
      validations:
        -
          type: "custom"
          expression: "V každém objectCharacteristics požadovat alespoň jeden creatingApplication; v každém výskytu ověřit název, verzi a datum vytvoření popisovaného souboru. Nezaměňovat aplikaci vzniku s nástrojem, který soubor pouze validoval nebo spočítal checksum."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "amd_mets"
        -
          field: "file_role"
          operator: "in"
          value:
            - "MC"
            - "PS"
            - "ALTO"
        -
          field: "premis_object_type"
          operator: "equals"
          value: "file"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 78
      section: "7.5.1 PREMIS Object — objectCharacteristics/creatingApplication"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "PREMIS XML Schema"
        version: "2.2"
        page: null
        section: "objectCharacteristicsComplexType/creatingApplication (0–n); creatingApplicationComplexType"
        url: "https://www.loc.gov/standards/premis/v2/premis-v2-2.xsd"
      -
        document: "DMF Monografie"
        version: "2.3"
        page: "75–76"
        section: "Legenda povinností a rozsah PREMIS Object"
        url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
