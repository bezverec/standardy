schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-PHYSICAL-VOLUME-ADMID"
title:
  cs: "Vazba svazku na nepovinná autorskoprávní metadata"
description:
  cs: "Fyzická strukturální mapa hlavního METS podle DMF Monografie 2.3, s rozlišením obecných možností METS 1.9.1 a navazujících Pravidel pro popis monografií 2.4."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-DIV-ADMID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-physical"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 92
          section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Pokud jsou pro svazek vložena nepovinná autorskoprávní metadata, ADMID rodičovského div je s nimi propojuje. DMF popisuje cíl jako identifikátor amdSec."
    requirement:
      presence: "conditional"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Nezavádět povinnost vytvořit autorskoprávní metadata. Pokud jsou pro svazek vložena, požadovat ADMID; pokud je ADMID uveden, rozdělit jej jako xs:IDREFS a ověřit existenci a souvislost cílů se svazkem. Samostatně rozlišit cíl amdSec podle doslovného DMF a dílčí rightsMD podle dokumentace METS; bez rozhodnutí autority neoznačit jejich rozdíl za jednoznačný neúspěch NDK validace."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "volume"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 92
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
