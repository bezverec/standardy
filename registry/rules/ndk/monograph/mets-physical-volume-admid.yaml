    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami 92–93 DMF 2.3 a s XSD METS 1.9.1. Typy stran doplněny podle tabulky PPM 2.4, s. 14; paginace podle s. 4–7 a tabulky PAGE v DMF, s. 73. Vzor ověřen XPath a SHA-256; externí validátor ani nástrojové implementace nebyly testovány."
    interpretation:
      cs: "Podmíněnost je v požadavku presence=conditional a custom kontrole; pravidlo se neomezuje na existenci samotného ADMID, takže umí popsat i jeho chybění při vložených právech. Nejde o přidělení historického kódu MA. Dokumentace XSD pro div/@ADMID popisuje rightsMD/sourceMD/techMD/digiprovMD, kdežto DMF jmenuje kontejner amdSec. Samotný datový typ IDREFS sémantický typ cíle nerozliší. Žádný automatický přepis ADMID ve vzoru neprovádíme. Povinnosti jsou slovní, bez domyšleného kódu M/MA/R/RA/O. Úrovně volume/page označují pozici div ve fyzické mapě, nikoli testovanou hodnotu TYPE; hlavní a vedlejší METS zůstávají oddělené. Custom kontroly registr nevykonává, jsou popisem pro budoucí implementaci."
    discrepancies:
      -
        cs: "DMF 2.3, s. 92, popisuje ADMID jako ID amdSec, zatímco dokumentace divType/@ADMID v METS 1.9.1 uvádí dílčí administrativní záznamy, typicky rightsMD. Vzor má ADMID=AMD_MONOGRAPH_0001 na svazku a uvnitř takto označeného amdSec existuje rightsMD/@ID=RIGHTS_0001. Jde o doložený rozdíl popisů zdrojů, nikoli o výsledek externího validátoru. Zdroj: mets_75faba8d-c629-11f0-8950-12e8557df20e.xml, SHA-256 7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473, kontrola 2026-10-05."
