schema_version: "1.0"
kind: "rule"
id: "NDK-MONO-METS-FPTR-FILEID"
title:
  cs: "Vazby fyzické stránky na soubory"
description:
  cs: "fptr/@FILEID v hlavním METS podle DMF Monografie 2.3."
national_standard:
  id: "ndk-monograph"
versions:
  -
    version: "2.3"
    status: "normative"
    target:
      entity: "METS-FPTR-FILEID"
    relation_to_target:
      type: "restricts"
    category: "structure/mets-files"
    cataloguing_scope:
      applicability: "independent"
      reviewed_on: "2026-10-07"
      note:
        cs: "Požadavek na strukturu, obálku, inventář nebo vazby METS. Bibliografický obsah vložených či odkazovaných záznamů se tímto pravidlem nekatalogizuje."
      sources:
        -
          document: "DMF Monografie"
          version: "2.3"
          page: 93
          section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
          url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    obligation: "mandatory"
    obligation_source: "prose"
    object_types:
      vocabulary: "NDK-OBJECT-TYPES"
      values:
        - "monograph"
    normative_requirement:
      cs: "Fyzická stránka odkazuje přes fptr/@FILEID na své soubory MC, UC, ALTO, OCR a technického METS."
    requirement:
      presence: "required"
      cardinality:
        min: 1
        max: 1
      validations:
        -
          type: "custom"
          expression: "Pro každý stránkový div fyzické mapy ověřit odkazy fptr s FILEID na odpovídající soubory všech pěti reprezentací. Každé FILEID musí odkazovat právě na file v fileSec téhož METS, ve správné skupině a pro tutéž stránku; pouhá existence libovolného XML ID nestačí."
    condition:
      all:
        -
          field: "object_type"
          operator: "equals"
          value: "monograph"
        -
          field: "document_role"
          operator: "equals"
          value: "main_mets"
        -
          field: "structmap_type"
          operator: "equals"
          value: "PHYSICAL"
        -
          field: "structural_level"
          operator: "equals"
          value: "page"
    source:
      document: "DMF Monografie"
      version: "2.3"
      page: 93
      section: "7.7.1.1 Vyjádření fyzické strukturální mapy"
      url: "https://standardy.ndk.cz/ndk/standardy-digitalizace/DMF_monografie_2.3_final.pdf"
    references:
      -
        document: "METS XML Schema"
        version: "1.9.1"
        page: null
        section: "/mets:mets/mets:structMap[@TYPE='PHYSICAL']/mets:div/mets:div/mets:fptr/@FILEID"
        url: "https://www.loc.gov/standards/mets/version191/mets.xsd"
    examples:
      -
        id: "sip-main-mets-fptr-fileid"
        title:
          cs: "Odkazy první fyzické stránky"
        language: "xml"
        kind: "source_excerpt"
        code: |
          <mets:div ID="DIV_P_PAGE_0000" ORDER="1" ORDERLABEL="[1]" TYPE="titlePage" xmlns:mets="http://www.loc.gov/METS/">
            <mets:fptr FILEID="mc_0001" />
            <mets:fptr FILEID="uc_0001" />
            <mets:fptr FILEID="alto_0001" />
            <mets:fptr FILEID="txt_0001" />
            <mets:fptr FILEID="amd_0001" />
          </mets:div>
        note:
          cs: "Ukázka jedné stránky obsahuje pět odkazů; cílové záznamy file leží mimo tento výřez. Výřez ze zdrojového SIP, nikoli univerzální šablona ani výsledek úplné validace."
        source:
          document: "Vzorový SIP monografie dodaný uživatelem, 75faba8d-c629-11f0-8950-12e8557df20e"
          version: "DMF Monografie 2.3 (deklarováno v info.xml)"
          page: null
          section: "Hlavní METS"
          url: "https://owncloud.cesnet.cz/index.php/s/5ZXf1zfDQYiLgSl/download"
        file_path: "mets_75faba8d-c629-11f0-8950-12e8557df20e.xml"
        file_sha256: "7dcc4fe0de7f5eb1f9ea2eb260329957f956657fe5bf6b030fee1807e5741473"
        source_xpath: "/mets:mets/mets:structMap[@TYPE='PHYSICAL']/mets:div/mets:div[@ID='DIV_P_PAGE_0000']"
        namespaces:
          mets: "http://www.loc.gov/METS/"
          xlink: "http://www.w3.org/1999/xlink"
        checked_on: "2026-10-05"
    verification:
      status: "verified"
      date: "2026-10-05"
      reference: "Požadavek porovnán s textem a vykreslenými stranami DMF 2.3 a s XSD METS 1.9.1. Povinnost je vyjádřena slovně, zdroj v této části neuvádí kód M/MA/R/RA/O. Implementace nástrojů ani úplná validita SIP zde ověřeny nebyly."
    interpretation:
      cs: "Kardinalita 1–1 platí pro atribut každého přímého odkazu, nikoli pro počet fptr stránky. FILEID je XML IDREF na file/@ID v témže METS, ne cesta. Obecné METS dovoluje fptr bez FILEID při odkazu přes area/par/seq; toto pravidlo se nevztahuje na logickou mapu a její odkazy do bloků ALTO. V jedné odrážce DMF je překlep ftpr; správný název v XSD i dalších odrážkách je fptr. Úroveň Povinné je přepis slovního požadavku DMF; historický kód povinnosti záměrně nedoplňujeme. Kardinalita atributu/elementu se vztahuje k jeho rodiči (fileSec k hlavnímu METS, fileGrp k fileSec). Popis custom kontroly není spustitelný validační engine."
relations:
  -
    type: "related_to"
    target: "NDK-MONO-METS-PHYSICAL-PAGES"
  -
    type: "related_to"
    target: "NDK-MONO-METS-FILE-ID"
  -
    type: "related_to"
    target: "NDK-MONO-METS-FILE-GROUPS"
