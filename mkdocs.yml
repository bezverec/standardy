site_name: Standardy digitalizace kulturního dědictví
site_url: https://standardy.digitalizaty.cz

repo_name: bezverec/standardy/
repo_url: https://github.com/bezverec/standardy/

copyright: CC BY-SA 4.0

theme:
  name: material
  language: cs
  logo: assets/standardy.svg
  favicon: assets/standardy.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: grey
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Přepnout na tmavý režim

    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Přepnout na světlý režim

plugins:
  - search

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Domů: index.md
  - OpenEXR working paper: openexr-preservation-master.md
  - Vývoj registru:
      - Přehled a pokrytí: development/index.md
      - Architektura: development/architecture.md
      - Datový model: development/registry-data-model.md
      - Kategorie a graf vztahů: development/graph-and-categories.md
      - XML ukázky ze vzorového SIP: development/xml-examples.md
      - Případ ICC profile version: development/icc-profile-version.md
      - Rozměry, vzorkování a barva v MIX: development/mix-image-characteristics.md
      - Informace o balíčku info.xml: development/info-xml.md
      - Soubory a jejich vazby v METS: development/mets-files.md
      - Vedlejší METS a technická metadata: development/mets-amd.md
      - Identifikace, fixity a formát PREMIS Object: development/premis-object.md
      - Vznik a ochrana souboru v PREMIS: development/premis-provenance.md
      - Vazby objektů a událostí PREMIS: development/premis-relationships.md
      - Události PREMIS Event: development/premis-events.md
      - Původci událostí PREMIS Agent: development/premis-agents.md
      - Kořen a hlavička hlavního METS: development/mets-header.md
      - Fyzická mapa hlavního METS: development/mets-physical.md
      - Logická mapa a výčet stran: development/mets-logical.md
      - Vnitřní části monografie: development/mets-internal-parts.md
      - Blokové vazby METS–ALTO: development/mets-alto-links.md
      - Obálky MODS/DC v METS: development/mets-dmd.md
      - Názvové údaje MODS: development/mods-titles.md
      - Původci a role MODS: development/mods-names.md
      - Podrobnosti jmen MODS: development/mods-name-details.md
      - Typ dokumentu a žánr MODS: development/mods-resource-genre.md
      - Původ a místa vydání MODS: development/mods-origin.md
      - Nakladatelé a výrobci MODS: development/mods-origin-agents.md
      - Data vydání a dalších událostí MODS: development/mods-origin-dates.md
      - Lokální vývoj: development/local-development.md
