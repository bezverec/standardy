name: Deploy registry to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      REGISTRY_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run typecheck && npm test && npm run build
      - run: npx tsx scripts/prepare-wrangler-config.ts
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc
      - run: npx wrangler d1 execute DB --remote --file dist/registry/import.sql --config wrangler.deploy.jsonc
      - run: npx wrangler deploy --config wrangler.deploy.jsonc
